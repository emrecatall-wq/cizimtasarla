  var fG = document.getElementById('fGiris'), fT = document.getElementById('fTasarla');
  var bG = document.getElementById('mGiris'), bT = document.getElementById('mTasarla');

  function showMenu(m){
    var tas = (m === 'tasarla');
    fG.classList.toggle('off', tas);
    fT.classList.toggle('off', !tas);
    bG.classList.toggle('active', !tas);
    bT.classList.toggle('active', tas);
    try{
      var w = (tas ? fT : fG).contentWindow;
      if(w){ w.dispatchEvent(new Event('resize')); w.focus(); }
    }catch(e){}
  }
  bG.addEventListener('click', function(){ showMenu('giris'); });
  // Giriş'teki fotoğrafı (ve dolabın fotoğraftaki yerini) Tasarla'ya aktar
  function syncPhoto(force){
    try{
      var gw = fG.contentWindow, tw = fT.contentWindow;
      if(!gw || !tw || !gw.getTasarlaPhotoPayload || !tw.TasarlaApplyPhoto) return false;
      var p = gw.getTasarlaPhotoPayload();
      if(!p){
        if(force && tw.showCizgiToast) tw.showCizgiToast('Giriş menüsünde fotoğraf yok. Önce Giriş > Foto ile ekleyin');
        return false;
      }
      var ok = tw.TasarlaApplyPhoto(p, !!force);
      if(force && tw.showCizgiToast) tw.showCizgiToast('Fotoğraf ve dolap yeri Giriş çiziminden alındı');
      return ok;
    }catch(e){ return false; }
  }
  bT.addEventListener('click', function(){ showMenu('tasarla'); syncPhoto(false); });

  // Giriş'ten gelen veriyi Tasarla menüsüne geçirip uygula
  window.TasarlaApplyFromCizgi = function(payload){
    showMenu('tasarla');
    try{ fT.contentWindow.TasarlaApplyFromCizgi(payload); }catch(e){}
  };
  window.addEventListener('message', function(e){
    var d = e.data;
    if(!d || typeof d !== 'object') return;
    if(d.type === 'cizgi-to-tasarla') window.TasarlaApplyFromCizgi(d);
    else if(d.type === 'goto-menu') showMenu(d.menu === 'tasarla' ? 'tasarla' : 'giris');
    else if(d.type === 'request-photo') syncPhoto(true);
  });

  fG.srcdoc = decode(SRC_GIRIS);
  fT.srcdoc = decode(SRC_TASARLA);

  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
  }
})();
