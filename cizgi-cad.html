  showToast('Düzeltildi' + (pairId ? ' (' + (pairId) + ' çift çizgi = yan yana dolap)' : '') + '. Ölçü için "!" işaretlerine dokun (' + n + ' parça)', 3500);
}
// Kural: iki dikey arasına çizilen yatay (ya da tersi) dikeylerin dışına taşmaz.
// Uç, kestiği ilk dik parçada kesilir (taşan kısım parçanın %35'inden kısa olmalı; ortadan kesişmeler bozulmaz).
function skClipOvershoot(tol){
  const lim = 0.35, ct = tol * 0.5;   // kesişme sayılması için çizgi karşı parçanın gövdesinden geçmeli
  sk.items.forEach(it => {
    if(it.origin !== 'sketch' || it.dir === 'd' || it.j0 && it.j1) return;
    const L = it.s1 - it.s0; if(L <= 0) return;
    // dikey bir rafı geçerek aşağı/yukarı devam ediyorsa (ara dikme) kesilmez: sadece kısa taşmalar kesilir
    const maxOver = it.dir === 'v' ? Math.min(L * lim, 60 / scale) : L * lim;
    const cross = [];
    sk.items.forEach(o => {
      if(o === it || o.dir === 'd' || o.dir === it.dir) return;
      const b = skBand(o), lo = o.c + b[0], hi = o.c + b[1];
      const e0 = o.origin === 'import' ? skEnd(o, 0) : o.s0, e1 = o.origin === 'import' ? skEnd(o, 1) : o.s1;
      if(it.c < e0 - ct || it.c > e1 + ct) return;
      const mid = (lo + hi) / 2;
      if(mid <= it.s0 || mid >= it.s1) return;
      cross.push({ pos: mid, lo, hi, id: o.id });
    });
    shapes.forEach(sh => {
      if(sh.type !== 'mdf' || !sh.points || sh.points.length < 2) return;
      const c = getMdfCorners(sh.points[0], sh.points[1], sh.rawCursor), xs = c.map(q => q.x), ys = c.map(q => q.y);
      const r = { x0:Math.min(...xs), x1:Math.max(...xs), y0:Math.min(...ys), y1:Math.max(...ys) };
      const isV = (r.y1 - r.y0) > (r.x1 - r.x0);
      if(it.dir === 'h' && isV && it.c >= r.y0 - ct && it.c <= r.y1 + ct) cross.push({ pos:(r.x0 + r.x1) / 2, lo:r.x0, hi:r.x1, main:true });
      if(it.dir === 'v' && !isV && it.c >= r.x0 - ct && it.c <= r.x1 + ct) cross.push({ pos:(r.y0 + r.y1) / 2, lo:r.y0, hi:r.y1, main:true });
    });
    const inside = cross.filter(x => x.pos > it.s0 && x.pos < it.s1);
    if(!inside.length) return;
    inside.sort((a, b) => a.pos - b.pos);
    const first = inside[0], last = inside[inside.length - 1];
    let usedLeft = null;
    if(!it.j0 && first.pos - it.s0 < maxOver){
      usedLeft = first;
      if(first.main) it.s0 = first.hi; else { it.s0 = first.pos; it.j0 = { to:first.id, mode:'clip' }; }
    }
    if(!it.j1 && last !== usedLeft && it.s1 - last.pos < maxOver){
      if(last.main) it.s1 = last.lo; else { it.s1 = last.pos; it.j1 = { to:last.id, mode:'clip' }; }
    }
  });
}
// Kural: bir yatay (raf), içinden tam geçtiği dikeyde (ara dikme) iki ayrı rafa bölünür.
function skSplitAtDividers(tol){
  const ct = tol * 0.5;
  let order = sk.items.reduce((m, i) => Math.max(m, i.order || 0), 0);
  const add = [];
  sk.items.forEach(it => {
    if(it.origin !== 'sketch' || it.dir !== 'h') return;
    const cuts = [];
    sk.items.forEach(o => {
      if(o === it || o.dir !== 'v') return;
      const e0 = o.origin === 'import' ? skEnd(o, 0) : o.s0, e1 = o.origin === 'import' ? skEnd(o, 1) : o.s1;
      if(!(e0 < it.c - ct && e1 > it.c + ct)) return;             // dikme rafın iki yanına da uzanmalı
      const b = skBand(o), mid = o.c + (b[0] + b[1]) / 2;
      if(mid <= it.s0 + ct || mid >= it.s1 - ct) return;
      if((it.j0 && it.j0.to === o.id) || (it.j1 && it.j1.to === o.id)) return;
      cuts.push({ pos:mid, lo:o.c + b[0], hi:o.c + b[1], id:o.id });
    });
    shapes.forEach(sh => {
      if(sh.type !== 'mdf' || !sh.points || sh.points.length < 2) return;
      const c = getMdfCorners(sh.points[0], sh.points[1], sh.rawCursor), xs = c.map(q => q.x), ys = c.map(q => q.y);
      const r = { x0:Math.min(...xs), x1:Math.max(...xs), y0:Math.min(...ys), y1:Math.max(...ys) };
      if((r.y1 - r.y0) <= (r.x1 - r.x0) || !(r.y0 < it.c - ct && r.y1 > it.c + ct)) return;
      const mid = (r.x0 + r.x1) / 2;
      if(mid <= it.s0 + ct || mid >= it.s1 - ct) return;
      cuts.push({ pos:mid, lo:r.x0, hi:r.x1, main:true });
    });
    if(!cuts.length) return;
    cuts.sort((a, b) => a.pos - b.pos);
    const endJ = it.j1, endS = it.s1;
    let cur = it;
    cuts.forEach(cu => {
      if(cu.main){ cur.s1 = cu.lo; cur.j1 = null; } else { cur.s1 = cu.pos; cur.j1 = { to:cu.id, mode:'clip' }; }
      const n = { id: sk.nextId++, origin:'sketch', order: ++order, lenOk:false, posOk:false, dir:'h', c:it.c, j0:null, j1:null };
      if(cu.main) n.s0 = cu.hi; else { n.s0 = cu.pos; n.j0 = { to:cu.id, mode:'clip' }; }
      add.push(n); cur = n;
    });
    cur.s1 = endS; cur.j1 = endJ;
  });
  add.forEach(n => sk.items.push(n));
}
// Uçları dik parçalara bağla (köşe ve T birleşim); bağlanamazsa Çizim sayfasındaki MDF'nin yüzüne daya
function skJoinAll(tol){
  for(let pass = 0; pass < 2; pass++){
    sk.items.forEach(it => {
      if(it.origin !== 'sketch' || it.dir === 'd') return;
      [0, 1].forEach(k => {
        if(k ? it.j1 : it.j0) return;
        const s = k ? it.s1 : it.s0;
        const P = it.dir === 'h' ? { x:s, y:it.c } : { x:it.c, y:s };
        let best = null, bd = Infinity;
        sk.items.forEach(o => {
          if(o === it || o.dir === 'd' || o.dir === it.dir) return;
          const r = skRect(o);
          const along = it.dir === 'h' ? P.x : P.y;            // bu parçanın ucunun konumu
          const across = it.dir === 'h' ? P.y : P.x;           // karşı parçanın ekseni boyunca konum
          const b = skBand(o), lo = o.c + b[0], hi = o.c + b[1];
          const dist = along < lo ? lo - along : along > hi ? along - hi : 0;
          const e0 = o.dir === 'v' ? r.y0 : r.x0, e1 = o.dir === 'v' ? r.y1 : r.x1;
          if(dist <= tol && across >= e0 - tol && across <= e1 + tol && dist < bd){ bd = dist; best = o; }
        });
        if(best){ const j = { to:best.id, mode:'clip' }; if(k) it.j1 = j; else it.j0 = j; return; }
        if(pass === 1) skSnapToMain(it, k, tol);
      });
    });
  }
}
function skSnapToMain(it, k, tol){
  const s = k ? it.s1 : it.s0;
  for(const sh of shapes){
    if(sh.type !== 'mdf' || !sh.points || sh.points.length < 2) continue;
    const c = getMdfCorners(sh.points[0], sh.points[1], sh.rawCursor);
    const xs = c.map(q => q.x), ys = c.map(q => q.y);
    const r = { x0:Math.min(...xs), x1:Math.max(...xs), y0:Math.min(...ys), y1:Math.max(...ys) };
    if(it.dir === 'h'){
      if((r.y1 - r.y0) < (r.x1 - r.x0)) continue;              // dik (düşey) parça olmalı
      if(it.c < r.y0 - tol || it.c > r.y1 + tol) continue;
      if(s >= r.x0 - tol && s <= r.x1 + tol){ if(k) it.s1 = r.x0; else it.s0 = r.x1; return; }
    } else {
      if((r.x1 - r.x0) < (r.y1 - r.y0)) continue;
      if(it.c < r.x0 - tol || it.c > r.x1 + tol) continue;
      if(s >= r.y0 - tol && s <= r.y1 + tol){ if(k) it.s1 = r.y0; else it.s0 = r.y1; return; }
    }
  }
}
// Gruplar: dış çerçeve (kalınlık içeri) / iç parça (kalınlık ortada); birleşim türü önceliğe göre
function skRoles(tol){
  const items = sk.items.filter(i => i.origin === 'sketch' && i.dir !== 'd');
  const par = new Map(); items.forEach(i => par.set(i.id, i.id));
  const find = x => { while(par.get(x) !== x){ par.set(x, par.get(par.get(x))); x = par.get(x); } return x; };
  items.forEach(i => [i.j0, i.j1].forEach(j => { if(j && par.has(j.to)) par.set(find(i.id), find(j.to)); }));
  const groups = new Map();
  items.forEach(i => { const r = find(i.id); if(!groups.has(r)) groups.set(r, []); groups.get(r).push(i); });
  groups.forEach(g => {
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    g.forEach(i => {
      if(i.dir === 'h'){ minY = Math.min(minY, i.c); maxY = Math.max(maxY, i.c); minX = Math.min(minX, i.s0); maxX = Math.max(maxX, i.s1); }
      else { minX = Math.min(minX, i.c); maxX = Math.max(maxX, i.c); minY = Math.min(minY, i.s0); maxY = Math.max(maxY, i.s1); }
    });
    const T = sk.out === 'line' ? 0 : SK_T;
    g.forEach(i => {
      i.kind = sk.out === 'line' ? 'line' : 'mdf';
      const solo = g.length === 1;
      if(!solo && i.dir === 'h' && Math.abs(i.c - minY) <= tol){ i.role = 'outline'; i.band = [0, T]; }
      else if(!solo && i.dir === 'h' && Math.abs(i.c - maxY) <= tol){ i.role = 'outline'; i.band = [-T, 0]; }
      else if(!solo && i.dir === 'v' && Math.abs(i.c - minX) <= tol){ i.role = 'outline'; i.band = [0, T]; }
      else if(!solo && i.dir === 'v' && Math.abs(i.c - maxX) <= tol){ i.role = 'outline'; i.band = [-T, 0]; }
      else { i.role = 'interior'; i.band = [-T / 2, T / 2]; }
    });
  });
  // birleşim türü: önceliği yüksek olan karşı parçanın dış yüzüne kadar uzanır, düşük olan iç yüzde durur
  items.forEach(i => [i.j0, i.j1].forEach(j => {
    if(!j) return; const o = skItem(j.to); if(!o) return;
    j.mode = skPrio(o) > skPrio(i) ? 'clip' : 'over';
  }));
}
function skApplyPins(){
  sk.items.forEach(it => {
    const p = it.pin; if(!p) return;
    const b = skBand(it);
    if(it.dir === 'h' && p.axis === 'y'){ it.c = p.sign < 0 ? p.y - b[1] : p.y - b[0]; it.posOk = true; }
    else if(it.dir === 'v' && p.axis === 'x'){ it.c = p.sign > 0 ? p.x - b[0] : p.x - b[1]; it.posOk = true; }
    else if(it.dir === 'h'){ it.c = p.y; }
    else if(it.dir === 'v'){ it.c = p.x; }
    delete it.pin;
  });
}
// İç parçanın boşluğu: yatayda altındaki parçaya, düşeyde solundaki parçaya kadar net mesafe
function skGap(it){
  if(it.dir === 'd' || it.role !== 'interior') return null;
  const r = skRect(it); let best = null;
  sk.items.forEach(o => {
    if(o === it || o.dir !== it.dir) return;
    const q = skRect(o);
    if(it.dir === 'h'){
      if(q.x1 <= r.x0 || q.x0 >= r.x1 || q.y0 < r.y1 - 0.01) return;
      const g = q.y0 - r.y1; if(!best || g < best.gap) best = { gap:g, o };
    } else {
      if(q.y1 <= r.y0 || q.y0 >= r.y1 || q.x1 > r.x0 + 0.01) return;
      const g = r.x0 - q.x1; if(!best || g < best.gap) best = { gap:g, o };
    }
  });
  return best;
}
function skSetLen(it, val){
  const d = val - skLen(it);
  if(it.dir === 'd'){ const L = skLen(it) || 1; it.b = { x: it.a.x + (it.b.x - it.a.x) / L * val, y: it.a.y + (it.b.y - it.a.y) / L * val }; it.lenOk = true; return; }
  // v16.35: sol alt köşe sabit. Yatay → sağ uç kayar; dikey → üst uç kayar.
  // İç raf/dikme bir ucuyla iç parçaya (ara dikme / raf) bağlıysa o iç parça kayar (dış yan sabit kalır).
  const jo = j => { const o = j ? skItem(j.to) : null; return (o && o.dir !== it.dir && o.dir !== 'd') ? o : null; };
  const o0 = jo(it.j0), o1 = jo(it.j1), inner = o => !!(o && o.role === 'interior');
  let mv = it.dir === 'v' ? 0 : 1;
  if(inner(o0) && !inner(o1)) mv = 0; else if(inner(o1) && !inner(o0)) mv = 1;
  const o = mv ? o1 : o0;
  if(o) o.c += mv ? d : -d;        // bağlı parça kayar, ona bağlı her şey (karşı kenar, raflar) uyar
  else if(mv) it.s1 += d; else it.s0 -= d;
  it.lenOk = true;
}
function skSetGap(it, val){
  const g = skGap(it); if(!g) return;
  const d = val - g.gap;
  if(it.dir === 'h') it.c -= d; else it.c += d;
  it.posOk = true;
}

// --- Çizim ---
function skDrawLayer(){
  ctx.save();
  const W = p => worldToScreen(p);
  // parçalar
  sk.items.forEach(it => {
    ctx.lineWidth = 1.6;
    ctx.strokeStyle = it.origin === 'import' ? '#9ccc65' : '#4fc3f7';
    ctx.fillStyle = it.origin === 'import' ? 'rgba(156,204,101,0.18)' : 'rgba(79,195,247,0.18)';
    if(it.dir === 'd'){ const a = W(it.a), b = W(it.b); ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.lineWidth = 2.2; ctx.stroke(); return; }
    const r = skRect(it), a = W({ x:r.x0, y:r.y0 }), b = W({ x:r.x1, y:r.y1 });
    if(Math.abs(b.x - a.x) < 1.2 || Math.abs(b.y - a.y) < 1.2){ ctx.lineWidth = 2.2; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
    else { ctx.fillRect(a.x, a.y, b.x - a.x, b.y - a.y); ctx.strokeRect(a.x, a.y, b.x - a.x, b.y - a.y); }
  });
  // ham kalem çizgileri
  const strokeLine = (pts, col, w) => { if(pts.length < 2) return; ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.beginPath(); const p0 = W(pts[0]); ctx.moveTo(p0.x, p0.y); for(let i = 1; i < pts.length; i++){ const q = W(pts[i]); ctx.lineTo(q.x, q.y); } ctx.stroke(); };
  sk.strokes.forEach(st => strokeLine(st.pts, '#e8e8e8', 2.2));
  if(skCur && skCur.pts) strokeLine(skCur.pts, '#ffb454', 2.4);
  // mesafe noktaları (köşeden ölçülü başlangıç)
  sk.pins.forEach(p => { const q = W(p); ctx.fillStyle = '#ff5c5c'; ctx.beginPath(); ctx.arc(q.x, q.y, 6, 0, Math.PI * 2); ctx.fill(); });
  if(skRef){ const q = W(skRef); ctx.strokeStyle = '#ff5c5c'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(q.x, q.y, 11, 0, Math.PI * 2); ctx.stroke(); }
  // "!" ölçü işaretleri
  skMarkerBoxes = [];
  ctx.font = '600 12px -apple-system, sans-serif'; ctx.textBaseline = 'middle';
  const marker = (x, y, txt, ok, imp, item, kind) => {
    if(skDims === 'off' || (skDims === 'todo' && (ok || imp))) return;
    const w = ctx.measureText(txt).width + 14, h = 22;
    const bx = x - w / 2, by = y - h / 2;
    ctx.fillStyle = 'rgba(16,18,20,0.92)';
    ctx.strokeStyle = imp ? '#9ccc65' : ok ? '#50c878' : '#ff9800';
    ctx.lineWidth = 1.4; roundRect(bx, by, w, h, 6); ctx.fill(); ctx.stroke();
    ctx.fillStyle = imp ? '#c5e1a5' : ok ? '#7ee2a0' : '#ffb454'; ctx.textAlign = 'center'; ctx.fillText(txt, x, y + 0.5);
    skMarkerBoxes.push({ x0:bx - 4, y0:by - 4, x1:bx + w + 4, y1:by + h + 4, item, kind });
  };
  sk.items.forEach(it => {
    const imp = it.origin === 'import';
    let mid;
    if(it.dir === 'd') mid = W({ x:(it.a.x + it.b.x) / 2, y:(it.a.y + it.b.y) / 2 });
    else { const r = skRect(it); mid = W({ x:(r.x0 + r.x1) / 2, y:(r.y0 + r.y1) / 2 }); }
    const off = it.dir === 'v' ? { x:0, y:-14 } : { x:0, y:-16 };
    marker(mid.x + off.x, mid.y + off.y, (it.lenOk || imp ? '' : '! ') + fmtLenPlain(skLen(it)), it.lenOk, imp, it, 'len');
    const g = skGap(it);
    if(g){
      const r = skRect(it);
      const p = it.dir === 'h' ? W({ x:r.x0 + (r.x1 - r.x0) * 0.22, y:(r.y1 + g.o.c + skBand(g.o)[0]) / 2 }) : W({ x:(r.x0 + g.o.c + skBand(g.o)[1]) / 2, y:r.y0 + (r.y1 - r.y0) * 0.25 });
      marker(p.x, p.y, (it.posOk ? '' : '! ') + (it.dir === 'h' ? 'alt boşluk ' : 'sol boşluk ') + fmtLenPlain(g.gap), it.posOk, false, it, 'gap');
    }
  });
  ctx.restore();
}

// --- Ölçü kutusu: kalemle yaz (Samsung el yazısı) ya da 🎙 ile söyle ---
function skAskNumber(title, initialCm, onOk){
  const m = csvModalBase(title);
  const inp = document.createElement('input');
  inp.type = 'text'; inp.inputMode = 'decimal'; inp.autocomplete = 'off';
  inp.value = initialCm != null ? String(initialCm).replace('.', ',') : '';
  inp.style.cssText = 'width:100%;box-sizing:border-box;font-size:34px;font-weight:700;padding:12px 14px;border-radius:10px;border:2px solid #ffb454;background:#121316;color:#ffb454;text-align:center;';
  const unit = document.createElement('div'); unit.style.cssText = 'text-align:center;color:#9aa0a6;margin:4px 0 8px;font-size:13px;';
  unit.textContent = 'cm — kalemle kutunun içine yaz ya da 🎙 düğmesine basıp söyle (örn: 192,3)';
  const heard = document.createElement('div'); heard.style.cssText = 'text-align:center;color:#ffb454;min-height:18px;font-size:13px;';
  m.body.append(inp, unit, heard);
  let rec = null;
  const mic = csvBtn('🎙 Söyle', () => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){ heard.textContent = 'Bu cihazda ses tanıma yok'; return; }
    try{ if(recognition) recognition.stop(); }catch(e){}
    rec = new SR(); rec.lang = 'tr-TR'; rec.interimResults = true; rec.continuous = false;
    heard.textContent = '🎙 dinliyor…';
    rec.onresult = ev => {
      let t = ''; let fin = false;
      for(let i = ev.resultIndex; i < ev.results.length; i++){ t += ev.results[i][0].transcript; if(ev.results[i].isFinal) fin = true; }
      const v = parseTurkishVoiceInput(String(t).toLowerCase());
      heard.textContent = '🎙 "' + t + '"' + (v ? ' → ' + v + ' cm' : '');
      if(v) inp.value = v;
      if(fin && v) setTimeout(ok, 350);
    };
    rec.onerror = () => { heard.textContent = '🎙 anlaşılamadı, tekrar dene'; };
    try{ rec.start(); }catch(e){}
  });
  const ok = () => {
    const mm = parseCmInputToMm(inp.value);
    if(isNaN(mm) || mm <= 0){ inp.style.borderColor = '#ff5c5c'; return; }
    try{ if(rec) rec.stop(); }catch(e){}
    m.close(); onOk(mm);
  };
  inp.addEventListener('keydown', e => { if(e.key === 'Enter') ok(); });
  m.foot.append(mic, csvBtn('İptal', () => { try{ if(rec) rec.stop(); }catch(e){} m.close(); }), csvBtn('Tamam', ok, true));
  setTimeout(() => { try{ inp.focus(); inp.select(); }catch(e){} }, 120);
}
function skEditMarker(mk){
  const it = mk.item;
  if(mk.kind === 'len'){
    skAskNumber('Parça boyu (kesim ölçüsü)', fmtLenPlain(skLen(it)), mm => { skPush(); skSetLen(it, mm); skSave(); render(); });
  } else {
    const g = skGap(it); if(!g) return;
    skAskNumber(it.dir === 'h' ? 'Rafın altındaki net boşluk' : 'Dikmenin solundaki net boşluk', fmtLenPlain(g.gap), mm => { skPush(); skSetGap(it, mm); skSave(); render(); });
  }
}

// --- Gönder ---
function skSendToDraw(){
  if(sk.strokes.length){ showToast('Önce "Düzelt"e bas (kalem çizgileri henüz düzeltilmedi)', 3500); return; }
  if(!sk.items.length){ showToast('Elle Çiz sayfasında gönderilecek parça yok'); return; }
  const prevSk = JSON.stringify(sk);
  pushHistory(); skPush();
  skLinks.push({ top: undoStack[undoStack.length - 1], skTop: skUndoStack[skUndoStack.length - 1], sk: prevSk }); if(skLinks.length > 30) skLinks.shift();
  let n = 0;
  sk.items.forEach(it => {
    const isLine = it.kind === 'line';
    if(it.dir === 'd'){
      const a = new Point(it.a.x, it.a.y), b = new Point(it.b.x, it.b.y);
      if(isLine || it.origin === 'import' && it.kind === 'line') addShape({ type:'line', points:[a, b], label:'', note:'' });
      else { const nx = -(b.y - a.y), ny = b.x - a.x; addShape({ type:'mdf', points:[a, b], rawCursor:new Point((a.x + b.x) / 2 + nx, (a.y + b.y) / 2 + ny), label:'', note:'' }); }
      n++; return;
    }
    const r = skRect(it);
    const thick = it.dir === 'h' ? r.y1 - r.y0 : r.x1 - r.x0;
    if(thick < 0.5){
      const pts = it.dir === 'h' ? [new Point(r.x0, it.c), new Point(r.x1, it.c)] : [new Point(it.c, r.y0), new Point(it.c, r.y1)];
      addShape({ type:'line', points:pts, label:'', note:'' });
    } else if(it.dir === 'h'){
      addShape({ type:'mdf', points:[new Point(r.x0, r.y0), new Point(r.x1, r.y0)], rawCursor:new Point((r.x0 + r.x1) / 2, r.y1), label:'', note:'' });
    } else {
      addShape({ type:'mdf', points:[new Point(r.x0, r.y0), new Point(r.x0, r.y1)], rawCursor:new Point(r.x1, (r.y0 + r.y1) / 2), label:'', note:'' });
    }
    n++;
  });
  sk.items = []; sk.pins = [];
  skSave(); autosave();
  skSetPage('draw');
  showToast(n + ' parça Çizim sayfasına gönderildi (Geri Al ile geri alınır)', 3500);
}
function skImportFromDraw(){
  const sel = shapes.filter(s => selectedShapes.has(s.id));
  const src = (sel.length ? sel : shapes).filter(s => (s.type === 'mdf' || s.type === 'line') && s.points && s.points.length >= 2);
  if(!src.length){ showToast('Gönderilecek çizgi/MDF yok'); return; }
  const prevSk = JSON.stringify(sk);
  pushHistory(); skPush();
  skLinks.push({ top: undoStack[undoStack.length - 1], skTop: skUndoStack[skUndoStack.length - 1], sk: prevSk }); if(skLinks.length > 30) skLinks.shift();
  let order = sk.items.reduce((m, i) => Math.max(m, i.order || 0), 0);
  const added = [];
  src.forEach(s => {
    const it = { id: sk.nextId++, origin:'import', order: ++order, lenOk:true, posOk:true, j0:null, j1:null, role:'import', kind: s.type === 'line' ? 'line' : 'mdf' };
    if(s.type === 'mdf'){
      const c = getMdfCorners(s.points[0], s.points[1], s.rawCursor), xs = c.map(q => q.x), ys = c.map(q => q.y);
      const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
      const w = x1 - x0, h = y1 - y0;
      if(h <= SK_T + 0.6 && w > h){ it.dir = 'h'; it.c = y0; it.band = [0, h]; it.s0 = x0; it.s1 = x1; }
      else if(w <= SK_T + 0.6 && h > w){ it.dir = 'v'; it.c = x0; it.band = [0, w]; it.s0 = y0; it.s1 = y1; }
      else { it.dir = 'd'; it.a = { x:s.points[0].x, y:s.points[0].y }; it.b = { x:s.points[1].x, y:s.points[1].y }; }
    } else {
      const a = s.points[0], b = s.points[1];
      if(Math.abs(a.y - b.y) < 0.5){ it.dir = 'h'; it.c = a.y; it.band = [0, 0]; it.s0 = Math.min(a.x, b.x); it.s1 = Math.max(a.x, b.x); }
      else if(Math.abs(a.x - b.x) < 0.5){ it.dir = 'v'; it.c = a.x; it.band = [0, 0]; it.s0 = Math.min(a.y, b.y); it.s1 = Math.max(a.y, b.y); }
      else { it.dir = 'd'; it.a = { x:a.x, y:a.y }; it.b = { x:b.x, y:b.y }; }
    }
    sk.items.push(it); added.push(it);
  });
  // değen parçaları birbirine bağla: bir ölçü değişince bağlılar da kayar
  added.forEach(it => {
    if(it.dir === 'd') return;
    [0, 1].forEach(k => {
      const s = k ? it.s1 : it.s0;
      for(const o of added){
        if(o === it || o.dir === 'd' || o.dir === it.dir) continue;
        const b = skBand(o), lo = o.c + b[0], hi = o.c + b[1];
        const oe0 = o.s0 - 0.6, oe1 = o.s1 + 0.6;
        if(it.c + skBand(it)[1] < oe0 - 0.6 || it.c + skBand(it)[0] > oe1 + 0.6) continue;   // bu parça diğerinin boyu içinde ya da ucuna değiyor
        const bodyPos = (k === 0);
        if(Math.abs(s - (bodyPos ? hi : lo)) < 0.6){ const j = { to:o.id, mode:'clip' }; if(k) it.j1 = j; else it.j0 = j; break; }
        if(Math.abs(s - (bodyPos ? lo : hi)) < 0.6 && hi - lo > 0.5){ const j = { to:o.id, mode:'over' }; if(k) it.j1 = j; else it.j0 = j; break; }
      }
    });
  });
  shapes = shapes.filter(s => !src.includes(s));
  selectedShapes.clear();
  autosave(); skSave();
  skSetPage('sketch');
  showToast(src.length + ' parça Elle Çiz sayfasına alındı. Ölçülere dokunup değiştirebilirsin.', 3500);
}

// --- Silgi ve temizle ---
let skErase = false, skEraseBtn = null;
function skClearAll(){
  if(!sk.items.length && !sk.strokes.length && !sk.pins.length){ showToast('Elle Çiz sayfası zaten boş'); return; }
  if(!confirm('Elle Çiz sayfasındaki her şey silinsin mi? (Geri ile geri alınabilir)')) return;
  skPush(); sk.strokes = []; sk.items = []; sk.pins = []; skSave(); render();
  showToast('Elle Çiz sayfası temizlendi');
}
function skDistSeg(p, a, b){
  const dx = b.x - a.x, dy = b.y - a.y, L2 = dx * dx + dy * dy;
  let t = L2 ? ((p.x - a.x) * dx + (p.y - a.y) * dy) / L2 : 0; t = Math.max(0, Math.min(1, t));
  return Math.hypot(p.x - (a.x + t * dx), p.y - (a.y + t * dy));
}
// Dokunulan yerdeki parçayı / ham çizgiyi / kırmızı noktayı siler. true: bir şey silindi
// v16.36: silgi ayarı (bu cihazda kalır): 'part' = gerçek silgi gibi sadece üzerinden geçtiği kısım, 'all' = dokunulan çizginin tamamı
let skErasePart = true;
try{ skErasePart = localStorage.getItem('cizgi_sk_erase') !== 'all'; }catch(e){}
let skEraseDragPushed = false;
function skEraseAt(w){
  const tol = Math.max(16, SNAP_SENS_PX[snapSens] || 30) / scale;
  if(skErasePart){
    // kalem çizgilerinden sadece silginin değdiği kısım silinir; çizgi gerekirse ikiye bölünür
    let changed = false;
    const inC = q => Math.hypot(q.x - w.x, q.y - w.y) < tol;
    const out = [];
    sk.strokes.forEach(st => {
      const pts = st.pts || [];
      if(!pts.some((q, k) => inC(q) || (k < pts.length - 1 && skDistSeg(w, q, pts[k + 1]) < tol))){ out.push(st); return; }
      changed = true;
      let cur = [];
      const flush = () => { if(cur.length >= 2) out.push(Object.assign({}, st, { pts:cur, pin: out.some(o => o.pin === st.pin) ? null : st.pin })); cur = []; };
      pts.forEach((q, k) => {
        if(inC(q)){ flush(); return; }
        if(cur.length && skDistSeg(w, cur[cur.length - 1], q) < tol){ flush(); }
        cur.push(q);
      });
      flush();
    });
    if(changed){
      if(!skEraseDragPushed){ skPush(); skEraseDragPushed = true; }
      sk.strokes = out;
      return true;
    }
  }
  for(let i = sk.strokes.length - 1; i >= 0; i--){
    const pts = sk.strokes[i].pts;
    for(let k = 0; k < pts.length - 1; k++) if(skDistSeg(w, pts[k], pts[k + 1]) < tol){ skPush(); sk.strokes.splice(i, 1); return true; }
  }
  for(let i = sk.pins.length - 1; i >= 0; i--) if(Math.hypot(w.x - sk.pins[i].x, w.y - sk.pins[i].y) < tol){ skPush(); sk.pins.splice(i, 1); return true; }
  for(let i = sk.items.length - 1; i >= 0; i--){
    const it = sk.items[i]; let hit;
    if(it.dir === 'd') hit = skDistSeg(w, it.a, it.b) < tol;
    else { const r = skRect(it); hit = w.x >= Math.min(r.x0, r.x1) - tol && w.x <= Math.max(r.x0, r.x1) + tol && w.y >= Math.min(r.y0, r.y1) - tol && w.y <= Math.max(r.y0, r.y1) + tol; }
    if(!hit) continue;
    skPush();
    // bu parçaya bağlı uçlar serbest kalsın (bulundukları yerde)
    sk.items.forEach(o => { if(o === it || o.dir === 'd') return; [0, 1].forEach(k => { const j = k ? o.j1 : o.j0; if(j && j.to === it.id){ const v = skEnd(o, k); if(k){ o.s1 = v; o.j1 = null; } else { o.s0 = v; o.j0 = null; } } }); });
    sk.items.splice(i, 1);
    return true;
  }
  return false;
}

  b.addEventListener('click', function(){

      { icon: onSk ? '📐' : '✍️', label: onSk ? 'Çizim sayfasına dön' : 'Elle Çiz sayfasına geç', onClick:() => skSetPage(onSk ? 'draw' : 'sketch') },
      { icon:'✨', label:'Düzelt', onClick:() => { if(!onSk) skSetPage('sketch'); skFix(); } },
      onSk ? { icon:'➡️', label:'Çizim sayfasına gönder', onClick:skSendToDraw }
           : { icon:'⬅️', label:'Seçilenleri (yoksa hepsini) Elle Çiz\'e gönder', onClick:skImportFromDraw },
      { icon: sk.out === 'line' ? '╱' : '▬', label:'Sonuç: ' + (sk.out === 'line' ? 'Çizgi' : '18 mm MDF') + ' (değiştir)', keepOpen:true, onClick:(el) => {
          skPush(); sk.out = sk.out === 'line' ? 'mdf' : 'line'; skRoles(skTolW()); skSave(); render();
          el.querySelector('span:last-child').textContent = 'Sonuç: ' + (sk.out === 'line' ? 'Çizgi' : '18 mm MDF') + ' (değiştir)';
          el.querySelector('.ic').textContent = sk.out === 'line' ? '╱' : '▬';
        } },
      { icon: sk.topOver ? '☑' : '☐', label:'Tavan/taban yanların üstünde', keepOpen:true, onClick:(el) => {
          skPush(); sk.topOver = !sk.topOver; skRoles(skTolW()); skSave(); render();
          el.querySelector('.ic').textContent = sk.topOver ? '☑' : '☐';
        } },
      { icon:'🧽', label:'Silgi: ' + (skErasePart ? 'parça parça (gerçek silgi gibi)' : 'dokunulan çizginin tamamı') + ' (değiştir)', keepOpen:true, onClick:(el) => {
          skErasePart = !skErasePart; try{ localStorage.setItem('cizgi_sk_erase', skErasePart ? 'part' : 'all'); }catch(e){}
          el.querySelector('span:last-child').textContent = 'Silgi: ' + (skErasePart ? 'parça parça (gerçek silgi gibi)' : 'dokunulan çizginin tamamı') + ' (değiştir)';
        } },
      { icon: skLock ? '🔒' : '🔓', label:'Ekran kilidi: ' + (skLock ? 'kilitli' : 'açık') + ' (alttaki 🔓 Kilit düğmesi)', onClick:() => { const b = [...document.querySelectorAll('#pageTabs .ptb')].find(x => /Kilit/.test(x.textContent)); if(b) b.click(); } },
      { icon:'🧹', label:'Elle çizimi temizle', onClick:skClearAll },
      { icon:'📐', label:'Ekran ölçü ayarı (gerçek 1 cm)', onClick: openScreenCalib },
    ]);
  });
  // Elle Çiz sayfasında üstteki "Geri Al" elle çizimi geri alsın
  const undoBtn = document.getElementById('btnUndo');
  if(undoBtn) undoBtn.addEventListener('click', e => { if(skPage === 'sketch'){ e.stopImmediatePropagation(); skUndo(); } else skHookMainUndo(); }, true);
  const redoBtn = document.getElementById('btnRedo');
  if(redoBtn) redoBtn.addEventListener('click', e => { if(skPage === 'sketch'){ e.stopImmediatePropagation(); skRedo(); } }, true);
  document.addEventListener('keydown', e => { if(skPage === 'sketch' && (e.ctrlKey || e.metaKey) && (e.key === 'y' || e.key === 'Y' || (e.shiftKey && (e.key === 'z' || e.key === 'Z')))){ e.stopImmediatePropagation(); e.preventDefault(); skRedo(); return; } if((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey){ if(skPage === 'sketch'){ e.stopImmediatePropagation(); e.preventDefault(); skUndo(); } else skHookMainUndo(); } }, true);
  // kalem girişi katmanı (çizim sayfasının dokunma kodunu hiç çalıştırmaz)
  const ov = document.createElement('div');
  ov.style.cssText = 'position:absolute;inset:0;z-index:22;touch-action:none;display:none;';
  wrap.appendChild(ov); skOverlay = ov;
  const ptrs = new Map(); let pinch = null, panPt = null, holdT = null, skErasing = false;
  const lp = e => { const r = wrap.getBoundingClientRect(); return { x:e.clientX - r.left, y:e.clientY - r.top }; };
  const nearestRefPoint = (sp) => {
    const tolPx = Math.max(40, SNAP_SENS_PX[snapSens] || 30); let best = null, bd = Infinity;
    const cand = [];
    sk.items.forEach(it => { if(it.dir === 'd'){ cand.push(it.a, it.b); return; } const r = skRect(it); cand.push({ x:r.x0, y:r.y0 }, { x:r.x1, y:r.y0 }, { x:r.x0, y:r.y1 }, { x:r.x1, y:r.y1 }); });
    shapes.forEach(s => { if(!s.points || s.points.length < 2) return; if(s.type === 'mdf') getMdfCorners(s.points[0], s.points[1], s.rawCursor).forEach(q => cand.push(q)); else s.points.forEach(q => cand.push(q)); });
    cand.forEach(q => { const s2 = worldToScreen(q), d = Math.hypot(s2.x - sp.x, s2.y - sp.y); if(d < tolPx && d < bd){ bd = d; best = { x:q.x, y:q.y }; } });
    return best;
  };
  ov.addEventListener('wheel', e => { if(skLock){ e.preventDefault(); e.stopPropagation(); } }, { passive:false });
  ov.addEventListener('pointerdown', e => {
    e.preventDefault(); e.stopPropagation();
    try{ ov.setPointerCapture(e.pointerId); }catch(_){}
    const p = lp(e);
    if(e.pointerType === 'pen') skPenSeen = true;
    // v16.36: ekran kilitliyken el/parmak ekranı kaydırmaz, iki parmak yakınlaştırmaz (kalem çizer)
    if(skLock && (ptrs.size >= 1 || (e.pointerType === 'touch' && skPenSeen))){ try{ ov.releasePointerCapture(e.pointerId); }catch(_){} return; }
    ptrs.set(e.pointerId, { p, type:e.pointerType });
    if(ptrs.size === 2){
      skCur = null; skRef = null; clearTimeout(holdT);
      const a = [...ptrs.values()];
      pinch = { d:Math.hypot(a[0].p.x - a[1].p.x, a[0].p.y - a[1].p.y), s:scale, m:{ x:(a[0].p.x + a[1].p.x) / 2, y:(a[0].p.y + a[1].p.y) / 2 }, ox:offX, oy:offY };
      render(); return;
    }
    if(e.pointerType === 'touch' && skPenSeen){ panPt = p; return; }      // kalem kullanılıyorsa parmak = kaydır
    // "!" işaretine dokunma
    const mk = skMarkerBoxes.find(b => p.x >= b.x0 && p.x <= b.x1 && p.y >= b.y0 && p.y <= b.y1);
    if(mk){ ptrs.delete(e.pointerId); try{ ov.releasePointerCapture(e.pointerId); }catch(_){} skEditMarker(mk); return; }
    const w = screenToWorld(p);
    if(skErase){ skErasing = true; skEraseDragPushed = false; if(skEraseAt(w)){ skSave(); render(); } return; }
    skCur = { pts:[{ x:w.x, y:w.y }], start:p, moved:false, eps:10 / scale, minLen:15 / scale };
    // köşeye basılı tut (0,5 sn): referans al, kenar boyunca çek, bırak → "köşeden kaç cm?"
    clearTimeout(holdT);
    holdT = setTimeout(() => {
      if(!skCur || skCur.moved) return;
      const ref = nearestRefPoint(skCur.start);
      if(!ref){ showToast('Yakında köşe bulunamadı'); return; }
      skRef = ref; skCur.refMode = true; skCur.pts = [];
      try{ navigator.vibrate && navigator.vibrate(30); }catch(_){}
      showToast('📍 Köşe alındı: kenar boyunca çek ve bırak', 2500); render();
    }, 500);
  });
  ov.addEventListener('pointermove', e => {
    e.stopPropagation();
    if(!ptrs.has(e.pointerId)) return;
    const p = lp(e); ptrs.get(e.pointerId).p = p;
    if(pinch && ptrs.size >= 2){
      const a = [...ptrs.values()];
      const d = Math.hypot(a[0].p.x - a[1].p.x, a[0].p.y - a[1].p.y);
      const ns = Math.min(300, Math.max(0.02, pinch.s * d / pinch.d));
      const wm = { x:(pinch.m.x - pinch.ox) / pinch.s, y:(pinch.m.y - pinch.oy) / pinch.s };
      const m2 = { x:(a[0].p.x + a[1].p.x) / 2, y:(a[0].p.y + a[1].p.y) / 2 };
      scale = ns; offX = m2.x - wm.x * ns; offY = m2.y - wm.y * ns; render(); return;
    }
    if(panPt){ offX += p.x - panPt.x; offY += p.y - panPt.y; panPt = p; render(); return; }
    if(skErasing){ if(skEraseAt(screenToWorld(p))){ skSave(); render(); } return; }
    if(!skCur) return;
    if(Math.hypot(p.x - skCur.start.x, p.y - skCur.start.y) > 8) skCur.moved = true;
    const w = screenToWorld(p);
    if(skCur.refMode){ skCur.last = w; render(); return; }
    skCur.pts.push({ x:w.x, y:w.y });
    render();
  });
  const up = e => {
    e.stopPropagation();
    ptrs.delete(e.pointerId);
    clearTimeout(holdT);
    if(pinch){ if(ptrs.size < 2) pinch = null; return; }
    if(panPt){ panPt = null; return; }
    if(skErasing){ skErasing = false; return; }
    const cur = skCur; skCur = null;
    if(!cur){ render(); return; }
    if(cur.refMode){
      const ref = skRef, last = cur.last;
      if(!last || Math.hypot(last.x - ref.x, last.y - ref.y) * scale < 15){ skRef = null; render(); showToast('Kenar boyunca çekmedin, iptal edildi'); return; }
      const dx = last.x - ref.x, dy = last.y - ref.y;
      const axis = Math.abs(dx) >= Math.abs(dy) ? 'x' : 'y', sign = (axis === 'x' ? dx : dy) >= 0 ? 1 : -1;
      const approx = Math.abs(axis === 'x' ? dx : dy);
      skAskNumber('Köşeden kaç cm? (' + (axis === 'x' ? (sign > 0 ? 'sağa' : 'sola') : (sign > 0 ? 'aşağı' : 'yukarı')) + ')', fmtLenPlain(approx), mm => {
        skPush();
        sk.pins.push({ x: ref.x + (axis === 'x' ? sign * mm : 0), y: ref.y + (axis === 'y' ? sign * mm : 0), axis, sign });
        skRef = null; skSave(); render();
        showToast('Kırmızı noktadan başlayarak çizgini çiz', 3000);
      });
      skRef = null; render(); return;
    }
    if(cur.pts.length < 2 || !cur.moved){ render(); return; }
    skPush();
    const st = { pts:cur.pts, eps:cur.eps, minLen:cur.minLen };
    // kırmızı mesafe noktasından başlıyorsa oraya kilitle
    const tolPx = Math.max(30, SNAP_SENS_PX[snapSens] || 30);
    const s0 = worldToScreen(cur.pts[0]);
    const pi = sk.pins.findIndex(pn => { const q = worldToScreen(pn); return Math.hypot(q.x - s0.x, q.y - s0.y) < tolPx; });
    if(pi >= 0){ st.pin = sk.pins[pi]; st.pts[0] = { x:st.pin.x, y:st.pin.y }; sk.pins.splice(pi, 1); }
    sk.strokes.push(st);
    skSave(); render();
  };
  ov.addEventListener('pointerup', up);
  ov.addEventListener('pointercancel', up);
  ov.addEventListener('lostpointercapture', e => { ptrs.delete(e.pointerId); if(ptrs.size < 2) pinch = null; });
  ov.addEventListener('wheel', e => { e.preventDefault(); e.stopPropagation(); zoomAt(lp(e), e.deltaY < 0 ? 1.1 : 0.9); }, { passive:false });
}

// ================= v16.22: DOLAP → BÖLÜM → KAPAK / ÇEKMECE =================
// Dolap ayırma kuralına dokunulmaz. Her dolabın içi dikmelerle bölümlere ayrılır (D1-B1, D1-B2...).
// Bir bölüme kapak tipi seçilince o dolap "bölüm ayarlı" olur; kapaklar bölüm ölçüsünden otomatik çıkar.
// Hiç seçim yapılmamış dolaplar eskisi gibi hesaplanır (kesim listesi değişmez).
const BAY_KEY = 'cizgi_bays_v1';
function loadBays(){ try{ return JSON.parse(localStorage.getItem(BAY_KEY)) || {}; }catch(e){ return {}; } }
function saveBays(v){ try{ localStorage.setItem(BAY_KEY, JSON.stringify(v)); }catch(e){} }
function clearBayCfg(cab){ const all = loadBays(); delete all[cab]; saveBays(all); }
function bayBoxes(info, mdfShapes, cabMap){
  const map = cabMap || computeCabinets(mdfShapes).map;
  return mdfShapes.filter(sh => map.get(sh.id) === info.cab).map(sh => {
    const c = getMdfCorners(sh.points[0], sh.points[1], sh.rawCursor);

    const b = { id:sh.id, minX:Math.min(...xs), maxX:Math.max(...xs), minY:Math.min(...ys), maxY:Math.max(...ys) };
    b.cx = (b.minX+b.maxX)/2; b.cy = (b.minY+b.maxY)/2;
    b.vert = (b.maxY-b.minY) > (b.maxX-b.minX)*2;

// Bölümleri bulur. Dikdörtgenler "kapak ölçüsü" koordinatındadır: dış kenarlarda dolabın dış yüzü,
// ara dikme / ara yatayda tahtanın tam ortası (kapaklar orada buluşur).
function computeBays(info, mdfShapes, cabMap){
  const bx = bayBoxes(info, mdfShapes, cabMap);
  const T = 40, M = MDF_THICKNESS;
  const verts = bx.filter(b => b.vert), horiz = bx.filter(b => b.horiz);
  const out = [];
  const rec = (R, depth) => {
    if(depth > 8 || R.x1 - R.x0 < 60 || R.y1 - R.y0 < 60){ out.push(R); return; }
    // 1) bölümün tam boyunca inen dikmeler
    let vs = verts.filter(v => v.cx > R.x0 + T && v.cx < R.x1 - T && v.minY <= R.y0 + M + T && v.maxY >= R.y1 - M - T).map(v => v.cx).sort((a,b)=>a-b);
    const vm = []; vs.forEach(x => { if(!vm.length || x - vm[vm.length-1] > 25) vm.push(x); else vm[vm.length-1] = (vm[vm.length-1] + x)/2; });
    if(vm.length){
      const xs = [R.x0, ...vm, R.x1];
      for(let i=0;i<xs.length-1;i++) rec({ x0:xs[i], x1:xs[i+1], y0:R.y0, y1:R.y1 }, depth+1);
      return;
    }
    // 2) yarım dikmenin bittiği tam genişlik yatay (örn. yüklük tahtası, altında ara dikme var)
    let hs = horiz.filter(h => h.cy > R.y0 + T && h.cy < R.y1 - T && h.minX <= R.x0 + M + T && h.maxX >= R.x1 - M - T &&
      verts.some(v => v.cx > R.x0 + T && v.cx < R.x1 - T && v.minY >= R.y0 - 5 && v.maxY <= R.y1 + 5 &&
        (Math.abs(v.minY - h.maxY) < T || Math.abs(v.maxY - h.minY) < T))).map(h => h.cy).sort((a,b)=>a-b);
    if(hs.length){
      const ys = [R.y0, ...hs, R.y1];
      for(let i=0;i<ys.length-1;i++) rec({ x0:R.x0, x1:R.x1, y0:ys[i], y1:ys[i+1] }, depth+1);
      return;
    }
    out.push(R);
  };
  rec({ x0:info.minX, x1:info.minX + info.W, y0:info.minY, y1:info.minY + info.H }, 0);
  // soldan sağa, sonra yukarıdan aşağı numara
  out.sort((a,b) => (Math.abs(a.x0 - b.x0) > 30 ? a.x0 - b.x0 : a.y0 - b.y0));
  out.forEach((R, i) => {
    R.cab = info.cab; R.idx = i + 1; R.name = 'D' + info.cab + '-B' + (i + 1);
    R.key = [R.x0 - info.minX, R.y0 - info.minY, R.x1 - R.x0, R.y1 - R.y0].map(v => Math.round(v/10)).join('_');
    // bölümün içindeki raflar (bölüm genişliğinin çoğunu kaplayan yataylar)
    R.shelves = horiz.filter(h => h.cy > R.y0 + 20 && h.cy < R.y1 - 20 && (Math.min(h.maxX, R.x1) - Math.max(h.minX, R.x0)) >= 0.7 * (R.x1 - R.x0)).map(h => h.cy).sort((a,b)=>a-b);
    R.outerL = R.x0 <= info.minX + 1; R.outerR = R.x1 >= info.minX + info.W - 1;
    R.outerT = R.y0 <= info.minY + 1; R.outerB = R.y1 >= info.minY + info.H - 1;
  });
  return out;
}
function bayAutoCfg(R, info, st, nBays){
  const W = R.x1 - R.x0;
  const hc = loadHingeCfg();
  const hinge = nBays === 1 ? (hc.singleSide === 'sag' ? 'R' : 'L') : (R.outerR && !R.outerL ? 'R' : 'L');
  const fullH = R.y0 <= info.minY + 1 && R.y1 >= info.minY + info.H - 1;
  if(fullH && info.yukMid !== null) return { type:'altust', hinge, auto:true };
  return { type: W > st.maxDoorMm ? 'cift' : 'tek', hinge, auto:true };
}
function bayTypeText(c){
  if(!c) return '';
  const inn = (c.inner || []).reduce((a, z) => a + (z.n || 1), 0);
  const out = (c.outer || []).length;
  if(inn || out) return bayTypeText(Object.assign({}, c, { inner: [], outer: [] })) + (out ? ' + ' + out + ' dış çekmece' : '') + (inn ? ' + ' + inn + ' iç çekmece' : '');
  if(c.type === 'none') return 'kapak yok';
  if(c.type === 'tek') return 'tek kapak (menteşe ' + (c.hinge === 'R' ? 'sağda' : 'solda') + ')';
  if(c.type === 'cift') return 'çift kapak';

  if(c.type === 'cekmece') return (c.n || 3) + ' çekmece' + (c.drawerTopMm ? ' + üstte kapak' : '');

}

const drawerTxt = z => (z.n || 1) + ' adet';
const GOZ_T = { none:'kapaksız', tekL:'tek kapak · sol', tekR:'tek kapak · sağ', cift:'çift kapak' };
// Bir bölümün kapakları / çekmece önleri (x0..y1 = kapağın oturduğu alan, w×h = kesim ölçüsü)
function bayDoorList(R, c, st){
  const g = st.deductMm, out = [];
  const W = R.x1 - R.x0;
  const autoCols = W > st.maxDoorMm ? 2 : 1;
  const row = (y0, y1, cols, part, sideOne) => {
    for(let k=0;k<cols;k++){
      const x0 = R.x0 + W*k/cols, x1 = R.x0 + W*(k+1)/cols;
      const side = cols === 1 ? sideOne : (k === 0 ? 'L' : 'R');
      out.push({ kind:'kapak', x0, x1, y0, y1, w:(x1-x0) - g, h:(y1-y0) - g, side, part });
    }
  };
  const side = c.hinge === 'R' ? 'R' : 'L';
  // v16.37: GÖZ BAZLI. Bölümün kapak ayarı bütün gözlere gelir; bir göze ayrı kapak / kapaksız / dış çekmece
  // verilirse o göz kendi ayarını alır. Ayarı bölüm gibi kalan, alt alta gözler tek kapağı paylaşır.
  const H = R.y1 - R.y0;
  const bnd = [0, ...((R.shelves || []).map(y => y - R.y0)), H];
  const same = (z, a, b) => Math.abs(z.a - a) < 5 && Math.abs(z.b - b) < 5;
  const gz = [];
  for(let i = 0; i < bnd.length - 1; i++){
    const a = Math.round(bnd[i]*10)/10, b = Math.round(bnd[i+1]*10)/10;
    const o = (c.outer || []).find(z => same(z, a, b)), v = (c.goz || []).find(z => same(z, a, b));
    gz.push({ a, b, kind: o ? 'drawer' : v ? v.t : 'base', n: o ? Math.max(1, Math.min(12, o.n || 1)) : 0 });
  }
  // eski kayıt: göz sınırına denk gelmeyen dış çekmece de çekmece olarak gösterilir
  const loose = (c.outer || []).filter(z => !gz.some(g => same(z, g.a, g.b)));
  const simple = !gz.some(g => g.kind !== 'base') && !loose.length;
  const base = (y0, y1, part) => {
    if(c.type === 'tek') row(y0, y1, 1, part, side);
    else if(c.type === 'cift') row(y0, y1, 2, part, side);
    else if(c.type === 'altust'){
      let sp = c.splitMm > 0 ? c.splitMm : H/2;
      if(!(sp > 50 && sp < H - 50)) sp = H/2;
      const ys = R.y0 + sp;
      if(ys > y0 + 50 && ys < y1 - 50){ row(y0, ys, autoCols, (part ? part + ' ' : '') + 'Üst', side); row(ys, y1, autoCols, (part ? part + ' ' : '') + 'Alt', side); }
      else row(y0, y1, autoCols, part || (ys <= y0 + 50 ? 'Alt' : 'Üst'), side);
    } else if(c.type === 'cekmece'){
      const n = Math.max(1, Math.min(12, c.n || 3));
      let top = y0;
      if(simple && c.drawerTopMm > 50 && c.drawerTopMm < H - 50){ top = R.y0 + c.drawerTopMm; row(y0, top, autoCols, 'Üst', side); }
      const zh = (y1 - top) / n;
      for(let i=0;i<n;i++) out.push({ kind:'cekmece', x0:R.x0, x1:R.x1, y0:top + zh*i, y1:top + zh*(i+1), w:W - g, h:zh - g, side:null, part:(part ? part + ' ' : '') + 'Çekmece ' + (i+1) });
    }
  };
  if(simple) base(R.y0, R.y1, '');
  else {
    let k = 0, dn = 0;
    const nOuter = gz.filter(g2 => g2.kind === 'drawer').length;
    while(k < gz.length){
      const G = gz[k];
      if(G.kind === 'base'){
        let e = k; while(e + 1 < gz.length && gz[e + 1].kind === 'base') e++;
        const y0 = R.y0 + gz[k].a, y1 = R.y0 + gz[e].b;
        base(y0, y1, (k === 0 && e === gz.length - 1) ? '' : 'G' + (k + 1) + (e > k ? '-' + (e + 1) : ''));
        k = e + 1; continue;
      }
      const y0 = R.y0 + G.a, y1 = R.y0 + G.b, gp = 'G' + (k + 1);
      if(G.kind === 'drawer'){
        dn++;
        const zh = (y1 - y0) / G.n;
        for(let i = 0; i < G.n; i++) out.push({ kind:'cekmece', x0:R.x0, x1:R.x1, y0:y0 + zh*i, y1:y0 + zh*(i+1), w:W - g, h:zh - g, side:null,
          part:'Dış çekmece' + (nOuter > 1 ? ' ' + dn : '') + (G.n > 1 ? '.' + (i + 1) : '') });
      }
      else if(G.kind === 'tekL') row(y0, y1, 1, gp, 'L');
      else if(G.kind === 'tekR') row(y0, y1, 1, gp, 'R');
      else if(G.kind === 'cift') row(y0, y1, 2, gp, side);
      k++;
    }
    loose.forEach((z, zi) => {
      const y0 = R.y0 + z.a, y1 = R.y0 + z.b, n = Math.max(1, z.n || 1), zh = (y1 - y0) / n;
      for(let i = 0; i < n; i++) out.push({ kind:'cekmece', x0:R.x0, x1:R.x1, y0:y0 + zh*i, y1:y0 + zh*(i+1), w:W - g, h:zh - g, side:null, part:'Dış çekmece ' + (zi + 1) + (n > 1 ? '.' + (i + 1) : '') });
    });
  }
  // v16.28: raf arasındaki göze iç çekmece (kapağın arkasında). a/b = gözün üst/alt sınırı (bölüm üstünden mm)
  (c.inner || []).forEach((z, zi) => {
    const M = MDF_THICKNESS, H = R.y1 - R.y0;
    const isShelf = v => v > 1 && v < H - 1;
    const yA = R.y0 + z.a + (isShelf(z.a) ? M/2 : (R.outerT ? M : M/2));
    const yB = R.y0 + z.b - (isShelf(z.b) ? M/2 : (R.outerB ? M : M/2));
    const xL = R.x0 + (R.outerL ? M : M/2), xR = R.x1 - (R.outerR ? M : M/2);
    const n = Math.max(1, Math.min(6, z.n || 1));
    if(yB - yA < 15 || xR - xL < 60) return;
    const zh = (yB - yA) / n;
    for(let i=0;i<n;i++){
      out.push({ kind:'iccekmece', x0:xL, x1:xR, y0:yA + zh*i, y1:yA + zh*(i+1), w:(xR - xL) - 4, h:zh - 4, side:null,
        part:'İç çekmece ' + (zi + 1) + (n > 1 ? '.' + (i + 1) : '') });
    }
  });
  out.forEach(d => {
    d.bay = R.name;
    d.name = R.name + (d.part ? ' ' + d.part : '');
    d.cutLabel = d.kind === 'cekmece' ? 'Çekmece önü ' + R.name : d.kind === 'iccekmece' ? 'İç çekmece önü ' + R.name : (d.part ? d.part + ' kapak ' : 'Kapak ') + R.name;
  });
  return out;
}

function bayDataFor(info, mdfShapes, cabMap, force){

      const a = worldToScreen(new Point(R.x0, R.y0)), b = worldToScreen(new Point(R.x1, R.y1));

        ctx.fillStyle = '#e8e8e8'; ctx.font = '600 11px -apple-system, sans-serif'; ctx.fillText(l2, tx, ty + 9);
      } else {
        // dar bölüm: sadece adı (dokununca menüde tam bilgi var)

        const w2 = ctx.measureText(l1).width + 10;

      }
    });
  });

}

// ---- Dosya dışarı aktarma: Paylaş / Farklı kaydet / İndirilenler ----
function exportMime(name){
  const n = String(name).toLowerCase();
  if(n.endsWith('.csv')) return { mime:'text/csv', ext:'.csv', desc:'Excel / CSV' };
  if(n.endsWith('.pdf')) return { mime:'application/pdf', ext:'.pdf', desc:'PDF' };
  if(n.endsWith('.png')) return { mime:'image/png', ext:'.png', desc:'Resim' };
  if(n.endsWith('.html')) return { mime:'text/html', ext:'.html', desc:'Web sayfası' };
  if(n.endsWith('.cizgi')) return { mime:'application/octet-stream', ext:'.cizgi', desc:'Çizgi CAD çizimi' };
  return { mime:'application/octet-stream', ext:'', desc:'Dosya' };
}
function savePickerFn(){
  try{ if(window.showSaveFilePicker) return { fn: window.showSaveFilePicker, owner: window }; }catch(e){}
  try{ if(window.parent && window.parent !== window && window.parent.showSaveFilePicker) return { fn: window.parent.showSaveFilePicker, owner: window.parent }; }catch(e){}
  return null;
}
function canSaveAs(){
  if(window.__appSaveBlob) return !!(window.AndroidBridge && window.AndroidBridge.saveAs);
  return !!savePickerFn();
}
function shareFileObj(blob, name){
  try{ return new File([blob], name, { type: exportMime(name).mime }); }catch(e){ return null; }
}
function canShareFile(blob, name){
  if(window.__appSaveBlob) return true;
  const f = shareFileObj(blob, name);
  try{ return !!(f && navigator.canShare && navigator.canShare({ files:[f] })); }catch(e){ return false; }
}
function exportShare(blob, name){
  if(window.__appSaveBlob){ window.__appSaveBlob(blob, name, 'share'); return; }
  const f = shareFileObj(blob, name);
  navigator.share({ files:[f], title:name }).catch(err => { if(err && err.name !== 'AbortError') showToast('Paylaşılamadı: ' + (err.message || ''), 3000); });
}
function exportSaveAs(blob, name){
  if(window.__appSaveBlob){
    if(window.AndroidBridge && window.AndroidBridge.saveAs){ window.__appSaveBlob(blob, name, 'saveas'); return; }
    window.__appSaveBlob(blob, name, 'save'); return;
  }
  const pk = savePickerFn();
  if(!pk){ deliverDownload(blob, name); showToast('Bu tarayıcı yer seçtirmiyor; İndirilenler klasörüne kaydedildi', 3500); return; }
  const mt = exportMime(name);
  const opts = { suggestedName: name };
  if(mt.ext){ const acc = {}; acc[mt.mime] = [mt.ext]; opts.types = [{ description: mt.desc, accept: acc }]; }
  pk.fn.call(pk.owner, opts)
    .then(h => h.createWritable())
    .then(w => w.write(blob).then(() => w.close()))
    .then(() => showToast('Kaydedildi: ' + name, 3000))
    .catch(err => {
      if(err && err.name === 'AbortError') return;
      deliverDownload(blob, name); showToast('Yer seçilemedi; İndirilenler klasörüne kaydedildi', 3500);
    });
}

(function(){
  const bar = document.getElementById('topbar');
  if(!bar) return;
  const $ = id => document.getElementById(id);
  const isOn = id => { const b = $(id); return !!(b && (b.classList.contains('on') || b.classList.contains('active'))); };
  // Gizli asıl düğmeye bas; kendi menüsünü açıyorsa grubun yerinde açılsın
  function pressVia(id, anchor){
    const b = $(id); if(!b) return;
    const r = anchor.getBoundingClientRect(), old = b.getAttribute('style') || '';
    b.style.cssText = old + ';display:flex !important;position:fixed;left:' + r.left + 'px;top:' + r.top + 'px;width:' + r.width + 'px;height:' + r.height + 'px;visibility:hidden;z-index:-1;';
    try{ b.click(); } finally { b.setAttribute('style', old); }
  }
  const lbl = id => { const b = $(id); const l = b && b.querySelector('.lbl'); return l ? l.textContent : id; };
  const GROUPS = [
    { id:'cgHelp', icon:'🧰', label:'Araçlar', after:'btnSnap', items:[
        { id:'btnCenter',   icon:'⊟', label:()=>'Ortadan çiz (M)' },
        { id:'btnClose',    icon:'⇥', label:()=>'Karşıya kapat (C)' },
        { id:'btnLineOnly', icon:'╱', label:()=>'Sadece Çizgi' },

        { id:'toolDim',     icon:'📏', label:()=>'Ölçü aracı' },
        { id:'btnHideDims', icon:'🙈', label:()=>lbl('btnHideDims') },
    ]},
    { id:'cgMore', icon:'⋯', label:'Diğer', after:'grpFile', items:[
        { id:'btnHelp',     icon:'❓', label:()=>'Yardım (hangi menüde ne var)' },
        { id:'btnPhoto',    icon:'🖼️', label:()=>'Fotoğraf ekle', menu:true },
        { id:'grpInput',    icon:'🖊', label:()=>'Giriş modu (kalem/el)', menu:true },
    ]},
  ];
  const hideIds = [];
  GROUPS.forEach(g => g.items.forEach(it => hideIds.push(it.id)));
  hideIds.forEach(id => { const b = $(id); if(b) b.classList.add('cg-hide'); });
  // Grupların içinde kalan ayraçlar da dar ekranda gizlensin
  [...bar.querySelectorAll('.tsep')].forEach(sep => {
    const prev = sep.previousElementSibling, next = sep.nextElementSibling;
    if((prev && hideIds.includes(prev.id)) || (next && hideIds.includes(next.id))) sep.classList.add('cg-hide');
  });
  GROUPS.forEach(g => {
    const b = document.createElement('button');
    b.className = 'gbtn cgrp'; b.id = g.id;
    b.innerHTML = '<span>' + g.icon + '</span><span class="lbl">' + g.label + ' ▾</span>';

    if(ref && ref.parentNode === bar) ref.after(b); else bar.appendChild(b);
    b.addEventListener('click', function(){
      const anchor = this;
      if(g.custom){ g.custom(anchor); setTimeout(syncGroups, 30); return; }
      openMenu(anchor, g.items.filter(it => $(it.id)).map(it => ({
        icon: it.icon, label: it.label(), active: isOn(it.id), keepOpen: !!it.menu,
        onClick: () => { pressVia(it.id, anchor); setTimeout(syncGroups, 30); }
      })));
    });
    g.btn = b;
    b._help = g.items.map(it => ({ id: it.id, icon: it.icon, label: it.label() }));
  });
  // Grup düğmesi, içindeki bir şey açıksa (Ortadan, Sadece Çizgi, Ölçü Gizle...) mavi yansın
  function syncGroups(){ GROUPS.forEach(g => g.btn && g.btn.classList.toggle('on', g.items.some(it => isOn(it.id)))); }
  try{ const mo = new MutationObserver(syncGroups); hideIds.forEach(id => { const b = $(id); if(b) mo.observe(b, { attributes:true, attributeFilter:['class'] }); }); }catch(e){}
  function updateCompact(){
    // v16.32: sadelik için gruplar her ekranda kullanılır (aynı düğmeler grubun içinde)

})();

    '🧲 <b>Yakala</b> düğmesine basılı tut → yakalama ayarları (uç, orta, <b>dik yakalama</b>…)',
    'Ölçü yazısına dokun → ölçüyü değiştir. Bağlı parçalar takip eder: sol alt köşe sabit kalır',
    'Ölçü yazısının <b>?</b> kısmına dokun → parçaya isim / açıklama ver',
    'Parçaya uzun bas (ya da sağ tık) → isim, uzunluk, döndür, kopyala, sil',
    'İki parmak → yakınlaştır / kaydır',
    '💾 Dosya → Proje kaydet / Proje aç: aynı projeyi bilgisayarda ve tablette aç (Google Drive ile)',
    'Klavye: <b>Ctrl+S</b> proje kaydet · <b>C</b> karşıya kapat · <b>M</b> ortadan çiz · <b>Ctrl+Z</b> geri · <b>Ctrl+Y</b> ileri · <b>Esc</b> vazgeç · <b>F1</b> yardım'
  ].map(t => '• ' + t).join('<br>') + '</div>';
  m.body.innerHTML = h;
  const asText = () => rows.map((r, i) => (i + 1) + '. ' + r.icon + ' ' + r.name + (r.items && r.items.length ? ': ' + r.items.map((it, k) => (k + 1) + ' ' + it.label + (it.sub && it.sub.length ? ' (' + it.sub.map((q, j) => (k + 1) + '.' + (j + 1) + ' ' + q.label).join(', ') + ')' : '')).join(', ') : (r.desc ? ' — ' + r.desc : ''))).join('\n');
  m.foot.append(csvBtn('📋 Metni kopyala', () => {
    const t = 'Çizgi CAD ' + APP_VER + ' — ' + helpDevice() + '\n' + asText();
    try{ navigator.clipboard.writeText(t).then(() => showToast('Yardım metni kopyalandı'), () => showToast('Kopyalanamadı')); }catch(e){ showToast('Kopyalanamadı'); }
  }), csvBtn('Kapat', () => m.close(), true));
}
document.getElementById('btnHelp').addEventListener('click', openHelp);
try{ projBadge(); }catch(e){}
document.addEventListener('keydown', e => { if(e.key === 'F1'){ e.preventDefault(); openHelp(); } });

const loaded = load();
loadPhoto();
resizeCanvas();
if(!loaded){ offX=40; offY=40; }
setTool('mdf');
render();

if(!window.isSecureContext){
  setTimeout(()=>showToast('Not: Mikrofon için bu dosyayı bir sunucudan (http/https) açmanız gerekir'), 1000);
}

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}

})();
</script>
