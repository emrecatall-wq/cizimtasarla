  const b = document.createElement('button'); b.className = 'gbtn'; b.id = 'btnSketch';
  b.innerHTML = '<span>✍️</span><span class="lbl">Elle Çiz</span>';
  if(after && after.parentNode === top) after.after(b); else top.appendChild(b);
  b.addEventListener('click', function(){
    const onSk = skPage === 'sketch';
    openMenu(this, [
      { icon: onSk ? '📐' : '✍️', label: onSk ? 'Çizim sayfasına dön' : 'Elle Çiz sayfasına geç', onClick:() => skSetPage(onSk ? 'draw' : 'sketch') },
      { icon:'✨', label:'Düzelt', onClick:() => { if(!onSk) skSetPage('sketch'); skFix(); } },
      onSk ? { icon:'➡️', label:'Çizim sayfasına gönder', onClick:skSendToDraw }
           : { icon:'⬅️', label:'Seçilenleri (yoksa hepsini) Elle Çiz\'e gönder', onClick:skImportFromDraw },
      { icon: sk.out === 'line' ? '╱' : '▬', label:'Sonuç: ' + (sk.out === 'line' ? 'Çizgi' : '18 mm MDF') + ' (değiştir)', keepOpen:true, onClick:(el) => {
          skPush(); sk.out = sk.out === 'line' ? 'mdf' : 'line'; skRoles(skTolW()); skSave(); render();
          el.querySelector('span:last-child').textContent = 'Sonuç: ' + (sk.out === 'line' ? 'Çizgi' : '18 mm MDF') + ' (değiştir)';
          el.querySelector('.ic').textContent = sk.out === 'line' ? '╱' : '▬';
        } },
      { icon: sk.topOver ? '☑' : '☐', label:'Tavan/taban yanların üstünde', keepOpen:true, onClick:(el) => {
          skPush(); sk.topOver = !sk.topOver; skRoles(skTolW()); skSave(); render();
          el.querySelector('.ic').textContent = sk.topOver ? '☑' : '☐';
        } },
      { icon:'🧹', label:'Elle çizimi temizle', onClick:() => { if(!sk.items.length && !sk.strokes.length) return; if(confirm('Elle Çiz sayfasındaki her şey silinsin mi?')){ skPush(); sk.strokes = []; sk.items = []; sk.pins = []; skSave(); render(); } } },
    ]);
  });
  // Elle Çiz sayfasında üstteki "Geri Al" elle çizimi geri alsın
  const undoBtn = document.getElementById('btnUndo');
  if(undoBtn) undoBtn.addEventListener('click', e => { if(skPage === 'sketch'){ e.stopImmediatePropagation(); skUndo(); } else skHookMainUndo(); }, true);
  document.addEventListener('keydown', e => { if((e.ctrlKey || e.metaKey) && e.key === 'z'){ if(skPage === 'sketch'){ e.stopImmediatePropagation(); e.preventDefault(); skUndo(); } else skHookMainUndo(); } }, true);
  // kalem girişi katmanı (çizim sayfasının dokunma kodunu hiç çalıştırmaz)
  const ov = document.createElement('div');
  ov.style.cssText = 'position:absolute;inset:0;z-index:22;touch-action:none;display:none;';
  wrap.appendChild(ov); skOverlay = ov;
  const ptrs = new Map(); let pinch = null, panPt = null, holdT = null;
  const lp = e => { const r = wrap.getBoundingClientRect(); return { x:e.clientX - r.left, y:e.clientY - r.top }; };
  const nearestRefPoint = (sp) => {
    const tolPx = Math.max(40, SNAP_SENS_PX[snapSens] || 30); let best = null, bd = Infinity;
    const cand = [];
    sk.items.forEach(it => { if(it.dir === 'd'){ cand.push(it.a, it.b); return; } const r = skRect(it); cand.push({ x:r.x0, y:r.y0 }, { x:r.x1, y:r.y0 }, { x:r.x0, y:r.y1 }, { x:r.x1, y:r.y1 }); });
    shapes.forEach(s => { if(!s.points || s.points.length < 2) return; if(s.type === 'mdf') getMdfCorners(s.points[0], s.points[1], s.rawCursor).forEach(q => cand.push(q)); else s.points.forEach(q => cand.push(q)); });
    cand.forEach(q => { const s2 = worldToScreen(q), d = Math.hypot(s2.x - sp.x, s2.y - sp.y); if(d < tolPx && d < bd){ bd = d; best = { x:q.x, y:q.y }; } });
    return best;
  };
  ov.addEventListener('pointerdown', e => {
    e.preventDefault(); e.stopPropagation();
    try{ ov.setPointerCapture(e.pointerId); }catch(_){}
    const p = lp(e);
    if(e.pointerType === 'pen') skPenSeen = true;
    ptrs.set(e.pointerId, { p, type:e.pointerType });
    if(ptrs.size === 2){
      skCur = null; skRef = null; clearTimeout(holdT);
      const a = [...ptrs.values()];
      pinch = { d:Math.hypot(a[0].p.x - a[1].p.x, a[0].p.y - a[1].p.y), s:scale, m:{ x:(a[0].p.x + a[1].p.x) / 2, y:(a[0].p.y + a[1].p.y) / 2 }, ox:offX, oy:offY };
      render(); return;
    }
    if(e.pointerType === 'touch' && skPenSeen){ panPt = p; return; }      // kalem kullanılıyorsa parmak = kaydır
    // "!" işaretine dokunma
    const mk = skMarkerBoxes.find(b => p.x >= b.x0 && p.x <= b.x1 && p.y >= b.y0 && p.y <= b.y1);
    if(mk){ ptrs.delete(e.pointerId); try{ ov.releasePointerCapture(e.pointerId); }catch(_){} skEditMarker(mk); return; }
    const w = screenToWorld(p);
    skCur = { pts:[{ x:w.x, y:w.y }], start:p, moved:false, eps:10 / scale, minLen:15 / scale };
    // köşeye basılı tut (0,5 sn): referans al, kenar boyunca çek, bırak → "köşeden kaç cm?"
    clearTimeout(holdT);
    holdT = setTimeout(() => {
      if(!skCur || skCur.moved) return;
      const ref = nearestRefPoint(skCur.start);
      if(!ref){ showToast('Yakında köşe bulunamadı'); return; }
      skRef = ref; skCur.refMode = true; skCur.pts = [];
      try{ navigator.vibrate && navigator.vibrate(30); }catch(_){}
      showToast('📍 Köşe alındı: kenar boyunca çek ve bırak', 2500); render();
    }, 500);
  });
  ov.addEventListener('pointermove', e => {
    e.stopPropagation();
    if(!ptrs.has(e.pointerId)) return;
    const p = lp(e); ptrs.get(e.pointerId).p = p;
    if(pinch && ptrs.size >= 2){
      const a = [...ptrs.values()];
      const d = Math.hypot(a[0].p.x - a[1].p.x, a[0].p.y - a[1].p.y);
      const ns = Math.min(60, Math.max(0.2, pinch.s * d / pinch.d));
      const wm = { x:(pinch.m.x - pinch.ox) / pinch.s, y:(pinch.m.y - pinch.oy) / pinch.s };
      const m2 = { x:(a[0].p.x + a[1].p.x) / 2, y:(a[0].p.y + a[1].p.y) / 2 };
      scale = ns; offX = m2.x - wm.x * ns; offY = m2.y - wm.y * ns; render(); return;
    }
    if(panPt){ offX += p.x - panPt.x; offY += p.y - panPt.y; panPt = p; render(); return; }
    if(!skCur) return;
    if(Math.hypot(p.x - skCur.start.x, p.y - skCur.start.y) > 8) skCur.moved = true;
    const w = screenToWorld(p);
    if(skCur.refMode){ skCur.last = w; render(); return; }
    skCur.pts.push({ x:w.x, y:w.y });
    render();
  });
  const up = e => {
    e.stopPropagation();
    ptrs.delete(e.pointerId);
    clearTimeout(holdT);
    if(pinch){ if(ptrs.size < 2) pinch = null; return; }
    if(panPt){ panPt = null; return; }
    const cur = skCur; skCur = null;
    if(!cur){ render(); return; }
    if(cur.refMode){
      const ref = skRef, last = cur.last;
      if(!last || Math.hypot(last.x - ref.x, last.y - ref.y) * scale < 15){ skRef = null; render(); showToast('Kenar boyunca çekmedin, iptal edildi'); return; }
      const dx = last.x - ref.x, dy = last.y - ref.y;
      const axis = Math.abs(dx) >= Math.abs(dy) ? 'x' : 'y', sign = (axis === 'x' ? dx : dy) >= 0 ? 1 : -1;
      const approx = Math.abs(axis === 'x' ? dx : dy);
      skAskNumber('Köşeden kaç cm? (' + (axis === 'x' ? (sign > 0 ? 'sağa' : 'sola') : (sign > 0 ? 'aşağı' : 'yukarı')) + ')', fmtLenPlain(approx), mm => {
        skPush();
        sk.pins.push({ x: ref.x + (axis === 'x' ? sign * mm : 0), y: ref.y + (axis === 'y' ? sign * mm : 0), axis, sign });
        skRef = null; skSave(); render();
        showToast('Kırmızı noktadan başlayarak çizgini çiz', 3000);
      });
      skRef = null; render(); return;
    }
    if(cur.pts.length < 2 || !cur.moved){ render(); return; }
    skPush();
    const st = { pts:cur.pts, eps:cur.eps, minLen:cur.minLen };
    // kırmızı mesafe noktasından başlıyorsa oraya kilitle
    const tolPx = Math.max(30, SNAP_SENS_PX[snapSens] || 30);
    const s0 = worldToScreen(cur.pts[0]);
    const pi = sk.pins.findIndex(pn => { const q = worldToScreen(pn); return Math.hypot(q.x - s0.x, q.y - s0.y) < tolPx; });
    if(pi >= 0){ st.pin = sk.pins[pi]; st.pts[0] = { x:st.pin.x, y:st.pin.y }; sk.pins.splice(pi, 1); }
    sk.strokes.push(st);
    skSave(); render();
  };
  ov.addEventListener('pointerup', up);
  ov.addEventListener('pointercancel', up);
  ov.addEventListener('lostpointercapture', e => { ptrs.delete(e.pointerId); if(ptrs.size < 2) pinch = null; });
  ov.addEventListener('wheel', e => { e.preventDefault(); e.stopPropagation(); zoomAt(lp(e), e.deltaY < 0 ? 1.1 : 0.9); }, { passive:false });
}
skBuildUI();
skSetPage('draw');

// ================= ÜST MENÜ: TABLET / TELEFON İÇİN GRUPLAMA =================
// Menü ekrana sığmazsa tek duran düğmeler gruplara toplanır. Asıl düğmeler gizlenir ama aynen çalışır
// (gruptaki seçenek, gizli asıl düğmeye basar). Geniş ekranda (bilgisayar) eski düzen aynen kalır.
(function(){
  const bar = document.getElementById('topbar');
  if(!bar) return;
  const $ = id => document.getElementById(id);
  const isOn = id => { const b = $(id); return !!(b && (b.classList.contains('on') || b.classList.contains('active'))); };
  // Gizli asıl düğmeye bas; kendi menüsünü açıyorsa grubun yerinde açılsın
  function pressVia(id, anchor){
    const b = $(id); if(!b) return;
    const r = anchor.getBoundingClientRect(), old = b.getAttribute('style') || '';
    b.style.cssText = old + ';display:flex !important;position:fixed;left:' + r.left + 'px;top:' + r.top + 'px;width:' + r.width + 'px;height:' + r.height + 'px;visibility:hidden;z-index:-1;';
    try{ b.click(); } finally { b.setAttribute('style', old); }
  }
  const lbl = id => { const b = $(id); const l = b && b.querySelector('.lbl'); return l ? l.textContent : id; };
  const GROUPS = [
    { id:'cgHelp', icon:'🧭', label:'Yardım', after:'btnSnap', items:[
        { id:'btnCenter',   icon:'⊟', label:()=>'Ortadan çiz (M)' },
        { id:'btnClose',    icon:'⇥', label:()=>'Karşıya kapat (C)' },
        { id:'btnLineOnly', icon:'╱', label:()=>'Sadece Çizgi' },
        { id:'btnPanOnly',  icon:'🖐', label:()=>'Gezin (sadece kaydır)' },
        { id:'btnSnapMenu', icon:'⚙️', label:()=>'Snap Menü', menu:true },
    ]},
    { id:'cgDim', icon:'📏', label:'Ölçü', after:'cgHelp', items:[
        { id:'toolDim',     icon:'📏', label:()=>'Ölçü aracı' },
        { id:'btnHideDims', icon:'🙈', label:()=>lbl('btnHideDims') },
    ]},
    { id:'cgMore', icon:'⋯', label:'Diğer', after:'grpFile', items:[
        { id:'btnPhoto',    icon:'🖼️', label:()=>'Fotoğraf ekle', menu:true },
        { id:'grpInput',    icon:'🖊', label:()=>'Giriş modu (kalem/el)', menu:true },
    ]},
  ];
  const hideIds = [];
  GROUPS.forEach(g => g.items.forEach(it => hideIds.push(it.id)));
  hideIds.forEach(id => { const b = $(id); if(b) b.classList.add('cg-hide'); });
  // Grupların içinde kalan ayraçlar da dar ekranda gizlensin
  [...bar.querySelectorAll('.tsep')].forEach(sep => {
    const prev = sep.previousElementSibling, next = sep.nextElementSibling;
    if((prev && hideIds.includes(prev.id)) || (next && hideIds.includes(next.id))) sep.classList.add('cg-hide');
  });
  GROUPS.forEach(g => {
    const b = document.createElement('button');
    b.className = 'gbtn cgrp'; b.id = g.id;
    b.innerHTML = '<span>' + g.icon + '</span><span class="lbl">' + g.label + ' ▾</span>';
    const ref = $(g.after);
    if(ref && ref.parentNode === bar) ref.after(b); else bar.appendChild(b);
    b.addEventListener('click', function(){
      const anchor = this;
      openMenu(anchor, g.items.filter(it => $(it.id)).map(it => ({
        icon: it.icon, label: it.label(), active: isOn(it.id), keepOpen: !!it.menu,
        onClick: () => { pressVia(it.id, anchor); setTimeout(syncGroups, 30); }
      })));
    });
    g.btn = b;
  });
  // Grup düğmesi, içindeki bir şey açıksa (Ortadan, Sadece Çizgi, Ölçü Gizle...) mavi yansın
  function syncGroups(){ GROUPS.forEach(g => g.btn && g.btn.classList.toggle('on', g.items.some(it => isOn(it.id)))); }
  try{ const mo = new MutationObserver(syncGroups); hideIds.forEach(id => { const b = $(id); if(b) mo.observe(b, { attributes:true, attributeFilter:['class'] }); }); }catch(e){}
  function updateCompact(){
    bar.classList.remove('compact');
    if(bar.scrollWidth > bar.clientWidth + 2) bar.classList.add('compact');
    syncGroups();
  }
  window.addEventListener('resize', () => { clearTimeout(updateCompact._t); updateCompact._t = setTimeout(updateCompact, 120); });
  window.addEventListener('orientationchange', () => setTimeout(updateCompact, 300));
  updateCompact();
  setTimeout(updateCompact, 500);
})();


const loaded = load();
loadPhoto();
resizeCanvas();
if(!loaded){ offX=40; offY=40; }
setTool('mdf');
render();

if(!window.isSecureContext){
  setTimeout(()=>showToast('Not: Mikrofon için bu dosyayı bir sunucudan (http/https) açmanız gerekir'), 1000);
}

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}

})();
</script>
