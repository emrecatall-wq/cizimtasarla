const LIB_KEY = 'cizgi_lib_v1';
const LIB_CATS = [
  ['mentese', 'Menteşe'], ['baglanti', 'Bağlantı parçası'], ['kulp', 'Kulp'], ['ayak', 'Ayak'], ['vida', 'Vida']
];
function libDefaults(){
  return {
    ver: 2,
    mdfKgM2: 13.5, plakaFiyat: 0, plakaEn: 2100, plakaBoy: 2800,
    arkKgM2: 3.75, arkFiyatM2: 0,
    aynaKgM2: 10, aynaFiyatM2: 0,
    ayakAdet: 4, ayakGenisAdet: 6, ayakGenisMm: 1000,
    sabitRaf: false,
    vidaMentese: 4, vidaBaglanti: 4, vidaKulp: 2, vidaAyak: 4, arkVidaAralik: 150,
    items: [
      { id:'m1', cat:'mentese',  name:'Menteşe (35 mm kase, frenli)',      size:'35 mm kase',                g:110, price:0, use:true },
      { id:'b1', cat:'baglanti', name:'Şeffaf plastik bağlantı (2 parça)', size:'delik arası 27 mm, taban 3 mm', g:12,  price:0, use:true },
      { id:'k1', cat:'kulp',     name:'Kulp',                              size:'128 mm',                    g:100, price:0, use:true },
      { id:'a1', cat:'ayak',     name:'Ayarlı plastik ayak',               size:'10 cm',                     g:80,  price:0, use:true },
      { id:'v1', cat:'vida',     name:'Sunta vidası',                      size:'3,5 × 16 mm',               g:1.5, price:0, use:true },
    ]
  };
}
function loadLib(){
  const d = libDefaults();
  try{
    const s = JSON.parse(localStorage.getItem(LIB_KEY));
    if(s && typeof s === 'object'){
      Object.keys(d).forEach(k => { if(k !== 'items' && k !== 'ver' && s[k] !== undefined) d[k] = s[k]; });
      if(Array.isArray(s.items) && s.items.length) d.items = s.items;
      if(!s.ver){
        // eski varsayılanlar hiç değiştirilmediyse yenileriyle değiştir (18 mm = 13,5 · arkalık 5 mm = 3,75)
        if(s.mdfKgM2 === 13.3) d.mdfKgM2 = 13.5;
        if(s.arkKgM2 === 5.9) d.arkKgM2 = 3.75;
      }
      // eski kayıtta vida yoksa ekle
      LIB_CATS.forEach(([cat]) => {
        if(!d.items.some(i => i.cat === cat)){ const def = libDefaults().items.find(i => i.cat === cat); if(def) d.items.push(def); }
      });
    }
  }catch(e){}
  return d;
}
function saveLib(v){ try{ localStorage.setItem(LIB_KEY, JSON.stringify(v)); }catch(e){} }
function libActive(lib, cat){ return lib.items.find(i => i.cat === cat && i.use) || lib.items.find(i => i.cat === cat) || { name:'-', g:0, price:0 }; }

// Dolap dolap: alanlar, adetler, ağırlık, maliyet
function computeBom(mdfShapes, depthMmDef){
  const lib = loadLib(), st = loadCutSettings(), cfgAll = loadDoorCfg();
  const cabMap = computeCabinets(mdfShapes).map;
  const infos = moduleInfos(mdfShapes);
  let hs = []; try{ hs = computeHinges(); }catch(e){}
  const per = infos.map(info => {
    const D = cabDepthFor(info, depthMmDef);
    const parts = mdfShapes.filter(sh => cabMap.get(sh.id) === info.cab);
    let bodyM2 = 0, joints = 0;
    parts.forEach(sh => {
      const L = sh.points[0].distanceTo(sh.points[1]);
      bodyM2 += L * D / 1e6;
      const c = getMdfCorners(sh.points[0], sh.points[1], sh.rawCursor);
      const xs = c.map(q=>q.x), ys = c.map(q=>q.y);
      const b = { minX:Math.min(...xs), maxX:Math.max(...xs), minY:Math.min(...ys), maxY:Math.max(...ys) };
      const horiz = (b.maxX-b.minX) > (b.maxY-b.minY)*2;
      const cabMaxY = info.minY + info.H, cabMaxX = info.minX + info.W;
      if(horiz){
        const isTopBottom = b.minY <= info.minY + 30 || b.maxY >= cabMaxY - 30;
        if(isTopBottom || lib.sabitRaf) joints += 2;
      } else {
        const isSide = b.minX <= info.minX + 30 || b.maxX >= cabMaxX - 30;
        if(!isSide) joints += 2;   // ara dikme: tavan ve tabana bağlanır
      }
    });
    const connPerJoint = D > 600 ? 3 : 2;
    const conn = joints * connPerJoint;
    const plan = moduleDoorPlan(info, st, cfgAll);
    let doorM2 = 0, doors = 0;
    if(st.doors && !plan.none){
      const wDoor = info.W/plan.cols - st.deductMm;
      plan.rows.forEach(rh => { doorM2 += plan.cols * wDoor * (rh - st.deductMm) / 1e6; doors += plan.cols; });
    }
    const backM2 = st.backing ? info.W * info.H / 1e6 : 0;
    const mirror = (typeof mirrorFor === 'function') && mirrorFor(info);
    const mirrorM2 = mirror ? doorM2 : 0;
    const drawers = (typeof drawerCountFor === 'function') ? drawerCountFor(info) : 0;
    const hinges = hs.filter(h => h.cab === info.cab).length;
    const kulp = doors + drawers;
    const ayak = lib.ayakAdet > 0 ? (info.W > lib.ayakGenisMm ? lib.ayakGenisAdet : lib.ayakAdet) : 0;
    const backVida = (backM2 > 0 && lib.arkVidaAralik > 0) ? Math.ceil(2 * (info.W + info.H) / lib.arkVidaAralik) : 0;
    const vida = Math.round(hinges * lib.vidaMentese + conn * lib.vidaBaglanti + kulp * lib.vidaKulp + ayak * lib.vidaAyak + backVida);
    const it = { mentese:libActive(lib,'mentese'), baglanti:libActive(lib,'baglanti'), kulp:libActive(lib,'kulp'), ayak:libActive(lib,'ayak'), vida:libActive(lib,'vida') };
    const cnt = { mentese:hinges, baglanti:conn, kulp, ayak, vida };
    let hwKg = 0, hwCost = 0;
    Object.keys(cnt).forEach(k => { hwKg += cnt[k] * (+it[k].g || 0) / 1000; hwCost += cnt[k] * (+it[k].price || 0); });
    const kg = {
      body: bodyM2 * lib.mdfKgM2, door: doorM2 * lib.mdfKgM2, back: backM2 * lib.arkKgM2,
      mirror: mirrorM2 * lib.aynaKgM2, hw: hwKg
    };
    kg.total = kg.body + kg.door + kg.back + kg.mirror + kg.hw;
    const plakaM2 = (lib.plakaEn * lib.plakaBoy) / 1e6 || 5.88;
    const cost = {
      mdf: (bodyM2 + doorM2) * (lib.plakaFiyat / plakaM2),
      back: backM2 * lib.arkFiyatM2, mirror: mirrorM2 * lib.aynaFiyatM2, hw: hwCost
    };
    cost.total = cost.mdf + cost.back + cost.mirror + cost.hw;
    return { cab:info.cab, W:info.W, H:info.H, D, doors, drawers, hinges, kulp, conn, ayak, vida, mirror,
             m2:{ body:bodyM2, door:doorM2, back:backM2, mirror:mirrorM2 }, kg, cost };
  });
  const sum = f => per.reduce((a,x)=>a+f(x), 0);
  const tot = {
    doors:sum(x=>x.doors), drawers:sum(x=>x.drawers), hinges:sum(x=>x.hinges), kulp:sum(x=>x.kulp),
    conn:sum(x=>x.conn), ayak:sum(x=>x.ayak), vida:sum(x=>x.vida), kg:sum(x=>x.kg.total), cost:sum(x=>x.cost.total),
    mdfM2:sum(x=>x.m2.body + x.m2.door), backM2:sum(x=>x.m2.back), mirrorM2:sum(x=>x.m2.mirror)
  };
  const plakaM2 = (lib.plakaEn * lib.plakaBoy) / 1e6 || 5.88;
  tot.plaka = tot.mdfM2 / plakaM2;
  const hasPrice = lib.plakaFiyat > 0 || lib.arkFiyatM2 > 0 || lib.aynaFiyatM2 > 0 || lib.items.some(i => +i.price > 0);
  return { per, tot, lib, hasPrice };
}

function saveToFile(){
  save(false);
  const data = {
    format: 'cizgi-cad', version: 1, savedAt: new Date().toISOString(),
    shapes: shapes.map(sh => Object.assign({}, sh, {
      points: sh.points.map(q=>({x:q.x,y:q.y})),
      rawCursor: sh.rawCursor ? {x:sh.rawCursor.x, y:sh.rawCursor.y} : undefined
    })),
    nextId, scale, offX, offY,
    photo: bgPhoto ? { dataUrl:bgPhoto.dataUrl, x:bgPhoto.x, y:bgPhoto.y, w:bgPhoto.w, h:bgPhoto.h, alpha:bgPhoto.alpha, visible:bgPhoto.visible } : null
  };
  const d = new Date(), z = n => String(n).padStart(2,'0');
  const name = `Cizim_${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}_${z(d.getHours())}${z(d.getMinutes())}.cizgi`;
  const blob = new Blob([JSON.stringify(data)], { type:'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 5000);
  showToast('Kaydedildi: ' + name, 3500);
}
function openFromFile(){
  const inp = document.createElement('input');
  inp.type = 'file';           // filtre yok: bazı telefonlarda .cizgi dosyaları gri görünmesin
  inp.style.display = 'none';
  inp.addEventListener('change', ()=>{
    const f = inp.files && inp.files[0];
    document.body.removeChild(inp);
    if(!f) return;
    const rd = new FileReader();
    rd.onload = ()=>{
      let d;
      try{ d = JSON.parse(rd.result); }catch(e){ showToast('Bu dosya okunamadı (Çizgi dosyası değil)', 3500); return; }
      if(!d || !Array.isArray(d.shapes)){ showToast('Bu bir Çizgi CAD dosyası değil', 3500); return; }
      if(shapes.length && !confirm('"' + f.name + '" açılsın mı? Şu anki çizim yerine geçer (Geri al ile döndürebilirsin).')) return;
      pushHistory();
      shapes = d.shapes.map(sh => {
        const o = Object.assign({}, sh);
        o.points = (sh.points||[]).map(q => new Point(q.x, q.y));
        if(sh.rawCursor) o.rawCursor = new Point(sh.rawCursor.x, sh.rawCursor.y);
        return o;
      });
      nextId = d.nextId || (shapes.reduce((m,x)=>Math.max(m,x.id||0),0)+1);
      drawing=null; liveWorld=null; snapResult=null; selectedShapes=new Set(); clearTrackedPoints();
      if(d.photo && d.photo.dataUrl){
        const img = new Image();
        img.onload = ()=>{
          bgPhoto = { img, dataUrl:d.photo.dataUrl, x:d.photo.x, y:d.photo.y, w:d.photo.w, h:d.photo.h, alpha:d.photo.alpha||0.7, visible:d.photo.visible!==false };
          savePhoto(); render();
        };
        img.src = d.photo.dataUrl;
      }
      autosave(); fitToView();
      showToast('Açıldı: ' + f.name + ' (' + shapes.length + ' çizim öğesi)', 3500);
    };
    rd.onerror = ()=>showToast('Dosya okunamadı');
    rd.readAsText(f);
  });
  document.body.appendChild(inp);
  inp.click();
}

const CSV_COLS_KEY = 'cizgi_csv_cols_v1';
const CSV_COL_DEFS = [
  { id:'no',    title:'Sıra No' },

  { id:'ad',    title:'Parça Adı' },
  { id:'adet',  title:'Adet' },

function loadCsvCols(){
  let saved = null;
  try{ saved = JSON.parse(localStorage.getItem(CSV_COLS_KEY)); }catch(e){}
  const out = [];
  if(Array.isArray(saved)){
    for(const c of saved){
      const d = CSV_COL_DEFS.find(x=>x.id===c.id);
      if(d && !out.some(o=>o.id===d.id)) out.push({ id:d.id, title:(c.title||d.title), on:c.on!==false });
    }
  }
  for(const d of CSV_COL_DEFS) if(!out.some(o=>o.id===d.id)) out.push({ id:d.id, title:d.title, on:true });
  return out;
}

// ---------- DOLAP TESPİTİ ve ÇAKIŞMA KONTROLÜ ----------
let csvMulti = false; // birden fazla dolap varsa true
function ptInPoly(pt, poly){
  let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    if(((poly[i].y>pt.y)!==(poly[j].y>pt.y)) && (pt.x < (poly[j].x-poly[i].x)*(pt.y-poly[i].y)/(poly[j].y-poly[i].y)+poly[i].x)) inside=!inside;
  }
  return inside;
}
function distToPoly(pt, poly){
  let d=Infinity;
  for(let i=0;i<poly.length;i++) d=Math.min(d, pt.distanceToSegment(poly[i], poly[(i+1)%poly.length]));
  return d;
}
function mdfDir(sh){
  const dx=sh.points[1].x-sh.points[0].x, dy=sh.points[1].y-sh.points[0].y, l=Math.hypot(dx,dy)||1;
  return {x:dx/l, y:dy/l};
}
// İki parça birbirine dik ve değiyor/biniyorsa yapısal bağlantı sayılır (paralel yan yana ve uç uca parçalar bağlantı değildir)
function mdfPerpTouch(A, B, polyA, polyB, tol){
  const da=mdfDir(A), db=mdfDir(B);
  if(Math.abs(da.x*db.x + da.y*db.y) > 0.3) return false;
  // Bir parçanın uç kenarının ortası diğer parçanın içinde/üzerindeyse o parça diğerine dayanıyor demektir (sadece köşe teması sayılmaz)
  const endMid = (poly, i0, i1) => new Point((poly[i0].x+poly[i1].x)/2, (poly[i0].y+poly[i1].y)/2);
  const abuts = (poly, other) => [endMid(poly,3,0), endMid(poly,1,2)].some(m => ptInPoly(m, other) || distToPoly(m, other) < tol);
  return abuts(polyA, polyB) || abuts(polyB, polyA);
}
// Her parçaya dolap numarası verir (soldan sağa): id -> 1,2,3...
// Önce üst/alt tahtalara bakılır: yan yana duran ayrı tahta aralıkları ayrı dolaptır. Bulunamazsa dayanma (temas) bağlantısı kullanılır.
function computeCabinets(mdfShapes){
  const n=mdfShapes.length, polys=mdfShapes.map(sh=>getMdfCorners(sh.points[0], sh.points[1], sh.rawCursor));
  const bb=polys.map(pl=>({minX:Math.min(...pl.map(q=>q.x)),maxX:Math.max(...pl.map(q=>q.x)),minY:Math.min(...pl.map(q=>q.y)),maxY:Math.max(...pl.map(q=>q.y))}));
  if(n>=4){
    const gMinY=Math.min(...bb.map(b=>b.minY)), gMaxY=Math.max(...bb.map(b=>b.maxY));
    const plateIdx=[];
    mdfShapes.forEach((sh,i)=>{
      const horiz=(bb[i].maxX-bb[i].minX) > (bb[i].maxY-bb[i].minY)*2;
      if(horiz && (bb[i].minY <= gMinY+30 || bb[i].maxY >= gMaxY-30)) plateIdx.push(i);
    });
    // x aralıklarını birleştir (üst ve alt tahta aynı aralığı kapsar; uç uca değen aralıklar ayrı kalır)
    const ivs=plateIdx.map(i=>({a:bb[i].minX,b:bb[i].maxX})).sort((x,y)=>x.a-y.a);
    const merged=[];
    for(const iv of ivs){
      const last=merged[merged.length-1];
      if(last && iv.a < last.b - 20){ last.b=Math.max(last.b,iv.b); last.a=Math.min(last.a,iv.a); }
      else merged.push({a:iv.a,b:iv.b});
    }
    if(merged.length>=2){
      const map=new Map();
      mdfShapes.forEach((sh,i)=>{
        let best=0, bestOv=-Infinity;
        merged.forEach((m,k)=>{ const ov=Math.min(bb[i].maxX,m.b)-Math.max(bb[i].minX,m.a); if(ov>bestOv){ bestOv=ov; best=k; } });
        map.set(sh.id, best+1);
      });
      return { map, count: merged.length, ranges: merged };
    }
  }
  const par=mdfShapes.map((_,i)=>i);
  const find=i=>{ while(par[i]!==i){ par[i]=par[par[i]]; i=par[i]; } return i; };
  for(let i=0;i<n;i++) for(let j=i+1;j<n;j++){
    if(mdfPerpTouch(mdfShapes[i], mdfShapes[j], polys[i], polys[j], 6)) par[find(i)]=find(j);
  }
  const comps=new Map();
  mdfShapes.forEach((sh,i)=>{
    const r=find(i); if(!comps.has(r)) comps.set(r,{ids:[],minX:Infinity,maxX:-Infinity,minY:Infinity,count:0});
    const c=comps.get(r); c.ids.push(sh.id); c.count++;
    for(const q of polys[i]){ c.minX=Math.min(c.minX,q.x); c.maxX=Math.max(c.maxX,q.x); c.minY=Math.min(c.minY,q.y); }
  });
  const order=[...comps.values()].sort((a,b)=> (Math.abs(a.minX-b.minX)>50 ? a.minX-b.minX : a.minY-b.minY));
  const map=new Map();
  order.forEach((c,idx)=>c.ids.forEach(id=>map.set(id, idx+1)));
  return { map, count: order.length, ranges: order.map(c=>({a:c.minX,b:c.maxX})) };
}
// Uç noktası başka (dik) parçanın içine küçük miktar giriyor veya küçük boşluk bırakıyorsa uyarı üretir
function findMdfOverlaps(mdfShapes){
  const cab=computeCabinets(mdfShapes).map;
  const polys=new Map(mdfShapes.map(sh=>[sh.id, getMdfCorners(sh.points[0], sh.points[1], sh.rawCursor)]));
  const out=[];
  for(const P of mdfShapes){
    for(let k=0;k<2;k++){
      const e=P.points[k], dP=mdfDir(P);
      let best=null;
      for(const Q of mdfShapes){
        if(Q.id===P.id || cab.get(Q.id)!==cab.get(P.id)) continue;
        const dQ=mdfDir(Q);
        if(Math.abs(dP.x*dQ.x+dP.y*dQ.y) > 0.3) continue;
        const poly=polys.get(Q.id);
        const inside=ptInPoly(e, poly), dist=distToPoly(e, poly);
        let kind=null, amount=0;
        if(inside && dist>0.5 && dist<=10){ kind='tasma'; amount=dist; }
        else if(!inside && dist>0.5 && dist<=8){ kind='bosluk'; amount=dist; }
        if(!kind) continue;
        // eksen doğrusunun Q kenar doğrularıyla kesişimi: en yakın olan hedef noktadır
        let target=null, td=Infinity;
        for(let i=0;i<4;i++){
          const c1=poly[i], c2=poly[(i+1)%4];
          const ex=c2.x-c1.x, ey=c2.y-c1.y, den=dP.x*ey-dP.y*ex;
          if(Math.abs(den)<1e-6) continue;
          const t=((c1.x-e.x)*ey-(c1.y-e.y)*ex)/den;
          const pt=new Point(e.x+dP.x*t, e.y+dP.y*t);
          if(Math.abs(t)<td){ td=Math.abs(t); target=pt; }
        }
        if(target && td<=12 && (!best || amount<best.amount)) best={ P, k, kind, amount, target, Q };
      }
      if(best) out.push(best);
    }
  }
  return out;
}

// Parçaları gruplar: aynı dolap + boy + derinlik + bantlama = tek satır, adet artar
function buildMdfGroups(mdfShapes, depthMmDef, separate){
  const cabInfo = computeCabinets(mdfShapes);
  const infosD = moduleInfos(mdfShapes);
  const depthOf = cab => { const inf = infosD.find(x=>x.cab===cab); return inf ? Math.round(cabDepthFor(inf, depthMmDef)) : depthMmDef; };
  const groups = new Map();
  mdfShapes.forEach((s) => {
    const lengthMm = Math.round(s.points[0].distanceTo(s.points[1]));
    const label = s.label || "";
    const note = s.note || "";
    const corners = getMdfCorners(s.points[0], s.points[1], s.rawCursor);
    const cab = cabInfo.map.get(s.id) || 1;
    // Bant kontrolü sadece aynı dolaptaki parçalara göre yapılır (yan yana dolaplar birbirini kapatmaz)
    const mates = mdfShapes.filter(o => cabInfo.map.get(o.id) === cab);
    const depthMm = depthOf(cab);

    const boyFrontClosed = isEdgeClosed(corners[0], corners[1], s.id, mates);
    const derSolClosed = isEdgeClosed(corners[3], corners[0], s.id, mates) || isEndEdgeHidden(corners[3], corners[0], s.id, mates);
    const derSagClosed = isEdgeClosed(corners[1], corners[2], s.id, mates) || isEndEdgeHidden(corners[1], corners[2], s.id, mates);

    const frontBoyBant = boyFrontClosed ? "" : "1";
    const rearBoyBant = "";
    const solDerBant = derSolClosed ? "" : "1";
    const sagDerBant = derSagClosed ? "" : "1";

    const derPair = [solDerBant, sagDerBant].sort().join(',');
    const key = `${separate ? cab : 0}|${lengthMm}|${depthMm}|${frontBoyBant}|${rearBoyBant}|${derPair}`;

    if(groups.has(key)){
      const item = groups.get(key);
      item.count += 1; item.ids.push(s.id);
      if(label && !item.labels.includes(label)) item.labels.push(label);
      if(note && !item.notes.includes(note)) item.notes.push(note);
    } else {
      groups.set(key, {
        ids:[s.id], labels: label ? [label] : [], notes: note ? [note] : [],
        count: 1, lengthMm, depthMm, frontBoyBant, rearBoyBant, solDerBant, sagDerBant,
        cab: separate ? cab : 1
      });
    }
  });
  const list=[...groups.values()];
  if(separate) list.sort((a,b)=>a.cab-b.cab);
  list.cabCount = cabInfo.count;
  return list;
}

function buildCsvText(groupList){
  const cols = loadCsvCols().filter(c=>c.on && (c.id!=='dolap' || csvMulti));
  const val = (id, g, i) => {
    switch(id){
      case 'no': return i+1;
      case 'dolap': return 'Dolap ' + g.cab;
      case 'ad': return g.labels.length ? g.labels.join(' / ') : 'MDF Parça';
      case 'adet': return g.count;
      case 'boy': return fmtLenPlain(g.lengthMm);
      case 'der': return fmtLenPlain(g.depthMm);
      case 'onb': return g.frontBoyBant;
      case 'arkab': return g.rearBoyBant;
      case 'sold': return g.solDerBant;
      case 'sagd': return g.sagDerBant;
      case 'acik': return g.notes.join(' / ');
    }
    return '';
  };
  const clean = v => String(v).replace(/[;\r\n]+/g,' ');
  let out = cols.map(c=>clean(c.title)).join(';') + '\n';
  groupList.forEach((g,i)=>{ out += cols.map(c=>clean(val(c.id,g,i))).join(';') + '\n'; });
  return out;
}

function downloadCsv(groupList){
  const blob = new Blob(["﻿" + buildCsvText(groupList)], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.setAttribute('href', url);
  link.setAttribute('download', `MDF_Kesim_ve_Bant_Listesi_${new Date().toISOString().slice(0,10)}.csv`);
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  showToast(`${groupList.length} satır kesim listesi Excel olarak aktarıldı.`);
}

function focusOnMdf(sh){
  const c = getMdfCorners(sh.points[0], sh.points[1], sh.rawCursor);
  const xs = c.map(q=>q.x), ys = c.map(q=>q.y);
  const minX=Math.min(...xs), maxX=Math.max(...xs), minY=Math.min(...ys), maxY=Math.max(...ys);
  const r = wrap.getBoundingClientRect();
  const w = Math.max(60, maxX-minX), h = Math.max(60, maxY-minY);
  scale = Math.max(0.2, Math.min((r.width-120)/w, (r.height-120)/h, 8));
  offX = r.width/2 - ((minX+maxX)/2)*scale;
  offY = r.height/2 - ((minY+maxY)/2)*scale;
  selectedShapes.clear(); selectedShapes.add(sh.id);
  render();
}

function exportPdf(){
  if(!shapes.length){ showToast('Çizim boş'); return; }
  const { jsPDF } = window.jspdf;
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  for(const s of shapes) for(const p of s.points){ minX=Math.min(minX,p.x); minY=Math.min(minY,p.y); maxX=Math.max(maxX,p.x); maxY=Math.max(maxY,p.y); }
  const drawW=maxX-minX, drawH=maxY-minY;
  const landscape = drawW>drawH;
  const doc = new jsPDF({unit:'mm',format:'a4',orientation:landscape?'landscape':'portrait'});
  const pageW=doc.internal.pageSize.getWidth(), pageH=doc.internal.pageSize.getHeight();
  const margin=15, availW=pageW-margin*2, availH=pageH-margin*2;
  const s = Math.min(availW/Math.max(drawW,1), availH/Math.max(drawH,1));
  const tx=(wx)=>margin+(wx-minX)*s, ty=(wy)=>margin+(wy-minY)*s;

  doc.setLineWidth(0.25); doc.setDrawColor(20,20,20); doc.setTextColor(120,80,10); doc.setFontSize(8);
  function label(p0,p1,mm){
    const n=normalFor(p0,p1);
    const mid={x:(p0.x+p1.x)/2,y:(p0.y+p1.y)/2};
    doc.text(fmtLen(mm), tx(mid.x)+n.x*4.5, ty(mid.y)+n.y*4.5, {align:'center'});
  }
  for(const sh of shapes){
    if(sh.type==='line'){
      const [p0,p1]=sh.points; doc.line(tx(p0.x),ty(p0.y),tx(p1.x),ty(p1.y)); label(p0,p1,p0.distanceTo(p1));
    } else if(sh.type==='polyline'){
      for(let i=0;i<sh.points.length-1;i++){ const p0=sh.points[i],p1=sh.points[i+1]; doc.line(tx(p0.x),ty(p0.y),tx(p1.x),ty(p1.y)); label(p0,p1,p0.distanceTo(p1)); }
    } else if(sh.type==='rect'){
      const p=sh.points;
      for(let i=0;i<4;i++){ const a=p[i],b=p[(i+1)%4]; doc.line(tx(a.x),ty(a.y),tx(b.x),ty(b.y)); }
      label(p[0],p[1],p[0].distanceTo(p[1])); label(p[1],p[2],p[1].distanceTo(p[2]));
    } else if(sh.type==='mdf'){
      const cs = getMdfCorners(sh.points[0], sh.points[1], sh.rawCursor);
      for(let i=0;i<4;i++){ const a=cs[i],b=cs[(i+1)%4]; doc.line(tx(a.x),ty(a.y),tx(b.x),ty(b.y)); }
      label(sh.points[0],sh.points[1],sh.points[0].distanceTo(sh.points[1]));
    } else if(sh.type==='dim'){
      const p0=sh.points[0], p1=sh.points[1];
      const g = dimGeometry(p0,p1,sh.offset);
      [g.ext0,g.ext1].forEach(seg=>{ doc.line(tx(seg[0].x),ty(seg[0].y),tx(seg[1].x),ty(seg[1].y)); });
      doc.line(tx(g.dimP0.x),ty(g.dimP0.y),tx(g.dimP1.x),ty(g.dimP1.y));
      const mid={x:(g.dimP0.x+g.dimP1.x)/2,y:(g.dimP0.y+g.dimP1.y)/2};
      doc.text(fmtLen(p0.distanceTo(p1)), tx(mid.x), ty(mid.y)-1, {align:'center'});
    }
  }
  doc.save('cizgi-cad-'+new Date().toISOString().slice(0,10)+'.pdf');
}

// ================= PDF: PENCERE SEÇ ve KAĞIDA SIĞDIR (AutoCAD "Pencere" gibi) =================
// Ekranda dikdörtgen seçilir; seçilen alan beyaz zemin üzerine, kenarlardan boşluk bırakılarak
// A4 veya A5 sayfaya orantılı sığdırılır. Ekranda ne görünüyorsa (ölçüler, etiketler) o basılır.
const PDF_OPT_KEY = 'cizgi_pdf_opts_v1';
const PAPERS = { a4:[210,297], a5:[148,210] };
function loadPdfOpts(){
  const d = { paper:'a4', orient:'auto', margin:15, mono:true, photo:false, title:'' };
  try{ const s = JSON.parse(localStorage.getItem(PDF_OPT_KEY)); if(s && typeof s === 'object') Object.assign(d, s); }catch(e){}
  return d;
}
function savePdfOpts(o){ try{ localStorage.setItem(PDF_OPT_KEY, JSON.stringify(o)); }catch(e){} }

// Bütün çizimin sınırları (MDF köşeleri ve ölçü çizgileri dahil)
function drawingExtents(){
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  const add = p => { if(!p) return; minX=Math.min(minX,p.x); minY=Math.min(minY,p.y); maxX=Math.max(maxX,p.x); maxY=Math.max(maxY,p.y); };
  for(const s of shapes){
    if(!s.points) continue;
    if(lineOnly && s.type === 'mdf') continue;
    s.points.forEach(add);
    try{
      if(s.type === 'mdf' && s.points.length >= 2) getMdfCorners(s.points[0], s.points[1], s.rawCursor).forEach(add);
      if(s.type === 'dim' && s.points.length >= 2){ const g = dimGeometry(s.points[0], s.points[1], s.offset); [g.dimP0, g.dimP1].forEach(add); }
    }catch(e){}
  }
  if(!isFinite(minX)) return null;
  const pad = Math.max(maxX-minX, maxY-minY) * 0.06 + 40;   // etiketler kenarda kesilmesin
  return { minX:minX-pad, minY:minY-pad, maxX:maxX+pad, maxY:maxY+pad };
}

// Kağıt düzeni: yön, ölçek (kağıt mm / çizim mm), resim boyutu
function pdfLayout(sel, o){
  const [pw0, ph0] = PAPERS[o.paper] || PAPERS.a4;
  const sw = Math.max(1, sel.maxX - sel.minX), sh = Math.max(1, sel.maxY - sel.minY);
  const fit = (pw, ph) => Math.min((pw - 2*o.margin) / sw, (ph - 2*o.margin) / sh);
  let land;
  if(o.orient === 'yatay') land = true;
  else if(o.orient === 'dikey') land = false;
  else land = fit(ph0, pw0) > fit(pw0, ph0);
  const pw = land ? ph0 : pw0, ph = land ? pw0 : ph0;
  const s = fit(pw, ph);
  return { land, pw, ph, s, imgW: sw*s, imgH: sh*s, x: (pw - sw*s)/2, y: (ph - sh*s)/2, ratio: 1/s };
}

let pdfSelUI = null;
// PDF kütüphanesi yoksa (cizgi-cad.html tek başına açılıp lib klasörü bulunmazsa) internetten yükle
function ensureJsPdf(){
  return new Promise((res, rej) => {
    if(window.jspdf && window.jspdf.jsPDF) return res();
    const urls = ['https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js', 'https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js'];
    const tryNext = i => {
      if(i >= urls.length) return rej(new Error('yok'));
      const sc = document.createElement('script'); sc.src = urls[i];
      sc.onload = () => (window.jspdf && window.jspdf.jsPDF) ? res() : tryNext(i+1);
      sc.onerror = () => tryNext(i+1);
      document.head.appendChild(sc);
    };
    tryNext(0);
  });
}

  }
  if(pdfSelUI) pdfSelUI.remove();

  ov.append(box, bar);
  wrap.appendChild(ov);
  pdfSelUI = ov;
  let start = null;
  const pos = e => { const r = wrap.getBoundingClientRect(); return { x:e.clientX - r.left, y:e.clientY - r.top }; };
  // dokunuşlar alttaki çizim aracına geçmesin
  ['pointerdown','pointermove','pointerup','pointercancel','wheel','touchstart','touchmove'].forEach(t => ov.addEventListener(t, ev => ev.stopPropagation(), {passive:false}));
  ov.addEventListener('pointerdown', e => {
    if(bar.contains(e.target)) return;
    e.preventDefault(); start = pos(e);
    try{ ov.setPointerCapture(e.pointerId); }catch(_){}
    box.style.display = 'block'; Object.assign(box.style, { left:start.x+'px', top:start.y+'px', width:'0px', height:'0px' });
  });
  ov.addEventListener('pointermove', e => {
    if(!start) return;
    const p = pos(e);
    Object.assign(box.style, { left:Math.min(p.x,start.x)+'px', top:Math.min(p.y,start.y)+'px', width:Math.abs(p.x-start.x)+'px', height:Math.abs(p.y-start.y)+'px' });
  });
  ov.addEventListener('pointerup', e => {
    if(!start) return;
    const p = pos(e), s0 = start; start = null;
    if(Math.abs(p.x-s0.x) < 15 || Math.abs(p.y-s0.y) < 15){ box.style.display = 'none'; showToast('Daha büyük bir alan seç'); return; }
    const a = screenToWorld({x:Math.min(p.x,s0.x), y:Math.min(p.y,s0.y)});

    close();
    openPdfOptions({ minX:a.x, minY:a.y, maxX:b.x, maxY:b.y });
  });
  function close(){ ov.remove(); if(pdfSelUI === ov) pdfSelUI = null; }
}

// Seçilen alanı yüksek çözünürlükte ana tuvale çizip görüntüyü alır, sonra ekranı geri yükler
function renderWindowImage(sel, L, opt){
  const VP = 4;                       // 1 kağıt mm = 4 çizim pikseli (yazı/çizgi kalınlıkları ekrandaki gibi kalsın)
  const K = 3;                        // gerçek çözünürlük çarpanı (≈ 300 dpi)
  let wv = L.imgW * VP, hv = L.imgH * VP;
  let k = K;
  const MAXPX = 4096;                 // telefon tarayıcıları için güvenli tuval sınırı
  if(Math.max(wv, hv) * k > MAXPX) k = MAXPX / Math.max(wv, hv);
  const save = { scale, offX, offY, sel: new Set(selectedShapes) };
  selectedShapes.clear();
  let url;
  try{
    cv.width = Math.round(wv * k); cv.height = Math.round(hv * k);
    ctx.setTransform(k,0,0,k,0,0);
    ctx.clearRect(0,0,wv,hv);
    scale = L.s * VP; offX = -sel.minX * scale; offY = -sel.minY * scale;
    // 1) fotoğraf (isteğe bağlı) ayrı katman: renkleri ters çevrilmez
    let P = null;
    if(opt.photo){ drawBgPhoto(); P = ctx.getImageData(0,0,cv.width,cv.height).data; ctx.clearRect(0,0,wv,hv); }
    // 2) çizim katmanı
    for(const s of shapes) drawShape(s, false);
    try{ if(typeof drawHinges === 'function') drawHinges(); }catch(e){}
    // beyaz zemin: ekrandaki açık renkli çizgi/yazı koyu olur, koyu etiket kutuları beyaz olur
    const img = ctx.getImageData(0,0,cv.width,cv.height), d = img.data;
    for(let i=0;i<d.length;i+=4){
      const a = d[i+3] / 255;
      let br = 255, bg = 255, bb = 255;
      if(P && P[i+3]){ const pa = P[i+3]/255; br = P[i]*pa + 255*(1-pa); bg = P[i+1]*pa + 255*(1-pa); bb = P[i+2]*pa + 255*(1-pa); }
      let r = (255 - d[i])*a + br*(1-a), g = (255 - d[i+1])*a + bg*(1-a), b = (255 - d[i+2])*a + bb*(1-a);
      if(opt.mono){ const Y = 0.299*r + 0.587*g + 0.114*b; r = g = b = Y; }
      d[i] = r; d[i+1] = g; d[i+2] = b; d[i+3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    url = cv.toDataURL('image/jpeg', 0.95);
  } finally {
    scale = save.scale; offX = save.offX; offY = save.offY;
    save.sel.forEach(id => selectedShapes.add(id));
    resizeCanvas();   // ekran tuvalini eski haline getirir ve yeniden çizer
  }
  return url;
}
// Türkçe harfler PDF'te bozulmasın diye yazılar da resim olarak eklenir
function textImage(txt, px, bold){
  const c = document.createElement('canvas'), g = c.getContext('2d');
  const f = (bold ? '700 ' : '400 ') + px + 'px -apple-system, "Segoe UI", Roboto, Arial, sans-serif';
  g.font = f; const w = Math.ceil(g.measureText(txt).width) + 4;
  c.width = w; c.height = Math.ceil(px * 1.35);
  g.fillStyle = '#fff'; g.fillRect(0,0,c.width,c.height);
  g.font = f; g.fillStyle = '#000'; g.textBaseline = 'middle'; g.fillText(txt, 2, c.height/2);
  return { url: c.toDataURL('image/png'), w: c.width, h: c.height };
}
function buildWindowPdf(sel, opt){
  const L = pdfLayout(sel, opt);
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'mm', format: opt.paper, orientation: L.land ? 'landscape' : 'portrait' });
  const url = renderWindowImage(sel, L, opt);
  doc.addImage(url, 'JPEG', L.x, L.y, L.imgW, L.imgH);
  const r = L.ratio >= 10 ? Math.round(L.ratio) : Math.round(L.ratio*10)/10;
  const d = new Date(), ds = String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + d.getFullYear();
  const foot = textImage('Çizgi CAD · ' + ds + ' · Ölçek ≈ 1:' + String(r).replace('.',',') + ' (' + opt.paper.toUpperCase() + ', %100 yazdırıldığında) · ölçüler cm', 40, false);
  const fh = Math.min(4, opt.margin * 0.4);
  if(fh >= 2) doc.addImage(foot.url, 'PNG', opt.margin, L.ph - opt.margin/2 - fh/2, foot.w * fh / foot.h, fh);
  if(opt.title){
    const t = textImage(opt.title, 60, true), th = Math.min(6, opt.margin * 0.5);
    if(th >= 2.5) doc.addImage(t.url, 'PNG', opt.margin, opt.margin/2 - th/2, t.w * th / t.h, th);
  }
  const name = (opt.title ? opt.title.replace(/[\\/:*?"<>|]+/g,'').slice(0,40) + ' ' : 'cizgi-cad ') + d.toISOString().slice(0,10) + '.pdf';
  const blob = doc.output('blob');
  showPdfReady(blob, name, url, L);
}

// ---- Dosyayı kullanıcıya verme (telefon / APK / bilgisayar) ----
function downloadBlobLocal(blob, name){
  const u = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = u; a.download = name; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(u), 60000);
}
// Ana uygulamanın (index.html) içindeysek indirmeyi ana sayfaya yaptırır; o cevap vermezse burada indirir
function deliverDownload(blob, name){
  if(window.__appSaveBlob){ window.__appSaveBlob(blob, name, 'save'); return; }
  if(window.parent && window.parent !== window){
    let done = false;
    const onAck = e => { if(e.data && e.data.type === 'cizgi-save-ack' && e.data.name === name){ done = true; window.removeEventListener('message', onAck); } };
    window.addEventListener('message', onAck);
    try{ window.parent.postMessage({ type:'cizgi-save-file', name, blob }, '*'); }catch(e){}
    setTimeout(()=>{ window.removeEventListener('message', onAck); if(!done) downloadBlobLocal(blob, name); }, 900);
  } else downloadBlobLocal(blob, name);
}
function showPdfReady(blob, name, previewUrl, L){
  const m = csvModalBase('PDF Hazır');
  const im = document.createElement('img'); im.src = previewUrl;
  im.style.cssText = 'display:block;max-width:100%;max-height:46vh;margin:0 auto 8px;background:#fff;border:1px solid #3a3d42;box-shadow:0 0 0 ' + '6px #fff;';
  const t = document.createElement('div'); t.style.cssText = 'font-size:13px;color:#cfd3d8;text-align:center;';
  t.textContent = name + ' · ' + Math.max(1, Math.round(blob.size/1024)) + ' KB';
  m.body.append(im, t);
  const file = (()=>{ try{ return new File([blob], name, { type:'application/pdf' }); }catch(e){ return null; } })();
  const inApp = !!window.__appSaveBlob;
  const canShare = inApp || !!(file && navigator.canShare && (()=>{ try{ return navigator.canShare({ files:[file] }); }catch(e){ return false; } })());
  const bOpen = csvBtn('Aç / Yazdır', ()=>{
    if(inApp){ window.__appSaveBlob(blob, name, 'open'); return; }
    const u = URL.createObjectURL(blob);
    const w = window.open(u, '_blank');
    if(!w) showToast('Açılamadı — "İndir" ile kaydet', 3000);
  });
  const bDl = csvBtn('İndir', ()=>{ deliverDownload(blob, name); if(!inApp) showToast('PDF indiriliyor: İndirilenler klasörüne bak', 3500); }, true);
  if(canShare) m.foot.append(csvBtn('Paylaş', ()=>{ if(inApp){ window.__appSaveBlob(blob, name, 'share'); return; } navigator.share({ files:[file], title:name }).catch(()=>{}); }));
  m.foot.append(bOpen, csvBtn('Kapat', ()=>m.close()), bDl);
}

function drawCalibMarkers(){
  if(tool!=='calib' || !calibPts.length) return;

// ================= EŞİT BÖL (RAF DAĞIT) =================
// İki paralel parçaya (örn. tavan ve taban) dokun, kaç adet 18 mm parça istediğini yaz:
// aradaki boşluğa parçalar eşit aralıkla otomatik yerleşir. Raf uzunluğu, dokunduğun bölmenin
// iki yan parçası arasına göre otomatik bulunur.
let divideSel = null; // {shape, tap}

function startDivideTool(){
  setTool('divide');
  showToast('Eşit Böl: raf konacak bölmenin içinden, karşılıklı 2 parçaya (örn. tavan ve taban) sırayla dokunun', 4500);
}

function mdfBox(s){
  const pts = s.type==='mdf' ? getMdfCorners(s.points[0], s.points[1], s.rawCursor) : [s.points[0], s.points[1]];
  const xs = pts.map(p=>p.x), ys = pts.map(p=>p.y);
  const b = { minX:Math.min(...xs), maxX:Math.max(...xs), minY:Math.min(...ys), maxY:Math.max(...ys) };
  b.horizontal = (b.maxX-b.minX) >= (b.maxY-b.minY);
  return b;
}

function handleDivideTap(world){
  const hit = hitTestShape(world);
  if(!hit || (hit.type!=='mdf' && hit.type!=='line')){
    showToast('Bir MDF parçasına (veya çizgiye) dokunun', 2500); return;
  }
  if(!divideSel){
    divideSel = { shape:hit, tap:new Point(world.x, world.y) };
    selectedShapes = new Set([hit.id]);
    showToast('1. parça seçildi. Şimdi karşısındaki parçaya dokunun', 3000);
    render(); return;
  }
  if(hit.id === divideSel.shape.id){ showToast('Karşısındaki farklı bir parçaya dokunun', 2500); return; }
  const first = divideSel; divideSel = null; selectedShapes = new Set(); render();
  runDivide(first.shape, hit, new Point((first.tap.x+world.x)/2, (first.tap.y+world.y)/2));
}

function runDivide(sA, sB, tap){
  const A = mdfBox(sA), B = mdfBox(sB);
  if(A.horizontal !== B.horizontal){ showToast('İki parça birbirine paralel olmalı (ikisi de yatay veya ikisi de dikey)', 4000); return; }
  const H = A.horizontal; // true: yatay raflar, yükseklik boyunca bölünür
  // a: raf boyunca eksen, b: bölünen eksen
  const lo = H ? 'minX':'minY', hi = H ? 'maxX':'maxY', bLo = H ? 'minY':'minX', bHi = H ? 'maxY':'maxX';
  const first = (A[bLo] + A[bHi]) <= (B[bLo] + B[bHi]) ? A : B;
  const second = first===A ? B : A;
  const gapLo = first[bHi], gapHi = second[bLo];
  const gap = gapHi - gapLo;
  if(gap < MDF_THICKNESS*2){ showToast('İki parça arası çok dar', 3000); return; }

  // raf boyu: dokunulan bölmenin iki yan parçası arasındaki net ölçü
  const tapA = H ? tap.x : tap.y;
  let aLo = Math.max(A[lo], B[lo]), aHi = Math.min(A[hi], B[hi]);
  if(aHi - aLo < 20){ showToast('Parçalar karşılıklı durmuyor, çizimi kontrol edin', 3500); return; }
  let leftEdge = aLo, rightEdge = aHi;
  const eps = 5;
  shapes.forEach(s=>{
    if(s===sA || s===sB) return;
    if(s.type!=='mdf' && s.type!=='line') return;
    const q = mdfBox(s);
    if(q.horizontal === H) return;               // yalnızca dik duran yan parçalar
    const coversGap = q[bLo] <= gapLo + gap*0.1 && q[bHi] >= gapHi - gap*0.1;
    if(!coversGap) return;
    const mid = (q[lo]+q[hi])/2;
    if(mid <= tapA && q[hi] > leftEdge && q[hi] <= tapA) leftEdge = q[hi];
    if(mid >= tapA && q[lo] < rightEdge && q[lo] >= tapA) rightEdge = q[lo];
  });
  const shelfLen = rightEdge - leftEdge;
  if(shelfLen < 20){ showToast('Bölme genişliği çok dar', 3000); return; }

  let lastN = '5';
  try{ lastN = localStorage.getItem('cizgi_last_div_n') || '5'; }catch(e){}
  const nStr = prompt('Aradaki boşluğa kaç adet 18 mm parça (raf) konsun?\n(Boşluk: '+(Math.round(gap)/10).toString().replace('.',',')+' cm)', lastN);
  if(nStr===null) return;
  const n = parseInt(nStr, 10);
  if(!(n>=1 && n<=60)){ showToast('1 ile 60 arasında bir sayı girin', 3000); return; }
  const space = (gap - n*MDF_THICKNESS) / (n+1);
  if(space <= 0){ showToast('Sığmıyor: '+n+' parça bu boşluğa girmiyor', 3500); return; }
  try{ localStorage.setItem('cizgi_last_div_n', String(n)); }catch(e){}

  pushHistory();
  for(let i=1;i<=n;i++){
    const bStart = gapLo + i*space + (i-1)*MDF_THICKNESS;
    const p0 = H ? new Point(leftEdge, bStart)  : new Point(bStart, leftEdge);
    const p1 = H ? new Point(rightEdge, bStart) : new Point(bStart, rightEdge);
    const cur = H ? new Point(leftEdge, bStart+10) : new Point(bStart+10, leftEdge);  // kalınlık artı yöne
    addShape({type:'mdf', points:[p0,p1], rawCursor:cur, label:'', note:''});
  }
  autosave(); render();
  const spCm = (Math.round(space)/10).toString().replace('.',',');
  const lenCm = (Math.round(shelfLen)/10).toString().replace('.',',');
  showToast(n+' parça eklendi — aralık '+spCm+' cm, raf boyu '+lenCm+' cm', 4500);
}

// ================= TASARLA'YA GÖNDER =================
// Çizimdeki MDF parçalarından Tasarla'nın ölçülerini çıkarır.
// Dikey MDF = dikme (ilk ve son = yan dikmeler, aradakiler = iç bölme)
// Yatay MDF = tavan / taban / raf; tüm genişliği kaplayan ara yatay = üst yüklük ayrımı
function analyzeForTasarla(){
  const mdfs = shapes.filter(s => (s.type==='mdf' || s.type==='line') && s.points && s.points.length>=2);
  if(mdfs.length < 3) return { error:'Çizimde en az 3 parça (MDF veya çizgi) olmalı: 2 yan dikme + tavan/taban.' };

  const items0 = mdfs.map(s=>{
    const c = s.type==='mdf' ? getMdfCorners(s.points[0], s.points[1], s.rawCursor) : [s.points[0], s.points[1]];
    const xs = c.map(p=>p.x), ys = c.map(p=>p.y);
    const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
    return { minX, maxX, minY, maxY, cx:(minX+maxX)/2, cy:(minY+maxY)/2, vertical:(maxY-minY) > (maxX-minX) };
  });

  // Dolaba bağlı olmayan, uzakta unutulmuş parçaları hesaba katma: birbirine yakın en büyük grubu al
  const grp = items0.map((_,i)=>i);
  const findG = i => { while(grp[i]!==i){ grp[i]=grp[grp[i]]; i=grp[i]; } return i; };
  const NEAR = 60;
  for(let i=0;i<items0.length;i++) for(let j=i+1;j<items0.length;j++){
    const a=items0[i], b=items0[j];
    if(a.minX-NEAR<=b.maxX && b.minX-NEAR<=a.maxX && a.minY-NEAR<=b.maxY && b.minY-NEAR<=a.maxY) grp[findG(i)]=findG(j);
  }
  const cnt = {}; items0.forEach((_,i)=>{ const g=findG(i); cnt[g]=(cnt[g]||0)+1; });
  let bestG = null; for(const g in cnt) if(bestG===null || cnt[g]>cnt[bestG]) bestG=g;
  const items = items0.filter((_,i)=>String(findG(i))===String(bestG));
  const ignored = items0.length - items.length;
  if(items.length < 3) return { error:'Çizimde en az 3 parça (MDF veya çizgi) olmalı: 2 yan dikme + tavan/taban.' };

  const bMinX = Math.min(...items.map(i=>i.minX)), bMaxX = Math.max(...items.map(i=>i.maxX));
  const bMinY = Math.min(...items.map(i=>i.minY)), bMaxY = Math.max(...items.map(i=>i.maxY));
  const totalWmm = bMaxX - bMinX, totalHmm = bMaxY - bMinY;

  const vSorted = items.filter(i=>i.vertical).sort((a,b)=>a.cx-b.cx);
  const verts = [];
  vSorted.forEach(v=>{ if(!verts.length || v.cx - verts[verts.length-1].cx > 20) verts.push(v); });
  if(verts.length < 2) return { error:'En az 2 dikey MDF (sol ve sağ yan dikme) çizin.' };

  const bays = [];
  for(let i=0;i<verts.length-1;i++){
    const l = verts[i].maxX, r = verts[i+1].minX;
    const wCm = Math.round(r-l)/10;  // 1 ondalık cm: çizimdeki ölçü birebir taşınır
    if(wCm < 10) continue;
    bays.push({ l, r, widthCm:wCm, shelves:0 });
  }
  if(!bays.length) return { error:'Dikmeler arası boşluk çok dar, çizimi kontrol edin.' };

  let hasSplit = false, yukluk = 50;
  items.filter(i=>!i.vertical).forEach(h=>{
    const isTop = h.minY <= bMinY + 30;
    const isBottom = h.maxY >= bMaxY - 30;
    if(isTop || isBottom) return;
    const ratio = (h.maxX - h.minX) / totalWmm;
    // Tek bölmeli dolapta içeride kalan yatay parça raftır; yüklük ayırıcı ancak yanlar dahil tüm genişliği kaplarsa sayılır
    const isDivider = (bays.length > 1) ? (ratio >= 0.85) : ((h.maxX - h.minX) >= totalWmm - 10);
    if(isDivider){
      if(!hasSplit){
        hasSplit = true;
        yukluk = Math.max(30, Math.min(90, Math.round(((h.minY - bMinY)/10)/5)*5));
      }
      return;
    }
    bays.forEach(b=>{
      const overlap = Math.min(h.maxX, b.r) - Math.max(h.minX, b.l);
      if(overlap >= 0.5*(b.r - b.l)) b.shelves++;
    });
  });

  return {
    widthCm: Math.round(totalWmm)/10,
    heightCm: Math.round(totalHmm)/10,
    bbox: { minX:bMinX, minY:bMinY, maxX:bMaxX, maxY:bMaxY },
    bays, hasSplit, yukluk, ignored
  };
}

function sendToTasarla(){
  const res = analyzeForTasarla();
  if(res.error){ showToast(res.error, 4500); return; }

  let lastDepth = '55';
  try{ lastDepth = localStorage.getItem('cizgi_last_depth') || '55'; }catch(e){}
  const depthStr = prompt('Dolap derinliği kaç cm?', lastDepth);
  if(depthStr === null) return;
  const depthMm = parseCmInputToMm(depthStr);
  if(!depthMm || depthMm <= 0){ showToast('Geçersiz derinlik'); return; }
  const depthCm = Math.round(depthMm/10);
  try{ localStorage.setItem('cizgi_last_depth', String(depthCm)); }catch(e){}

  const summary = res.bays.length+' bölme  |  Yükseklik '+res.heightCm+' cm  |  Derinlik '+depthCm+' cm\n' +
    res.bays.map((b,i)=>(i+1)+'. bölme: '+b.widthCm+' cm, '+b.shelves+' raf').join('\n') +
    (res.hasSplit ? '\nÜst yüklük: '+res.yukluk+' cm' : '') +
    (res.ignored ? '\n\nNot: dolaba uzak '+res.ignored+' parça hesaba katılmadı.' : '');
  if(!confirm("Tasarla'ya gönderilsin mi?\n\n"+summary)) return;

  const payload = {
    type:'cizgi-to-tasarla', version:1, ts:Date.now(),
    width:res.widthCm, height:res.heightCm, depth:depthCm,
    hasSplitDoors:res.hasSplit, yuklukHeight:res.yukluk,
    bays: res.bays.map(b=>({
      width:b.widthCm, doorsPerBay: b.widthCm>65 ? 2 : 1, material:'wood',
      shelves:b.shelves, extDrawers:0, intDrawers:0
    }))
  };

  // Fotoğraf varsa: fotoğraf + dolabın fotoğraf üzerindeki 4 köşesi (0-1 arası oran) gönderilir
  if(bgPhoto && bgPhoto.img){
    const bb = res.bbox;
    const nx = x => Math.max(0, Math.min(1, (x - bgPhoto.x) / bgPhoto.w));
    const ny = y => Math.max(0, Math.min(1, (y - bgPhoto.y) / bgPhoto.h));
    payload.photo = {
      dataUrl: bgPhoto.dataUrl,
      pins: [ {x:nx(bb.minX), y:ny(bb.minY)}, {x:nx(bb.maxX), y:ny(bb.minY)},
              {x:nx(bb.maxX), y:ny(bb.maxY)}, {x:nx(bb.minX), y:ny(bb.maxY)} ]
    };
  }

  // Veriyi her yoldan bırak (aynı site, ana uygulama, iframe)
  // localStorage/adres satırı için fotoğrafın kendisi çıkarılır (fotoğraf zaten ayrı kayıtlı)
  const lite = Object.assign({}, payload);
  if(payload.photo) lite.photo = { pins: payload.photo.pins };
  const json = JSON.stringify(lite);
  try{ localStorage.setItem('cizgi_to_tasarla', json); }catch(e){}
  try{ const bc = new BroadcastChannel('mobilya-studio'); bc.postMessage(payload); bc.close(); }catch(e){}
  autosave();

  let handled = false;
  const inFrame = (window.parent && window.parent !== window);
  try{
    if(typeof window.TasarlaApplyFromCizgi==='function'){ window.TasarlaApplyFromCizgi(payload); handled = true; }
    else if(inFrame && typeof window.parent.TasarlaApplyFromCizgi==='function'){ window.parent.TasarlaApplyFromCizgi(payload); handled = true; }
  }catch(e){}
  try{ if(inFrame){ window.parent.postMessage(payload,'*'); handled = true; } }catch(e){}
  try{
    // Ana uygulama bu olayı dinleyip Tasarla menüsüne geçiyorsa preventDefault() çağırır
    const ev = new CustomEvent('cizgi-send-tasarla',{detail:payload, cancelable:true});
    if(!window.dispatchEvent(ev)) handled = true;
  }catch(e){}

  if(handled){
    showToast("Tasarla'ya gönderildi: "+res.bays.length+' bölme', 3000);
  } else {
    // Ana uygulama yok: Tasarla sayfasını aç, veri adres satırıyla da taşınır
    showToast("Tasarla açılıyor...", 3000);
    let hash = '';
    try{ hash = '#cizgi=' + encodeURIComponent(btoa(json)); }catch(e){}
    setTimeout(()=>{ window.location.href = TASARLA_URL + hash; }, 250);
  }
}

// Tasarla menüsü açılırken / "Çizimden Fotoğrafı Al" denince: fotoğraf + dolabın fotoğraftaki 4 köşesi
window.getTasarlaPhotoPayload = function(){

  else {

    if(parts.length){
      const bs = parts.map(mdfBox);
      bb = { minX:Math.min(...bs.map(b=>b.minX)), maxX:Math.max(...bs.map(b=>b.maxX)),
             minY:Math.min(...bs.map(b=>b.minY)), maxY:Math.max(...bs.map(b=>b.maxY)) };
    }

                 {x:nx(bb.maxX), y:ny(bb.maxY)}, {x:nx(bb.minX), y:ny(bb.maxY)} ];

};

// ================= ELLE ÇİZ (ESKİZ) SAYFASI =================
// Ayrı bir sayfa: kalemle kabaca çiz → Düzelt (yatay/dikey, köşeler bağlanır, iç yüze dayanır)
// → "!" işaretlerine dokunup ölçü ver (kalemle yaz ya da söyle) → Çizim sayfasına gönder.
// Çizim sayfasının parçaları burada soluk arka plan olarak görünür. Çizim sayfasının koduna dokunmaz.
var skPage = 'draw';
const SK_KEY = 'cizgi_sketch_v1';
let sk = { strokes: [], items: [], pins: [], nextId: 1, out: 'mdf', topOver: true };
let skUndoStack = [];
let skMarkerBoxes = [];
let skCur = null, skRef = null, skPenSeen = false;
const SK_T = MDF_THICKNESS;
function skLoad(){ try{ const d = JSON.parse(localStorage.getItem(SK_KEY)); if(d && typeof d === 'object') sk = Object.assign(sk, d); }catch(e){} }
function skSave(){ try{ localStorage.setItem(SK_KEY, JSON.stringify(sk)); }catch(e){} }
function skPush(){ skUndoStack.push(JSON.stringify(sk)); if(skUndoStack.length > 80) skUndoStack.shift(); }
// Gönder / içe al işlemi iki sayfayı birlikte değiştirir: hangisinde Geri Al denirse ikisi birlikte geri döner
const skLinks = [];   // her biri: { top: Çizim geçmişinin üstü, skTop: Elle Çiz geçmişinin üstü, sk: işlem öncesi Elle Çiz }
function skUndo(){
  if(!skUndoStack.length){ showToast('Elle Çiz: geri alınacak işlem yok'); return; }
  const top = skUndoStack[skUndoStack.length - 1];
  sk = JSON.parse(skUndoStack.pop()); skSave();
  const L = skLinks[skLinks.length - 1];
  if(L && top === L.skTop && undoStack.length && undoStack[undoStack.length - 1] === L.top){
    skLinks.pop(); undo(); showToast('Gönderme geri alındı (iki sayfa birlikte)');
  }
  render();
}
function skHookMainUndo(){
  const top = undoStack[undoStack.length - 1];
  setTimeout(() => {
    const L = skLinks[skLinks.length - 1];
    if(L && top === L.top && undoStack[undoStack.length - 1] !== top){
      sk = JSON.parse(L.sk); if(skUndoStack[skUndoStack.length - 1] === L.skTop) skUndoStack.pop();
      skLinks.pop(); skSave(); render(); showToast('Gönderme geri alındı (iki sayfa birlikte)');
    }
  }, 0);
}
skLoad();

function skTolW(){ return (SNAP_SENS_PX[snapSens] || 30) / scale; }
function skItem(id){ return sk.items.find(i => i.id === id); }
function skBand(it){ return it.band || [0, 0]; }
// Uç koordinatı (parçanın kendi ekseni boyunca). Bağlıysa karşı parçanın yüzüne göre hesaplanır.
function skEnd(it, k){
  const j = k ? it.j1 : it.j0, free = k ? it.s1 : it.s0;
  if(!j) return free;
  const o = skItem(j.to);
  if(!o || o.dir === it.dir || o.dir === 'd') return free;
  const b = skBand(o), lo = o.c + b[0], hi = o.c + b[1];
  const bodyPositive = (k === 0);
  if(j.mode === 'over') return bodyPositive ? lo : hi;   // karşı parçanın dış yüzüne kadar uzan
  return bodyPositive ? hi : lo;                          // karşı parçanın iç yüzünde dur
}
function skRect(it){
  if(it.dir === 'd') return null;
  const e0 = skEnd(it, 0), e1 = skEnd(it, 1), b = skBand(it);
  return it.dir === 'h' ? { x0:e0, x1:e1, y0:it.c + b[0], y1:it.c + b[1] } : { y0:e0, y1:e1, x0:it.c + b[0], x1:it.c + b[1] };
}
function skLen(it){
  if(it.dir === 'd') return Math.hypot(it.b.x - it.a.x, it.b.y - it.a.y);
  return skEnd(it, 1) - skEnd(it, 0);
}
function skPrio(it){
  const o = it.order || 0;
  if(it.origin === 'import') return 4e6 - o;
  if(it.role === 'outline' && it.dir === 'h' && sk.topOver) return 3e6 - o;
  if(it.role === 'outline') return 2e6 - o;
  return 1e6 - o;
}

// --- Douglas-Peucker: elle çizilen eğriyi köşelerinden düz parçalara böler ---
function skRdp(pts, eps){
  if(pts.length < 3) return pts.slice();
  const a = pts[0], b = pts[pts.length - 1];
  let idx = -1, dmax = 0;
  const L = Math.hypot(b.x - a.x, b.y - a.y) || 1e-9;
  for(let i = 1; i < pts.length - 1; i++){
    const p = pts[i];
    const d = L < 1e-6 ? Math.hypot(p.x - a.x, p.y - a.y) : Math.abs((b.y - a.y) * p.x - (b.x - a.x) * p.y + b.x * a.y - b.y * a.x) / L;
    if(d > dmax){ dmax = d; idx = i; }
  }
  if(dmax > eps){
    const l = skRdp(pts.slice(0, idx + 1), eps), r = skRdp(pts.slice(idx), eps);
    return l.slice(0, -1).concat(r);
  }
  return [a, b];
}

// --- DÜZELT ---
function skFix(){
  if(!sk.strokes.length){ showToast('Düzeltilecek elle çizim yok'); return; }
  skPush();
  let order = sk.items.reduce((m, i) => Math.max(m, i.order || 0), 0);
  const tol = skTolW();
  sk.strokes.forEach(st => {
    const pts = st.pts;
    if(!pts || pts.length < 2) return;
    const simp = skRdp(pts, st.eps || (10 / scale));
    const segs = [];
    for(let i = 0; i < simp.length - 1; i++){
      const a = simp[i], b = simp[i + 1];
      const len = Math.hypot(b.x - a.x, b.y - a.y);
      if(len < (st.minLen || 15 / scale)) continue;
      const ang = Math.abs(Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI);
      let type = 'd';
      if(ang < 20 || ang > 160) type = 'h';
      else if(ang > 70 && ang < 110) type = 'v';
      const prev = segs[segs.length - 1];
      // aynı yönde arka arkaya gelen parçaları birleştir (titreme)
      if(prev && prev.type === type && type !== 'd'){
        const cPrev = type === 'h' ? (prev.a.y + prev.b.y) / 2 : (prev.a.x + prev.b.x) / 2;
        const cNow = type === 'h' ? (a.y + b.y) / 2 : (a.x + b.x) / 2;
        if(Math.abs(cPrev - cNow) < tol){ prev.b = b; continue; }
      }
      segs.push({ a, b, type });
    }
    segs.forEach((sg, i) => {
      const it = { id: sk.nextId++, origin:'sketch', order: ++order, lenOk:false, posOk:false, j0:null, j1:null };
      if(sg.type === 'h'){ it.dir = 'h'; it.c = (sg.a.y + sg.b.y) / 2; it.s0 = Math.min(sg.a.x, sg.b.x); it.s1 = Math.max(sg.a.x, sg.b.x); }
      else if(sg.type === 'v'){ it.dir = 'v'; it.c = (sg.a.x + sg.b.x) / 2; it.s0 = Math.min(sg.a.y, sg.b.y); it.s1 = Math.max(sg.a.y, sg.b.y); }
      else { it.dir = 'd'; it.a = { x:sg.a.x, y:sg.a.y }; it.b = { x:sg.b.x, y:sg.b.y }; }
      if(i === 0 && st.pin) it.pin = st.pin;
      sk.items.push(it);
    });
  });
  sk.strokes = [];
  skJoinAll(tol);
  skRoles(tol);
  skApplyPins();
  skSave(); render();
  const n = sk.items.filter(i => i.origin === 'sketch' && !i.lenOk).length;
  showToast('Düzeltildi. Ölçü vermek için "!" işaretlerine dokun' + (n ? ' (' + n + ' parça)' : ''), 3500);
}
// Uçları dik parçalara bağla (köşe ve T birleşim); bağlanamazsa Çizim sayfasındaki MDF'nin yüzüne daya
function skJoinAll(tol){
  for(let pass = 0; pass < 2; pass++){
    sk.items.forEach(it => {
      if(it.origin !== 'sketch' || it.dir === 'd') return;
      [0, 1].forEach(k => {
        if(k ? it.j1 : it.j0) return;
        const s = k ? it.s1 : it.s0;
        const P = it.dir === 'h' ? { x:s, y:it.c } : { x:it.c, y:s };
        let best = null, bd = Infinity;
        sk.items.forEach(o => {
          if(o === it || o.dir === 'd' || o.dir === it.dir) return;
          const r = skRect(o);
          const along = it.dir === 'h' ? P.x : P.y;            // bu parçanın ucunun konumu
          const across = it.dir === 'h' ? P.y : P.x;           // karşı parçanın ekseni boyunca konum
          const b = skBand(o), lo = o.c + b[0], hi = o.c + b[1];
          const dist = along < lo ? lo - along : along > hi ? along - hi : 0;
          const e0 = o.dir === 'v' ? r.y0 : r.x0, e1 = o.dir === 'v' ? r.y1 : r.x1;
          if(dist <= tol && across >= e0 - tol && across <= e1 + tol && dist < bd){ bd = dist; best = o; }
        });
        if(best){ const j = { to:best.id, mode:'clip' }; if(k) it.j1 = j; else it.j0 = j; return; }
        if(pass === 1) skSnapToMain(it, k, tol);
      });
    });
  }
}
function skSnapToMain(it, k, tol){
  const s = k ? it.s1 : it.s0;
  for(const sh of shapes){
    if(sh.type !== 'mdf' || !sh.points || sh.points.length < 2) continue;
    const c = getMdfCorners(sh.points[0], sh.points[1], sh.rawCursor);
    const xs = c.map(q => q.x), ys = c.map(q => q.y);
    const r = { x0:Math.min(...xs), x1:Math.max(...xs), y0:Math.min(...ys), y1:Math.max(...ys) };
    if(it.dir === 'h'){
      if((r.y1 - r.y0) < (r.x1 - r.x0)) continue;              // dik (düşey) parça olmalı
      if(it.c < r.y0 - tol || it.c > r.y1 + tol) continue;
      if(s >= r.x0 - tol && s <= r.x1 + tol){ if(k) it.s1 = r.x0; else it.s0 = r.x1; return; }
    } else {
      if((r.x1 - r.x0) < (r.y1 - r.y0)) continue;
      if(it.c < r.x0 - tol || it.c > r.x1 + tol) continue;
      if(s >= r.y0 - tol && s <= r.y1 + tol){ if(k) it.s1 = r.y0; else it.s0 = r.y1; return; }
    }
  }
}
// Gruplar: dış çerçeve (kalınlık içeri) / iç parça (kalınlık ortada); birleşim türü önceliğe göre
function skRoles(tol){
  const items = sk.items.filter(i => i.origin === 'sketch' && i.dir !== 'd');
  const par = new Map(); items.forEach(i => par.set(i.id, i.id));
  const find = x => { while(par.get(x) !== x){ par.set(x, par.get(par.get(x))); x = par.get(x); } return x; };
  items.forEach(i => [i.j0, i.j1].forEach(j => { if(j && par.has(j.to)) par.set(find(i.id), find(j.to)); }));
  const groups = new Map();
  items.forEach(i => { const r = find(i.id); if(!groups.has(r)) groups.set(r, []); groups.get(r).push(i); });
  groups.forEach(g => {
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    g.forEach(i => {
      if(i.dir === 'h'){ minY = Math.min(minY, i.c); maxY = Math.max(maxY, i.c); minX = Math.min(minX, i.s0); maxX = Math.max(maxX, i.s1); }
      else { minX = Math.min(minX, i.c); maxX = Math.max(maxX, i.c); minY = Math.min(minY, i.s0); maxY = Math.max(maxY, i.s1); }
    });
    const T = sk.out === 'line' ? 0 : SK_T;
    g.forEach(i => {
      i.kind = sk.out === 'line' ? 'line' : 'mdf';
      const solo = g.length === 1;
      if(!solo && i.dir === 'h' && Math.abs(i.c - minY) <= tol){ i.role = 'outline'; i.band = [0, T]; }
      else if(!solo && i.dir === 'h' && Math.abs(i.c - maxY) <= tol){ i.role = 'outline'; i.band = [-T, 0]; }
      else if(!solo && i.dir === 'v' && Math.abs(i.c - minX) <= tol){ i.role = 'outline'; i.band = [0, T]; }
      else if(!solo && i.dir === 'v' && Math.abs(i.c - maxX) <= tol){ i.role = 'outline'; i.band = [-T, 0]; }
      else { i.role = 'interior'; i.band = [-T / 2, T / 2]; }
    });
  });
  // birleşim türü: önceliği yüksek olan karşı parçanın dış yüzüne kadar uzanır, düşük olan iç yüzde durur
  items.forEach(i => [i.j0, i.j1].forEach(j => {
    if(!j) return; const o = skItem(j.to); if(!o) return;
    j.mode = skPrio(o) > skPrio(i) ? 'clip' : 'over';
  }));
}
function skApplyPins(){
  sk.items.forEach(it => {
    const p = it.pin; if(!p) return;
    const b = skBand(it);
    if(it.dir === 'h' && p.axis === 'y'){ it.c = p.sign < 0 ? p.y - b[1] : p.y - b[0]; it.posOk = true; }
    else if(it.dir === 'v' && p.axis === 'x'){ it.c = p.sign > 0 ? p.x - b[0] : p.x - b[1]; it.posOk = true; }
    else if(it.dir === 'h'){ it.c = p.y; }
    else if(it.dir === 'v'){ it.c = p.x; }
    delete it.pin;
  });
}
// İç parçanın boşluğu: yatayda altındaki parçaya, düşeyde solundaki parçaya kadar net mesafe
function skGap(it){
  if(it.dir === 'd' || it.role !== 'interior') return null;
  const r = skRect(it); let best = null;
  sk.items.forEach(o => {
    if(o === it || o.dir !== it.dir) return;
    const q = skRect(o);
    if(it.dir === 'h'){
      if(q.x1 <= r.x0 || q.x0 >= r.x1 || q.y0 < r.y1 - 0.01) return;
      const g = q.y0 - r.y1; if(!best || g < best.gap) best = { gap:g, o };
    } else {
      if(q.y1 <= r.y0 || q.y0 >= r.y1 || q.x1 > r.x0 + 0.01) return;
      const g = r.x0 - q.x1; if(!best || g < best.gap) best = { gap:g, o };
    }
  });
  return best;
}
function skSetLen(it, val){
  const d = val - skLen(it);
  if(it.dir === 'd'){ const L = skLen(it) || 1; it.b = { x: it.a.x + (it.b.x - it.a.x) / L * val, y: it.a.y + (it.b.y - it.a.y) / L * val }; it.lenOk = true; return; }
  const o = it.j1 ? skItem(it.j1.to) : null;
  if(o && o.dir !== it.dir && o.dir !== 'd') o.c += d;   // sağdaki/alttaki parça kayar, ona bağlı her şey uyar
  else it.s1 += d;
  it.lenOk = true;
}
function skSetGap(it, val){
  const g = skGap(it); if(!g) return;
  const d = val - g.gap;
  if(it.dir === 'h') it.c -= d; else it.c += d;
  it.posOk = true;
}

// --- Çizim ---
function skDrawLayer(){
  ctx.save();
  const W = p => worldToScreen(p);
  // parçalar
  sk.items.forEach(it => {
    ctx.lineWidth = 1.6;
    ctx.strokeStyle = it.origin === 'import' ? '#9ccc65' : '#4fc3f7';
    ctx.fillStyle = it.origin === 'import' ? 'rgba(156,204,101,0.18)' : 'rgba(79,195,247,0.18)';
    if(it.dir === 'd'){ const a = W(it.a), b = W(it.b); ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.lineWidth = 2.2; ctx.stroke(); return; }
    const r = skRect(it), a = W({ x:r.x0, y:r.y0 }), b = W({ x:r.x1, y:r.y1 });
    if(Math.abs(b.x - a.x) < 1.2 || Math.abs(b.y - a.y) < 1.2){ ctx.lineWidth = 2.2; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
    else { ctx.fillRect(a.x, a.y, b.x - a.x, b.y - a.y); ctx.strokeRect(a.x, a.y, b.x - a.x, b.y - a.y); }
  });
  // ham kalem çizgileri
  const strokeLine = (pts, col, w) => { if(pts.length < 2) return; ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.beginPath(); const p0 = W(pts[0]); ctx.moveTo(p0.x, p0.y); for(let i = 1; i < pts.length; i++){ const q = W(pts[i]); ctx.lineTo(q.x, q.y); } ctx.stroke(); };
  sk.strokes.forEach(st => strokeLine(st.pts, '#e8e8e8', 2.2));
  if(skCur && skCur.pts) strokeLine(skCur.pts, '#ffb454', 2.4);
  // mesafe noktaları (köşeden ölçülü başlangıç)
  sk.pins.forEach(p => { const q = W(p); ctx.fillStyle = '#ff5c5c'; ctx.beginPath(); ctx.arc(q.x, q.y, 6, 0, Math.PI * 2); ctx.fill(); });
  if(skRef){ const q = W(skRef); ctx.strokeStyle = '#ff5c5c'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(q.x, q.y, 11, 0, Math.PI * 2); ctx.stroke(); }
  // "!" ölçü işaretleri
  skMarkerBoxes = [];
  ctx.font = '600 12px -apple-system, sans-serif'; ctx.textBaseline = 'middle';
  const marker = (x, y, txt, ok, imp, item, kind) => {
    const w = ctx.measureText(txt).width + 14, h = 22;
    const bx = x - w / 2, by = y - h / 2;
    ctx.fillStyle = 'rgba(16,18,20,0.92)';
    ctx.strokeStyle = imp ? '#9ccc65' : ok ? '#50c878' : '#ff9800';
    ctx.lineWidth = 1.4; roundRect(bx, by, w, h, 6); ctx.fill(); ctx.stroke();
    ctx.fillStyle = imp ? '#c5e1a5' : ok ? '#7ee2a0' : '#ffb454'; ctx.textAlign = 'center'; ctx.fillText(txt, x, y + 0.5);
    skMarkerBoxes.push({ x0:bx - 4, y0:by - 4, x1:bx + w + 4, y1:by + h + 4, item, kind });
  };
  sk.items.forEach(it => {
    const imp = it.origin === 'import';
    let mid;
    if(it.dir === 'd') mid = W({ x:(it.a.x + it.b.x) / 2, y:(it.a.y + it.b.y) / 2 });
    else { const r = skRect(it); mid = W({ x:(r.x0 + r.x1) / 2, y:(r.y0 + r.y1) / 2 }); }
    const off = it.dir === 'v' ? { x:0, y:-14 } : { x:0, y:-16 };
    marker(mid.x + off.x, mid.y + off.y, (it.lenOk || imp ? '' : '! ') + fmtLenPlain(skLen(it)), it.lenOk, imp, it, 'len');
    const g = skGap(it);
    if(g){
      const r = skRect(it);
      const p = it.dir === 'h' ? W({ x:r.x0 + (r.x1 - r.x0) * 0.22, y:(r.y1 + g.o.c + skBand(g.o)[0]) / 2 }) : W({ x:(r.x0 + g.o.c + skBand(g.o)[1]) / 2, y:r.y0 + (r.y1 - r.y0) * 0.25 });
      marker(p.x, p.y, (it.posOk ? '' : '! ') + (it.dir === 'h' ? 'alt boşluk ' : 'sol boşluk ') + fmtLenPlain(g.gap), it.posOk, false, it, 'gap');
    }
  });
  ctx.restore();
}

// --- Ölçü kutusu: kalemle yaz (Samsung el yazısı) ya da 🎙 ile söyle ---
function skAskNumber(title, initialCm, onOk){
  const m = csvModalBase(title);
  const inp = document.createElement('input');
  inp.type = 'text'; inp.inputMode = 'decimal'; inp.autocomplete = 'off';
  inp.value = initialCm != null ? String(initialCm).replace('.', ',') : '';
  inp.style.cssText = 'width:100%;box-sizing:border-box;font-size:34px;font-weight:700;padding:12px 14px;border-radius:10px;border:2px solid #ffb454;background:#121316;color:#ffb454;text-align:center;';
  const unit = document.createElement('div'); unit.style.cssText = 'text-align:center;color:#9aa0a6;margin:4px 0 8px;font-size:13px;';
  unit.textContent = 'cm — kalemle kutunun içine yaz ya da 🎙 düğmesine basıp söyle (örn: 192,3)';
  const heard = document.createElement('div'); heard.style.cssText = 'text-align:center;color:#ffb454;min-height:18px;font-size:13px;';
  m.body.append(inp, unit, heard);
  let rec = null;
  const mic = csvBtn('🎙 Söyle', () => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){ heard.textContent = 'Bu cihazda ses tanıma yok'; return; }
    try{ if(recognition) recognition.stop(); }catch(e){}
    rec = new SR(); rec.lang = 'tr-TR'; rec.interimResults = true; rec.continuous = false;
    heard.textContent = '🎙 dinliyor…';
    rec.onresult = ev => {
      let t = ''; let fin = false;
      for(let i = ev.resultIndex; i < ev.results.length; i++){ t += ev.results[i][0].transcript; if(ev.results[i].isFinal) fin = true; }
      const v = parseTurkishVoiceInput(String(t).toLowerCase());
      heard.textContent = '🎙 "' + t + '"' + (v ? ' → ' + v + ' cm' : '');
      if(v) inp.value = v;
      if(fin && v) setTimeout(ok, 350);
    };
    rec.onerror = () => { heard.textContent = '🎙 anlaşılamadı, tekrar dene'; };
    try{ rec.start(); }catch(e){}
  });
  const ok = () => {
    const mm = parseCmInputToMm(inp.value);
    if(isNaN(mm) || mm <= 0){ inp.style.borderColor = '#ff5c5c'; return; }
    try{ if(rec) rec.stop(); }catch(e){}
    m.close(); onOk(mm);
  };
  inp.addEventListener('keydown', e => { if(e.key === 'Enter') ok(); });
  m.foot.append(mic, csvBtn('İptal', () => { try{ if(rec) rec.stop(); }catch(e){} m.close(); }), csvBtn('Tamam', ok, true));
  setTimeout(() => { try{ inp.focus(); inp.select(); }catch(e){} }, 120);
}
function skEditMarker(mk){
  const it = mk.item;
  if(mk.kind === 'len'){
    skAskNumber('Parça boyu (kesim ölçüsü)', fmtLenPlain(skLen(it)), mm => { skPush(); skSetLen(it, mm); skSave(); render(); });
  } else {
    const g = skGap(it); if(!g) return;
    skAskNumber(it.dir === 'h' ? 'Rafın altındaki net boşluk' : 'Dikmenin solundaki net boşluk', fmtLenPlain(g.gap), mm => { skPush(); skSetGap(it, mm); skSave(); render(); });
  }
}

// --- Gönder ---
function skSendToDraw(){
  if(sk.strokes.length){ showToast('Önce "Düzelt"e bas (kalem çizgileri henüz düzeltilmedi)', 3500); return; }
  if(!sk.items.length){ showToast('Elle Çiz sayfasında gönderilecek parça yok'); return; }
  const prevSk = JSON.stringify(sk);
  pushHistory(); skPush();
  skLinks.push({ top: undoStack[undoStack.length - 1], skTop: skUndoStack[skUndoStack.length - 1], sk: prevSk }); if(skLinks.length > 30) skLinks.shift();
  let n = 0;
  sk.items.forEach(it => {
    const isLine = it.kind === 'line';
    if(it.dir === 'd'){
      const a = new Point(it.a.x, it.a.y), b = new Point(it.b.x, it.b.y);
      if(isLine || it.origin === 'import' && it.kind === 'line') addShape({ type:'line', points:[a, b], label:'', note:'' });
      else { const nx = -(b.y - a.y), ny = b.x - a.x; addShape({ type:'mdf', points:[a, b], rawCursor:new Point((a.x + b.x) / 2 + nx, (a.y + b.y) / 2 + ny), label:'', note:'' }); }
      n++; return;
    }
    const r = skRect(it);
    const thick = it.dir === 'h' ? r.y1 - r.y0 : r.x1 - r.x0;
    if(thick < 0.5){
      const pts = it.dir === 'h' ? [new Point(r.x0, it.c), new Point(r.x1, it.c)] : [new Point(it.c, r.y0), new Point(it.c, r.y1)];
      addShape({ type:'line', points:pts, label:'', note:'' });
    } else if(it.dir === 'h'){
      addShape({ type:'mdf', points:[new Point(r.x0, r.y0), new Point(r.x1, r.y0)], rawCursor:new Point((r.x0 + r.x1) / 2, r.y1), label:'', note:'' });
    } else {
      addShape({ type:'mdf', points:[new Point(r.x0, r.y0), new Point(r.x0, r.y1)], rawCursor:new Point(r.x1, (r.y0 + r.y1) / 2), label:'', note:'' });
    }
    n++;
  });
  sk.items = []; sk.pins = [];
  skSave(); autosave();
  skSetPage('draw');
  showToast(n + ' parça Çizim sayfasına gönderildi (Geri Al ile geri alınır)', 3500);
}
function skImportFromDraw(){
  const sel = shapes.filter(s => selectedShapes.has(s.id));
  const src = (sel.length ? sel : shapes).filter(s => (s.type === 'mdf' || s.type === 'line') && s.points && s.points.length >= 2);
  if(!src.length){ showToast('Gönderilecek çizgi/MDF yok'); return; }
  const prevSk = JSON.stringify(sk);
  pushHistory(); skPush();
  skLinks.push({ top: undoStack[undoStack.length - 1], skTop: skUndoStack[skUndoStack.length - 1], sk: prevSk }); if(skLinks.length > 30) skLinks.shift();
  let order = sk.items.reduce((m, i) => Math.max(m, i.order || 0), 0);
  const added = [];
  src.forEach(s => {
    const it = { id: sk.nextId++, origin:'import', order: ++order, lenOk:true, posOk:true, j0:null, j1:null, role:'import', kind: s.type === 'line' ? 'line' : 'mdf' };
    if(s.type === 'mdf'){
      const c = getMdfCorners(s.points[0], s.points[1], s.rawCursor), xs = c.map(q => q.x), ys = c.map(q => q.y);
      const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
      const w = x1 - x0, h = y1 - y0;
      if(h <= SK_T + 0.6 && w > h){ it.dir = 'h'; it.c = y0; it.band = [0, h]; it.s0 = x0; it.s1 = x1; }
      else if(w <= SK_T + 0.6 && h > w){ it.dir = 'v'; it.c = x0; it.band = [0, w]; it.s0 = y0; it.s1 = y1; }
      else { it.dir = 'd'; it.a = { x:s.points[0].x, y:s.points[0].y }; it.b = { x:s.points[1].x, y:s.points[1].y }; }
    } else {
      const a = s.points[0], b = s.points[1];
      if(Math.abs(a.y - b.y) < 0.5){ it.dir = 'h'; it.c = a.y; it.band = [0, 0]; it.s0 = Math.min(a.x, b.x); it.s1 = Math.max(a.x, b.x); }
      else if(Math.abs(a.x - b.x) < 0.5){ it.dir = 'v'; it.c = a.x; it.band = [0, 0]; it.s0 = Math.min(a.y, b.y); it.s1 = Math.max(a.y, b.y); }
      else { it.dir = 'd'; it.a = { x:a.x, y:a.y }; it.b = { x:b.x, y:b.y }; }
    }
    sk.items.push(it); added.push(it);
  });
  // değen parçaları birbirine bağla: bir ölçü değişince bağlılar da kayar
  added.forEach(it => {
    if(it.dir === 'd') return;
    [0, 1].forEach(k => {
      const s = k ? it.s1 : it.s0;
      for(const o of added){
        if(o === it || o.dir === 'd' || o.dir === it.dir) continue;
        const b = skBand(o), lo = o.c + b[0], hi = o.c + b[1];
        const oe0 = o.s0 - 0.6, oe1 = o.s1 + 0.6;
        if(it.c + skBand(it)[1] < oe0 - 0.6 || it.c + skBand(it)[0] > oe1 + 0.6) continue;   // bu parça diğerinin boyu içinde ya da ucuna değiyor
        const bodyPos = (k === 0);
        if(Math.abs(s - (bodyPos ? hi : lo)) < 0.6){ const j = { to:o.id, mode:'clip' }; if(k) it.j1 = j; else it.j0 = j; break; }
        if(Math.abs(s - (bodyPos ? lo : hi)) < 0.6 && hi - lo > 0.5){ const j = { to:o.id, mode:'over' }; if(k) it.j1 = j; else it.j0 = j; break; }
      }
    });
  });
  shapes = shapes.filter(s => !src.includes(s));
  selectedShapes.clear();
  autosave(); skSave();
  skSetPage('sketch');
  showToast(src.length + ' parça Elle Çiz sayfasına alındı. Ölçülere dokunup değiştirebilirsin.', 3500);
}

function skBuildUI(){
