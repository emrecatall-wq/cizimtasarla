    --bg:#1b1d1f;

    --panel2:#2c2f33;
    --panel3:#33373c;

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;}

  #topbar{
    display:flex;align-items:center;gap:4px;padding:6px 6px;
    background:var(--panel);border-bottom:1px solid var(--line);
    overflow-x:auto;overflow-y:hidden;flex-shrink:0;
    -webkit-overflow-scrolling:touch;
  }

  #topbar.compact .cg-hide{display:none !important;}

  button.gbtn:active{background:var(--panel3);}

  .tsep{width:1px;height:26px;background:var(--line);flex-shrink:0;margin:0 3px;}

  #popover, #contextMenu{
    position:fixed;z-index:50;background:var(--panel2);border:1px solid var(--line);
    border-radius:10px;padding:5px;display:none;box-shadow:0 6px 18px rgba(0,0,0,.4);
    min-width:180px;
  }
  #popover.show, #contextMenu.show{display:flex;flex-direction:column;gap:4px;}
  .pbtn{
    background:var(--panel3);color:var(--ink);border:1px solid var(--line);
    border-radius:8px;padding:7px 9px;font-size:13px;display:flex;align-items:center;gap:7px;
    cursor:pointer;width:100%;text-align:left;
  }
  .pbtn:hover{background:var(--line);}
  .pbtn.active{background:var(--accent);color:#0d1117;border-color:var(--accent);}
  .pbtn .ic{font-size:15px;width:18px;text-align:center;}

  #overlayClick{position:fixed;inset:0;z-index:40;display:none;}
  #overlayClick.show{display:block;}

  #canvasWrap{flex:1;position:relative;overflow:hidden;touch-action:none;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}

  #statusbar{
    display:flex;justify-content:space-between;align-items:center;
    background:var(--panel);border-top:1px solid var(--line);
    padding:4px 8px;font-size:10.5px;color:var(--dim);gap:8px;flex-shrink:0;
  }
  #statusbar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #pageTabs{display:flex;gap:6px;align-items:center;padding:5px 8px;background:var(--panel);border-top:1px solid var(--line);flex-shrink:0;overflow-x:auto;}
  #pageTabs::-webkit-scrollbar{height:0;}
  .ptb{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;white-space:nowrap;flex-shrink:0;cursor:pointer;}
  .ptb.on{background:var(--accent);color:#0d1117;border-color:var(--accent);}
  .ptb-main{border-color:#ffb454;color:#ffb454;}

  #lenInput{
    position:absolute;z-index:20;background:#101214;color:var(--accent2);
    border:1px solid var(--accent2);border-radius:6px;padding:4px 6px;
    font-size:13px;width:110px;display:none;text-align:center;
  }

  /* Dinamik Ölçü ve Ses Gösterge Kutusu */
  #directInputBox {
    position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
    background: rgba(16,18,20,0.95); border: 2px solid var(--accent2);
    border-radius: 8px; padding: 8px 16px; font-size: 15px; font-weight: 600;
    color: var(--accent2); display: none; z-index: 35; box-shadow: 0 4px 16px rgba(0,0,0,0.6);
  }

  #voiceStatus {
    position: absolute; top: 16px; right: 16px;
    background: rgba(255, 92, 92, 0.2); border: 1px solid var(--danger);
    border-radius: 20px; padding: 6px 12px; font-size: 12px; color: var(--danger);
    display: none; z-index: 35; align-items: center; gap: 6px; font-weight: 600;
  }
  #voiceStatus.active { display: flex; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }

  #toast{

    opacity:0;pointer-events:none;transition:opacity .25s;white-space:nowrap;
  }
  #toast.show{opacity:1;}

<script>
/* ===== APK KÖPRÜSÜ (sadece Android uygulamasının içinde çalışır; sitede hiçbir şey yapmaz) ===== */
(function(){
  if(!window.AndroidBridge) return;
  function mimeFor(name, t){
    const n = String(name).toLowerCase();
    if(n.endsWith('.pdf')) return 'application/pdf';
    if(n.endsWith('.csv')) return 'text/csv';
    if(n.endsWith('.png')) return 'image/png';
    if(n.endsWith('.jpg') || n.endsWith('.jpeg')) return 'image/jpeg';
    if(n.endsWith('.cizgi')) return 'application/octet-stream';
    return t || 'application/octet-stream';
  }
  function toB64(blob){ return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1] || ''); fr.onerror = rej; fr.readAsDataURL(blob); }); }
  // action: 'save' (İndirilenler/MobilyaCAD), 'open' (aç/yazdır), 'share' (paylaş)
  window.__appSaveBlob = function(blob, name, action){
    return toB64(blob).then(b64 => {
      const m = mimeFor(name, blob.type), B = window.AndroidBridge;
      return action === 'open' ? B.openFile(name, m, b64) : action === 'share' ? B.shareFile(name, m, b64) : B.saveFile(name, m, b64);
    });
  };
  // <a download> ile yapılan bütün indirmeler (Excel/CSV, .cizgi, PDF) telefona kaydedilsin
  const origClick = HTMLAnchorElement.prototype.click;
  HTMLAnchorElement.prototype.click = function(){
    const h = this.href || '';
    if(this.hasAttribute('download') && /^(blob:|data:)/.test(h)){
      const name = this.getAttribute('download') || 'dosya';
      fetch(h).then(r => r.blob()).then(b => window.__appSaveBlob(b, name, 'save')).catch(() => {});
      return;
    }
    return origClick.apply(this, arguments);
  };
  // Sesli çizim: telefonun kendi ses tanıması (uygulama içi tarayıcıda Chrome'un ses tanıması yok)
  if(!window.SpeechRecognition && !window.webkitSpeechRecognition){
    function Rec(){ this.lang = 'tr-TR'; this.continuous = false; this.interimResults = false; this.onresult = null; this.onerror = null; this.onend = null; this.onstart = null; }
    Rec._last = 0;
    Rec.prototype.start = function(){
      Rec._active = this;
      const wait = Math.max(0, 450 - (Date.now() - Rec._last));
      setTimeout(() => { Rec._last = Date.now(); try{ window.AndroidBridge.speechStart(this.lang || 'tr-TR', !!this.interimResults); }catch(e){} }, wait);
    };
    Rec.prototype.stop = function(){ try{ window.AndroidBridge.speechStop(); }catch(e){} };
    Rec.prototype.abort = Rec.prototype.stop;
    window.__androidSpeechEvent = function(type, text, fin){
      const r = Rec._active; if(!r) return;
      if(type === 'result'){ const res = [{ transcript: text, confidence: 0.9 }]; res.isFinal = !!fin; if(r.onresult) r.onresult({ resultIndex: 0, results: [res] }); }
      else if(type === 'error'){ if(r.onerror) r.onerror({ error: text }); }
      else if(type === 'start'){ if(r.onstart) r.onstart(); }
      else if(type === 'speechstart'){ if(r.onspeechstart) r.onspeechstart(); }
      else if(type === 'end'){ if(r.onend) r.onend(); }
    };
    window.webkitSpeechRecognition = Rec;
  }
})();
</script>
<script>
(function(){
"use strict";

class Point {
  constructor(x, y) {
    this.x = Number(x);
    this.y = Number(y);
  }

  distanceTo(p) {
    return Math.hypot(this.x - p.x, this.y - p.y);
  }

  midpointTo(p) {
    return new Point((this.x + p.x) / 2, (this.y + p.y) / 2);
  }

  projectToSegment(p1, p2) {
    const dx = p2.x - p1.x;
    const dy = p2.y - p1.y;
    const len2 = dx * dx + dy * dy;
    if (len2 === 0) return new Point(p1.x, p1.y);

    let t = ((this.x - p1.x) * dx + (this.y - p1.y) * dy) / len2;
    t = Math.max(0, Math.min(1, t));
    return new Point(p1.x + t * dx, p1.y + t * dy);
  }

  distanceToSegment(p1, p2) {
    const proj = this.projectToSegment(p1, p2);
    return this.distanceTo(proj);
  }
}

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const wrap = document.getElementById('canvasWrap');

let shapes = [];
let undoStack = []; 
let nextId = 1;
let scale = 3;
let offX = 0, offY = 0;
let tool = 'mdf';        
let inputMode = 'pen';     
let orthoOn = true;
let snapOn = true;
let voiceControlOn = false;
let multiSelect = false;

let snapSettings = {
  endpoint: true,
  midpoint: true,
  pointSnap: true,
  perpendicular: true,
  tracking: true,
  corner: true,
  grid: false
};

let drawing = null;
let liveWorld = null;
let rawMouseWorld = null;
let snapResult = null;
let hoverTrackPoint = null;
let trackedPoints = [];

let selectedShapes = new Set();
let contextMenuTarget = null;
let dragSnapshot = null;   
let dragMoved = false;

let clipboard = [];
let pasteOffset = 0;

let editingLabel = null;
let directTypedLength = "";

const pointers = new Map();
let pinchStartDist=null, pinchStartScale=null, pinchStartMid=null, pinchStartOff=null;
let panLast=null;
let isMiddleMousePan = false;

const MDF_THICKNESS = 18; // mm cinsinden sabit MDF kalınlığı

// ---------- ARKA PLAN FOTOĞRAFI ----------
const PHOTO_KEY = 'cizgi_cad_photo';
let bgPhoto = null; // {img, dataUrl, x, y, w, h, alpha, visible}  (x,y,w,h: dünya koordinatı, mm)
let calibPts = [];

const lenInput = document.getElementById('lenInput');
const directInputBox = document.getElementById('directInputBox');
const directInputLabel = document.getElementById('directInputLabel');
const directInputVal = document.getElementById('directInputVal');
const voiceStatus = document.getElementById('voiceStatus');
const btnVoiceToggle = document.getElementById('btnVoiceToggle');
const toast = document.getElementById('toast');
const stMode = document.getElementById('stMode');
const stCoord = document.getElementById('stCoord');
const stZoom = document.getElementById('stZoom');
const popover = document.getElementById('popover');
const contextMenu = document.getElementById('contextMenu');
const overlayClick = document.getElementById('overlayClick');

// ---------- EKRAN GÖSTERİMİ FONKSİYONLARI ----------
function fmtLen(mm){
  const cmVal = Math.round(mm) / 10;
  const strVal = cmVal.toString().replace('.', ',');
  return strVal + ' cm';
}

// ---------- TEMİZ YALIN SAYI FORMATI (CSV İÇİN) ----------
// CSV hücresine basarken sonundaki ' cm' yazısını temizler, sadece yalın sayı bırakır (örn: 201,4)
function fmtLenPlain(mm){
  const cmVal = Math.round(mm) / 10;
  return cmVal.toString().replace('.', ',');
}

function parseCmInputToMm(strVal){
  if(!strVal) return 0;
  const cleanStr = strVal.toString().trim().replace(',', '.');
  const cmVal = parseFloat(cleanStr);
  if(isNaN(cmVal)) return 0;
  return Math.round(cmVal * 10);
}

function pushHistory(){
  undoStack.push(JSON.stringify(shapes));
  if(undoStack.length > 30) undoStack.shift();
}

function undo(){
  if(undoStack.length === 0){
    showToast('Geri alınacak işlem yok');
    return;
  }
  shapes = JSON.parse(undoStack.pop());
  shapes.forEach(s => {
    s.points = s.points.map(p => new Point(p.x, p.y));
    if(s.rawCursor) s.rawCursor = new Point(s.rawCursor.x, s.rawCursor.y);
  });
  selectedShapes.clear();
  drawing = null;
  clearTrackedPoints();
  autosave();
  render();
  showToast('İşlem geri alındı');
}

function uid(){ return nextId++; }
function worldToScreen(p){ return { x: p.x*scale+offX, y: p.y*scale+offY }; }
function screenToWorld(p){ return new Point((p.x-offX)/scale, (p.y-offY)/scale); }

function showToast(msg, ms){
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>toast.classList.remove('show'), ms||2000);
}

function resizeCanvas(){
  const r = wrap.getBoundingClientRect();
  cv.width = r.width*devicePixelRatio;
  cv.height = r.height*devicePixelRatio;
  cv.style.width=r.width+'px'; cv.style.height=r.height+'px';
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  render();
}
window.addEventListener('resize', resizeCanvas);
try{ if(window.ResizeObserver) new ResizeObserver(()=>{ const r=wrap.getBoundingClientRect(); if(r.width>0 && r.height>0 && (Math.abs(cv.clientWidth-r.width)>1 || Math.abs(cv.clientHeight-r.height)>1)) resizeCanvas(); }).observe(wrap); }catch(e){}

const STORAGE_KEY = 'cizgi_cad_v14_data';
function save(showMsg){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({shapes,scale,offX,offY,nextId}));
    if(showMsg) showToast('Kaydedildi');
  }catch(e){ if(showMsg) showToast('Kaydedilemedi'); }
}
function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return false;
    const d = JSON.parse(raw);
    shapes = d.shapes||[]; scale=d.scale||3; offX=d.offX||0; offY=d.offY||0;
    shapes.forEach(s => {
      s.points = s.points.map(p => new Point(p.x, p.y));
      if(s.rawCursor) s.rawCursor = new Point(s.rawCursor.x, s.rawCursor.y);
    });
    nextId = d.nextId || (shapes.reduce((m,s)=>Math.max(m,s.id||0),0)+1);
    return true;
  }catch(e){ return false; }
}
function autosave(){ save(false); try{ if(typeof hingeWatch === 'function') hingeWatch(); }catch(e){} }

function getMdfCorners(p0, p1, rawCursor){
  const dx = p1.x - p0.x, dy = p1.y - p0.y;
  const len = p0.distanceTo(p1) || 1;
  let nx = -dy / len, ny = dx / len;
  const t = MDF_THICKNESS;

  if(rawCursor){
    const cross = (p1.x - p0.x)*(rawCursor.y - p0.y) - (p1.y - p0.y)*(rawCursor.x - p0.x);
    if(cross < 0){
      nx = -nx; ny = -ny;
    }
  }

  return [
    new Point(p0.x, p0.y),
    new Point(p1.x, p1.y),
    new Point(p1.x + nx * t, p1.y + ny * t),
    new Point(p0.x + nx * t, p0.y + ny * t)
  ];
}

function getSnapPoints(excludeId){
  const pts = [];
  for(const s of shapes){
    if(s.id === excludeId || s.type === 'dim') continue;
    if(lineOnly && s.type === 'mdf') continue;   // "Sadece Çizgi" modunda MDF gizli: yakalanmaz

    if(snapSettings.endpoint || snapSettings.pointSnap){
      if(s.type === 'mdf'){
        const corners = getMdfCorners(s.points[0], s.points[1], s.rawCursor);
        corners.forEach(p => pts.push({ point: p, type: 'point', parentShape: s }));
      } else {
        s.points.forEach(p => pts.push({ point: p, type: 'point', parentShape: s }));
      }
    }

    if(snapSettings.midpoint){
      if(s.type === 'line'){
        pts.push({ point: s.points[0].midpointTo(s.points[1]), type: 'mid', parentShape: s });
      } else if(s.type === 'rect' || s.type === 'mdf'){
        const p = s.type === 'mdf' ? getMdfCorners(s.points[0], s.points[1], s.rawCursor) : s.points;
        for(let i=0; i<4; i++){
          const a = p[i], b = p[(i+1)%4];
          pts.push({ point: a.midpointTo(b), type: 'mid', parentShape: s });
        }
      }
    }
  }
  return pts;
}

function addTrackedPoint(p){
  for(const tp of trackedPoints){
    if(tp.distanceTo(p) < 0.01) return;
  }
  trackedPoints.push(new Point(p.x, p.y));
  if(trackedPoints.length > 2) trackedPoints.shift();
}
function clearTrackedPoints(){
  trackedPoints = [];
}
function feedTrackedPointsFromPoints(pts){
  for(const p of pts) addTrackedPoint(p);
}

// Yakalama alanı: farede 14 px; kalem/parmakta hassasiyet ayarına göre daha geniş
let lastPtrType = 'mouse';
let snapSens = 'orta';
try{ snapSens = localStorage.getItem('cizgi_snap_sens') || 'orta'; }catch(e){}
const SNAP_SENS_PX = { az:18, orta:30, cok:45 };
function snapRadiusPx(){ return (lastPtrType === 'pen' || lastPtrType === 'touch') ? (SNAP_SENS_PX[snapSens] || 30) : 14; }
function computeSnap(worldPt, excludeId){
  if(!snapOn) return { point: worldPt, marker: null, guides: [], trackBase: null, trackDir: null, trackDist: 0 };
  
  const snapPts = getSnapPoints(excludeId);
  const radius = snapRadiusPx() / scale;
  let best = null, minD = Infinity;

  for(const sp of snapPts){
    const d = worldPt.distanceTo(sp.point);
    if(d < radius && d < minD){
      minD = d;
      best = sp;
    }
  }

  if(best){
    hoverTrackPoint = best.point;
    if(snapSettings.tracking && best.type === 'point'){
      addTrackedPoint(best.point);
    }
    return { point: best.point, marker: best.type, guides: [], trackBase: null, trackDir: null, trackDist: 0 };
  }

  if(snapSettings.tracking && trackedPoints.length){
    const tol = 16 / scale;

    if(trackedPoints.length >= 2){
      for(let i=0;i<trackedPoints.length;i++){
        for(let j=0;j<trackedPoints.length;j++){
          if(i===j) continue;
          const a = trackedPoints[i], b = trackedPoints[j];
          const candidate = new Point(a.x, b.y);
          if(worldPt.distanceTo(candidate) < tol){
            return { point: candidate, marker: 'track2', guides: [a, b], trackBase: null, trackDir: null, trackDist: 0 };
          }
        }
      }
    }

    for(const tp of trackedPoints){
      const dx = worldPt.x - tp.x;
      const dy = worldPt.y - tp.y;
      
      if(Math.abs(dx) < tol){
        const dirY = dy >= 0 ? 1 : -1;
        const dir = { x: 0, y: dirY };
        const snappedPt = new Point(tp.x, worldPt.y);
        const dist = Math.abs(dy);
        return { point: snappedPt, marker: 'track', guides: [tp], trackBase: tp, trackDir: dir, trackDist: dist };
      }
      
      if(Math.abs(dy) < tol){
        const dirX = dx >= 0 ? 1 : -1;
        const dir = { x: dirX, y: 0 };
        const snappedPt = new Point(worldPt.x, tp.y);
        const dist = Math.abs(dx);
        return { point: snappedPt, marker: 'track', guides: [tp], trackBase: tp, trackDir: dir, trackDist: dist };
      }
    }
  }

  if(snapSettings.perpendicular && drawing && drawing.points.length > 0){
    for(const s of shapes){
      if(s.id === excludeId || s.type === 'dim') continue;
      if(lineOnly && s.type === 'mdf') continue;
      const edges = (s.type === 'mdf') ? getMdfCorners(s.points[0], s.points[1], s.rawCursor) : s.points;
      for(let i=0; i < ((s.type==='line')?1:(s.type==='polyline'?edges.length-1:edges.length)); i++){
        const p1 = edges[i], p2 = edges[(i+1)%edges.length];
        const proj = worldPt.projectToSegment(p1, p2);
        if(worldPt.distanceTo(proj) < radius){
          return { point: proj, marker: 'perp', guides: [p1, p2], trackBase: null, trackDir: null, trackDist: 0 };
        }
      }
    }
  }

  return { point: worldPt, marker: null, guides: [], trackBase: null, trackDir: null, trackDist: 0 };
}

function applyOrtho(start, pt){
  if(!orthoOn || !start) return pt;
  const dx = Math.abs(pt.x - start.x), dy = Math.abs(pt.y - start.y);
  return dx >= dy ? new Point(pt.x, start.y) : new Point(start.x, pt.y);
}

// Yakalama (snap) sonrası noktayı başlangıçla aynı yatay/dikey eksende tutar
function keepAxis(start, orthoPt, snapPt){
  if(!orthoOn || !start) return snapPt;
  const horizontal = Math.abs(orthoPt.y - start.y) < 1e-9;
  return horizontal ? new Point(snapPt.x, start.y) : new Point(start.x, snapPt.y);
}

let recognition = null;
let voiceCommitTimer = null;

function initVoiceRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    showToast('Cihazınız ses tanıma özelliğini desteklemiyor.');
    return null;
  }

  const rec = new SpeechRecognition();
  rec.lang = 'tr-TR';
  rec.continuous = true;
  rec.interimResults = true;

  rec.onresult = (event) => {
    let transcript = '', isFinal = false;
    for (let i = event.resultIndex; i < event.results.length; ++i) {
      transcript += event.results[i][0].transcript;
      if (event.results[i].isFinal) isFinal = true;
    }
    transcript = transcript.trim().toLowerCase();
    if (!transcript) return;
    if (voiceDrawSession) { voiceDrawOnResult(transcript, isFinal); return; }
    if (voiceMode === 'draw') return;   // çizgi bitti, geç gelen sonucu yok say

    // "iptal" → yazılan ölçüyü sil
    if (VOICE_CANCEL.test(transcript)) {
      clearTimeout(voiceCommitTimer); resetDirectInput();
      showVoiceHeard('🎙 "' + transcript + '" → iptal edildi');
      return;
    }
    // "tamam" / "bitir" → hemen çiz
    const wantsCommit = VOICE_END.test(transcript);
    const parsedStr = parseTurkishVoiceInput(transcript.replace(VOICE_END_ALL, ' '));
    const trackMode = !drawing && snapResult && snapResult.marker === 'track';

    if (!parsedStr) {
      if (wantsCommit && directTypedLength.length > 0 && (drawing || trackMode)) {
        clearTimeout(voiceCommitTimer); commitDirectTypedLength();
        showVoiceHeard('🎙 tamam → çizildi');
      } else {
        showVoiceHeard('🎙 "' + transcript + '" → sayı anlaşılamadı', !isFinal);
      }
      return;
    }
    if (!drawing && !trackMode) {
      showVoiceHeard('🎙 ' + parsedStr + ' cm — önce çizime başla (ilk noktaya dokun)', true);
      return;
    }
    directTypedLength = parsedStr;
    updateDirectInputUI();
    const p0 = drawing ? drawing.points[0] : null;
    const noDir = !!drawing && (!liveWorld || p0.distanceTo(liveWorld) < 0.5);
    clearTimeout(voiceCommitTimer);
    if (isFinal || wantsCommit) {
      if (noDir) { showVoiceHeard('🎙 ' + parsedStr + ' cm — yön ver: kalemi gideceği yöne çek, sonra "tamam" de', true); return; }
      showVoiceHeard('🎙 ' + parsedStr + ' cm ✓');
      voiceCommitTimer = setTimeout(() => { if (directTypedLength.length > 0) commitDirectTypedLength(); }, 150);
    } else {
      showVoiceHeard('🎙 ' + parsedStr + ' cm …');
    }
  };

  rec.onstart = () => { if (voiceDrawSession && !voiceDrawValue) showVoiceHeard('🎙 dinliyor — ölçüyü söyle'); };
  rec.onspeechstart = () => { if (voiceDrawSession) voiceDrawSpeechAt = Date.now(); };

  rec.onerror = (event) => {
    if(event.error === 'not-allowed' || event.error === 'service-not-allowed'){
      voiceControlOn = false;
      voiceDrawSession = false;
      setVoiceModeUI('off');
      voiceStatus.classList.remove('active');
      showToast('Mikrofon izni verilmedi.');
    } else if(event.error === 'network'){
      showVoiceHeard('🎙 Ses tanıma internet bağlantısı istiyor olabilir', true);
    }
  };
  rec.onend = () => {
    if (voiceControlOn) {
      try { rec.start(); } catch(e){}
    } else if (voiceDrawWaiting) {
      voiceDrawFlush();                       // kesin sonuç gelmeden bitti: son duyulanla çiz
    } else if (voiceDrawSession && drawing) {
      try { rec.start(); } catch(e){}         // çizgi henüz bitmedi: dinlemeye devam
    } else {
      voiceStatus.classList.remove('active');
    }
  };

  return rec;
}

// ===== SESLE ÇİZ: "ÇİZERKEN DİNLE" MODU =====
// Çizgiye başlayınca mikrofon açılır, söylenen ölçü ekranda görünür; çizgiyi kalemle/parmakla
// bitirince çizgi o yönde ve söylenen uzunlukta biter, mikrofon kapanır.
let voiceMode = 'off';            // 'off' | 'draw' (çizerken dinle) | 'cont' (sürekli dinle)
let voiceDrawSession = false, voiceDrawValue = null, voiceDrawPartialAt = 0, voiceDrawFinalAt = 0, voiceDrawSpeechAt = 0;
let voiceDrawWaiting = null, voiceDrawWatch = null;
function setVoiceModeUI(m){
  voiceMode = m;
  btnVoiceToggle.classList.toggle('on', m !== 'off');
  const l = btnVoiceToggle.querySelector('.lbl');
  if(l) l.textContent = m === 'draw' ? 'Ses: Çizerken' : m === 'cont' ? 'Ses: Sürekli' : 'Sesle Çiz';
  try{ localStorage.setItem('cizgi_voice_mode', m === 'draw' ? 'draw' : 'off'); }catch(e){}
}
function setVoiceMode(m){
  voiceControlOn = false;
  stopVoiceRecognition();
  voiceDrawEnd();
  setVoiceModeUI(m);
  if(m === 'cont'){ voiceControlOn = true; startVoiceRecognition(); }
  else if(m === 'draw'){
    showToast('Çizerken dinle açık: çizgiye başla → ölçüyü söyle → çizgiyi bitir', 4000);
    if(drawing && (drawing.type === 'line' || drawing.type === 'mdf')) voiceDrawBegin();
  }
  else showToast('Sesle çizim kapalı');
}
function voiceDrawBegin(){
  if(voiceMode !== 'draw') return;
  voiceDrawValue = null; voiceDrawPartialAt = 0; voiceDrawFinalAt = 0; voiceDrawSpeechAt = 0; voiceDrawWaiting = null;
  if(!window.isSecureContext){ showToast('Mikrofon için HTTP/HTTPS sunucusu gereklidir.'); return; }
  if(!recognition) recognition = initVoiceRecognition();
  if(!recognition) return;
  voiceDrawSession = true;
  try{ recognition.start(); }catch(e){}
  voiceStatus.classList.add('active');
  clearInterval(voiceDrawWatch);
  // çizim başka yolla biterse (Esc, Enter, Karşıya, Geri Al) mikrofonu kapat
  voiceDrawWatch = setInterval(() => { if(voiceDrawSession && !drawing && !voiceDrawWaiting) voiceDrawEnd(); }, 300);
}
function voiceDrawEnd(){
  voiceDrawSession = false;
  clearInterval(voiceDrawWatch); voiceDrawWatch = null;
  if(voiceDrawWaiting){ clearTimeout(voiceDrawWaiting.timer); voiceDrawWaiting = null; }
  try{ if(recognition) recognition.stop(); }catch(e){}
  voiceStatus.classList.remove('active');
}
function voiceDrawOnResult(transcript, isFinal){
  if(VOICE_CANCEL.test(transcript)){ voiceDrawValue = null; resetDirectInput(); directInputBox.style.display = 'block'; showVoiceHeard('🎙 iptal — çizgi serbest bitecek'); return; }
  if(isFinal) voiceDrawFinalAt = Date.now(); else voiceDrawPartialAt = Date.now();
  const parsed = parseTurkishVoiceInput(transcript.replace(VOICE_END_ALL, ' '));
  if(parsed){
    voiceDrawValue = parsed;
    directTypedLength = parsed; updateDirectInputUI();
    showVoiceHeard('🎙 ' + parsed + ' cm' + (isFinal ? ' ✓ — çizgiyi bitir' : ' …'));
  } else if(isFinal){
    showVoiceHeard('🎙 "' + transcript + '" → sayı anlaşılamadı', true);
  }
  if(isFinal && voiceDrawWaiting) voiceDrawFlush();
}
// Çizgiyi bitirme dokunuşu: true dönerse bitirmeyi bu fonksiyon üstlenir
function voiceDrawFinish(worldPt){
  if(!voiceDrawSession || !drawing || (drawing.type !== 'line' && drawing.type !== 'mdf')) return false;
  if(voiceDrawWaiting) return true;
  // Elde kesin (son) sonuç varsa hemen çiz
  const lastHeard = Math.max(voiceDrawPartialAt, voiceDrawSpeechAt);
  if(voiceDrawValue && voiceDrawFinalAt >= lastHeard){ voiceDrawApply(worldPt); return true; }
  // Sonuç henüz gelmedi (telefon sonucu konuşmadan ~1 sn sonra verir): dinlemeyi bitir,
  // duyduğunu vermesini iste ve en fazla 3 sn bekle. Hiç konuşulmadıysa dinleme hemen biter, çizgi serbest kalır.
  showVoiceHeard('🎙 ölçü bekleniyor…');
  voiceDrawWaiting = { pt: worldPt, timer: setTimeout(voiceDrawFlush, 3000) };
  try{ if(recognition) recognition.stop(); }catch(e){}
  return true;
}
function voiceDrawFlush(){
  const w = voiceDrawWaiting; if(!w) return;
  clearTimeout(w.timer); voiceDrawWaiting = null;
  voiceDrawApply(w.pt);
}
function voiceDrawApply(worldPt){
  if(!drawing){ voiceDrawEnd(); return; }
  const p0 = drawing.points[0];
  let target = worldPt;
  const mm = voiceDrawValue ? parseCmInputToMm(voiceDrawValue) : NaN;
  if(!isNaN(mm) && mm > 0){
    let dx = worldPt.x - p0.x, dy = worldPt.y - p0.y, L = Math.hypot(dx, dy);
    if(L < 0.5 && liveWorld){ dx = liveWorld.x - p0.x; dy = liveWorld.y - p0.y; L = Math.hypot(dx, dy); }
    if(L < 0.5){ dx = 1; dy = 0; L = 1; }
    target = new Point(p0.x + dx / L * mm, p0.y + dy / L * mm);
    showVoiceHeard('🎙 ' + voiceDrawValue + ' cm çizildi ✓');
  }
  voiceDrawEnd();
  finalizeSimpleShape(target);
  render();
}

function startVoiceRecognition() {
  if (!window.isSecureContext) {
    showToast('Mikrofon için HTTP/HTTPS sunucusu gereklidir.');
    voiceControlOn = false;
    btnVoiceToggle.classList.remove('on');
    return;
  }
  if (!recognition) recognition = initVoiceRecognition();
  if (recognition) {
    try {
      recognition.start();
      voiceStatus.classList.add('active');
      showToast('Sesli ölçü dinleniyor (Örn: 190 veya 190 virgül 3)');
    } catch(e) {}
  }
}

function stopVoiceRecognition() {
  if (recognition) {
    try { recognition.stop(); } catch(e) {}
  }
  voiceStatus.classList.remove('active');
  clearTimeout(voiceCommitTimer);
}

// Sesle Çiz: "tamam/bitir" = çiz, "iptal" = sil. ("nokta" ve "virgül" ondalık ayırıcıdır: 192 nokta 3 = 192,3 cm)
const VOICE_END = /(^|\s)(tamam|bitir|bitti|onay|onayla|çiz)(\s|$)/;
const VOICE_END_ALL = /(^|\s)(tamam|bitir|bitti|onay|onayla|çiz)(?=\s|$)/g;
const VOICE_CANCEL = /(^|\s)(iptal|vazgeç)(\s|$)/;
let voiceHeardEl = null, voiceHeardT = null;
function showVoiceHeard(text, warn){
  if(!voiceHeardEl){
    voiceHeardEl = document.createElement('div');
    voiceHeardEl.style.cssText = 'position:absolute;top:52px;right:16px;z-index:36;background:rgba(16,18,20,.95);border:1px solid #ffb454;border-radius:10px;padding:7px 11px;font:600 14px -apple-system,sans-serif;color:#e8e8e8;max-width:72%;pointer-events:none;display:none;';
    wrap.appendChild(voiceHeardEl);
  }
  voiceHeardEl.textContent = text;
  voiceHeardEl.style.borderColor = warn ? '#ff5c5c' : '#ffb454';
  voiceHeardEl.style.display = 'block';
  clearTimeout(voiceHeardT);
  voiceHeardT = setTimeout(() => { voiceHeardEl.style.display = 'none'; }, 5000);
}
function normalizeVoiceText(str){
  let s = ' ' + String(str).toLowerCase() + ' ';
  // "1 metre 92" → 192, "2 metre" → 200
  s = s.replace(/(\d+)\s*metre\s*(\d{1,2})(?!\d)/g, (m, a, b) => ' ' + (parseInt(a,10)*100 + parseInt(b,10)) + ' ');
  s = s.replace(/(\d+)\s*metre/g, (m, a) => ' ' + (parseInt(a,10)*100) + ' ');
  s = s.replace(/(\d)\s*[.,]\s*(\d)/g, '$1 virgül $2');        // telefon "192.3" veya "192,3" yazarsa
  s = s.replace(/buçuk/g, ' virgül 5 ');
  s = s.replace(/santimetre|santim|cm/g, ' virgül ');           // "192 santim 3 milim"
  s = s.replace(/milimetre|milim|mm/g, ' ');
  s = s.replace(/nokta/g, ' virgül ');
  return s;
}
function parseTurkishVoiceInput(str) {
  let normalized = normalizeVoiceText(str).replace(/virgül/g, ',');
  const parts = normalized.split(',').map(p => p.trim());
  
  if(parts.length > 0){
    const mainNum = parseTurkishNumber(parts[0]);
    if(mainNum !== null){
      const decPart = parts.slice(1).find(p => p.length > 0);
      if(decPart !== undefined){
        const decNum = parseTurkishNumber(decPart);
        if(decNum !== null){
          return mainNum + ',' + decNum;
        }
      }
      return mainNum.toString();
    }
  }
  return null;
}

function parseTurkishNumber(str) {
  const digits = str.replace(/[^0-9]/g, '');
  if (digits.length > 0) return parseInt(digits, 10);

  const units = { 'sıfır':0, 'bir':1, 'iki':2, 'üç':3, 'dört':4, 'beş':5, 'altı':6, 'yedi':7, 'sekiz':8, 'dokuz':9 };
  const tens = { 'on':10, 'yirmi':20, 'otuz':30, 'kırk':40, 'elli':50, 'altmış':60, 'yetmiş':70, 'seksen':80, 'doksan':90 };

  const words = str.split(/\s+/);
  let total = 0, current = 0;

  for (let w of words) {
    if (units[w] !== undefined) current += units[w];
    else if (tens[w] !== undefined) current += tens[w];
    else if (w === 'yüz') {
      current = (current === 0 ? 1 : current) * 100;
    } else if (w === 'bin') {
      total += (current === 0 ? 1 : current) * 1000;
      current = 0;
    }
  }
  total += current;
  return total > 0 ? total : null;
}

function drawGrid(){
  const r = wrap.getBoundingClientRect();
  const step = pickGridStep();
  const stepPx = step*scale;
  ctx.save();
  const startX = offX%stepPx, startY = offY%stepPx;
  ctx.beginPath();
  for(let x=startX;x<r.width;x+=stepPx){ ctx.moveTo(x,0); ctx.lineTo(x,r.height); }
  for(let y=startY;y<r.height;y+=stepPx){ ctx.moveTo(0,y); ctx.lineTo(r.width,y); }
  ctx.strokeStyle='#2a2d31'; ctx.lineWidth=1; ctx.stroke();
  ctx.beginPath();
  ctx.strokeStyle='#3a3f45';
  ctx.moveTo(offX,0); ctx.lineTo(offX,r.height);
  ctx.moveTo(0,offY); ctx.lineTo(r.width,offY);
  ctx.stroke();
  ctx.restore();
}

function pickGridStep(){
  const target=60; let step=10;
  while(step*scale<target) step*= (step/10===1?2.5:2);
  while(step*scale>target*4) step/=2;
  return step;
}

function normalFor(p0,p1){
  const dx=p1.x-p0.x, dy=p1.y-p0.y;
  let nx=-dy,ny=dx; const len=Math.hypot(nx,ny)||1;
  nx/=len; ny/=len;
  if(ny>0){ nx=-nx; ny=-ny; }
  if(nx===0&&ny===0){ nx=0; ny=-1; }
  return {x:nx,y:ny};
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function drawLabelBox(sx,sy,text,hitKey,mm,editable){

function drawLenLabel(p0,p1,mm,hitKey,editable,tv){
  const s0=worldToScreen(p0), s1=worldToScreen(p1);
  const mid={x:(s0.x+s1.x)/2,y:(s0.y+s1.y)/2};
  let n=normalFor(p0,p1);
  const text = fmtLen(mm);
  ctx.font='600 12px -apple-system, sans-serif';
  const boxW = ctx.measureText(text).width + (editable!==false ? 22 : 0) + 14;
  const boxH = 20, gap = 12;
  // tv: MDF kalınlığının ekrandaki yönü/uzunluğu (varsa etiket kalınlığın üstüne binmesin)
  let extra = 0;
  if(tv){
    const dot = n.x*tv.x + n.y*tv.y;
    if(dot > 0){
      if(Math.abs(n.x) > Math.abs(n.y)){ n = {x:-n.x, y:-n.y}; }   // dikey parça: kalınlığın karşı tarafına
      else { extra = Math.hypot(tv.x, tv.y); }                      // yatay parça: üstte kal, kalınlığı aş
    }
  }
  // Kutunun yarı boyutu + boşluk kadar uzaklaş: yatayda eskisi gibi 22 px, dikeyde kutunun yarı genişliği kadar yana
  const clear = Math.abs(n.x)*(boxW/2) + Math.abs(n.y)*(boxH/2) + gap;
  const offset = Math.max(22, clear) + extra;
  drawLabelBox(mid.x+n.x*offset, mid.y+n.y*offset, text, hitKey, mm, editable!==false);
}

function mdfThicknessVec(p0,p1,rawCursor){
  const cs = getMdfCorners(p0,p1,rawCursor).map(worldToScreen);
  return { x:cs[3].x-cs[0].x, y:cs[3].y-cs[0].y };
}

function drawMdf(s, isSelected){
  const p0 = s.points[0], p1 = s.points[1];
  const corners = getMdfCorners(p0, p1, s.rawCursor).map(worldToScreen);
  ctx.beginPath();
  corners.forEach((sp, i) => { i === 0 ? ctx.moveTo(sp.x, sp.y) : ctx.lineTo(sp.x, sp.y); });
  ctx.closePath();
  ctx.fillStyle = isSelected ? 'rgba(79,168,255,0.3)' : 'rgba(255,180,84,0.25)';
  ctx.strokeStyle = isSelected ? '#4fa8ff' : '#ffb454';
  ctx.lineWidth = 2;
  ctx.fill(); ctx.stroke();

  // Parça adı ekranda gösterilmez; sadece Excel/CSV çıktısında yer alır.
}

function drawShape(s, isSelected){
  ctx.save();
  ctx.strokeStyle = isSelected ? '#4fa8ff' : '#e8e8e8';
  ctx.lineWidth=2;

  if(s.type==='line'){
    const [p0,p1]=s.points;
    const a=worldToScreen(p0), b=worldToScreen(p1);
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
    if(!hideDims) drawLenLabel(p0,p1,p0.distanceTo(p1), s.id+':0');
  } else if(s.type==='polyline'){
    ctx.beginPath();
    s.points.forEach((p,i)=>{ const sp=worldToScreen(p); i===0?ctx.moveTo(sp.x,sp.y):ctx.lineTo(sp.x,sp.y); });
    ctx.stroke();
    if(!hideDims) for(let i=0;i<s.points.length-1;i++) drawLenLabel(s.points[i],s.points[i+1],s.points[i].distanceTo(s.points[i+1]), s.id+':'+i);
  } else if(s.type==='rect'){
    const p=s.points;
    ctx.beginPath();
    p.forEach((pt,i)=>{ const sp=worldToScreen(pt); i===0?ctx.moveTo(sp.x,sp.y):ctx.lineTo(sp.x,sp.y); });
    ctx.closePath(); ctx.stroke();
    if(!hideDims){
      drawLenLabel(p[0],p[1],p[0].distanceTo(p[1]), s.id+':w');
      drawLenLabel(p[1],p[2],p[1].distanceTo(p[2]), s.id+':h');
    }
  } else if(s.type==='mdf'){
    // "Sadece Çizgi" modunda MDF parçaları tamamen gizlenir (veri silinmez)
    if(lineOnly){ ctx.restore(); return; }
    drawMdf(s, isSelected);
    if(!hideDims) drawLenLabel(s.points[0], s.points[1], s.points[0].distanceTo(s.points[1]), s.id+':0', true, mdfThicknessVec(s.points[0], s.points[1], s.rawCursor));
  } else if(s.type==='dim'){
    if(!hideDims) drawDimension(s, isSelected);
  }
  ctx.restore();
}

function dimGeometry(p0,p1,offsetSigned){
  const dx=p1.x-p0.x, dy=p1.y-p0.y;
  const len=p0.distanceTo(p1)||1;
  const rnx=-dy/len, rny=dx/len; 
  const disp = { x: rnx*offsetSigned, y: rny*offsetSigned };
  const dimP0 = new Point(p0.x+disp.x, p0.y+disp.y);
  const dimP1 = new Point(p1.x+disp.x, p1.y+disp.y);
  const sign = offsetSigned>=0 ? 1 : -1;
  const gap = 1.2;      
  const overshoot = 1.8;  
  const ext0a = new Point(p0.x+rnx*sign*gap, p0.y+rny*sign*gap);
  const ext0b = new Point(dimP0.x+rnx*sign*overshoot, dimP0.y+rny*sign*overshoot);
  const ext1a = new Point(p1.x+rnx*sign*gap, p1.y+rny*sign*gap);
  const ext1b = new Point(dimP1.x+rnx*sign*overshoot, dimP1.y+rny*sign*overshoot);
  return { dimP0, dimP1, ext0:[ext0a,ext0b], ext1:[ext1a,ext1b] };
}

function drawArrow(tipWorld, dirWorld){
  const tip = worldToScreen(tipWorld);
  const dLen = Math.hypot(dirWorld.x,dirWorld.y)||1;
  const ux=dirWorld.x/dLen, uy=dirWorld.y/dLen;
  const s2 = worldToScreen({x:tipWorld.x+ux, y:tipWorld.y+uy});
  const sdx=s2.x-tip.x, sdy=s2.y-tip.y;
  const sl=Math.hypot(sdx,sdy)||1;
  const sux=sdx/sl, suy=sdy/sl;
  const pux=-suy, puy=sux;
  const aLen=11, aW=3.6;
  const base={x:tip.x+sux*aLen, y:tip.y+suy*aLen};
  ctx.beginPath();
  ctx.moveTo(tip.x,tip.y);
  ctx.lineTo(base.x+pux*aW, base.y+puy*aW);
  ctx.lineTo(base.x-pux*aW, base.y-puy*aW);
  ctx.closePath();
  ctx.fill();
}

function drawDimension(s, isSelected){
  const [p0,p1] = s.points;
  const off = s.offset;
  const g = dimGeometry(p0,p1,off);
  const color = isSelected ? '#4fa8ff' : '#c9cdd2';
  ctx.save();
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth=1.2;
  [g.ext0,g.ext1].forEach(seg=>{
    const a=worldToScreen(seg[0]), b=worldToScreen(seg[1]);
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  });
  const a=worldToScreen(g.dimP0), b=worldToScreen(g.dimP1);
  ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  const dir0 = { x:g.dimP1.x-g.dimP0.x, y:g.dimP1.y-g.dimP0.y };
  const dir1 = { x:g.dimP0.x-g.dimP1.x, y:g.dimP0.y-g.dimP1.y };
  drawArrow(g.dimP0, dir0);
  drawArrow(g.dimP1, dir1);
  ctx.restore();
  const mid = { x:(a.x+b.x)/2, y:(a.y+b.y)/2 };
  const mm = p0.distanceTo(p1);
  drawLabelBox(mid.x, mid.y, fmtLen(mm), s.id+':dim', mm, false);
}

function drawInProgress(){
  if(!drawing) return;
  ctx.save();
  ctx.strokeStyle='#4fa8ff'; ctx.lineWidth=2; ctx.setLineDash([]);

  if(drawing.type==='line'){
    const p0=drawing.points[0], p1=liveWorld||p0;
    const a=worldToScreen(p0), b=worldToScreen(p1);
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
    drawLenLabel(p0,p1,p0.distanceTo(p1),'live',false);
  } else if(drawing.type==='mdf'){
    const p0=drawing.points[0], p1=liveWorld||p0;
    if(mdfCenter){
      const sp = centerShiftPts(p0, p1, rawMouseWorld);
      drawMdf({points:sp, rawCursor:rawMouseWorld}, true);
      // merkez ekseni kesikli göster
      const a=worldToScreen(p0), b=worldToScreen(p1);
      ctx.save(); ctx.setLineDash([6,4]); ctx.strokeStyle='#ffffff'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); ctx.restore();
    } else {
      drawMdf({points:[p0,p1], rawCursor:rawMouseWorld}, true);
    }
    drawLenLabel(p0, p1, p0.distanceTo(p1), 'live', false, mdfThicknessVec(p0, p1, rawMouseWorld));
  } else if(drawing.type==='polyline'){
    ctx.beginPath();
    drawing.points.forEach((p,i)=>{ const sp=worldToScreen(p); i===0?ctx.moveTo(sp.x,sp.y):ctx.lineTo(sp.x,sp.y); });
    if(liveWorld){ const sp=worldToScreen(liveWorld); ctx.lineTo(sp.x,sp.y); }
    ctx.stroke();
    if(liveWorld){
      const last=drawing.points[drawing.points.length-1];
      drawLenLabel(last,liveWorld,last.distanceTo(liveWorld),'live',false);
    }
  } else if(drawing.type==='rect'){
    const p0=drawing.points[0], p1=liveWorld||p0;
    const corners=[new Point(p0.x,p0.y), new Point(p1.x,p0.y), new Point(p1.x,p1.y), new Point(p0.x,p1.y)];
    const sc=corners.map(worldToScreen);
    ctx.beginPath();
    sc.forEach((sp,i)=>{ i===0?ctx.moveTo(sp.x,sp.y):ctx.lineTo(sp.x,sp.y); });
    ctx.closePath(); ctx.stroke();
    drawLenLabel(corners[0],corners[1],corners[0].distanceTo(corners[1]),'live-w',false);
    drawLenLabel(corners[1],corners[2],corners[1].distanceTo(corners[2]),'live-h',false);
  } else if(drawing.type==='dim'){
    if(drawing.stage===2 && liveWorld){
      const a=worldToScreen(drawing.points[0]), b=worldToScreen(liveWorld);
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
    } else if(drawing.stage===3 && liveWorld){
      const p0=drawing.points[0], p1=drawing.points[1];
      const rawOff = signedOffsetFromLine(p0,p1,liveWorld);
      const fake = { id:'draft', points:[p0,p1], offset:rawOff };
      drawDimension(fake, true);
    }
  }
  ctx.restore();
}

function signedOffsetFromLine(p0,p1,pt){
  const dx=p1.x-p0.x, dy=p1.y-p0.y;
  const len=p0.distanceTo(p1)||1;
  const rnx=-dy/len, rny=dx/len;
  return (pt.x-p0.x)*rnx + (pt.y-p0.y)*rny;
}

const SNAP_TAGS = { point:'Endpoint (Uç)', mid:'Midpoint (Orta)', perp:'Perpendicular (Dik)', track:'Tracking (Hiza)', track2:'Tracking (Kesişim)' };
function drawSnapTag(sp, text){
  ctx.save();
  ctx.font = '600 11px -apple-system, sans-serif';
  const w = ctx.measureText(text).width + 10, h = 18;
  const x = sp.x + 12, y = sp.y + 10;
  ctx.fillStyle = 'rgba(16,18,20,0.92)'; ctx.strokeStyle = '#ffb454'; ctx.lineWidth = 1;
  roundRect(x, y, w, h, 5); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#ffb454'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(text, x + 5, y + h/2 + 0.5);
  ctx.restore();
}

function drawSnapAndTrack(){
  if(snapSettings.tracking && trackedPoints.length){
    ctx.save();
    ctx.strokeStyle = '#ffb454'; ctx.lineWidth = 1.5;
    for(const tp of trackedPoints){
      const sp2 = worldToScreen(tp);
      ctx.beginPath();
      ctx.moveTo(sp2.x-5, sp2.y); ctx.lineTo(sp2.x+5, sp2.y);
      ctx.moveTo(sp2.x, sp2.y-5); ctx.lineTo(sp2.x, sp2.y+5);
      ctx.stroke();
    }
    ctx.restore();
  }

  if(hoverTrackPoint){
    const tp = worldToScreen(hoverTrackPoint);
    ctx.save();
    ctx.strokeStyle = '#4fa8ff'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(tp.x, tp.y, 5, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  if(snapResult && snapResult.marker){
    const sp=worldToScreen(snapResult.point);
    ctx.save(); 
    ctx.strokeStyle='#ffb454'; ctx.fillStyle='#ffb454'; ctx.lineWidth=2;

    if(snapResult.marker==='point'){ 
      ctx.beginPath(); ctx.arc(sp.x, sp.y, 6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    } else if(snapResult.marker==='track2'){
      const p1s = worldToScreen(snapResult.guides[0]);
      const p2s = worldToScreen(snapResult.guides[1]);
      ctx.save(); ctx.setLineDash([5, 5]); ctx.strokeStyle='#4fa8ff'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(p1s.x, p1s.y); ctx.lineTo(sp.x, sp.y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(p2s.x, p2s.y); ctx.lineTo(sp.x, sp.y); ctx.stroke();
      ctx.restore();
      ctx.beginPath();
      ctx.moveTo(sp.x-7,sp.y); ctx.lineTo(sp.x+7,sp.y);
      ctx.moveTo(sp.x,sp.y-7); ctx.lineTo(sp.x,sp.y+7);
      ctx.stroke();
      ctx.beginPath(); ctx.arc(sp.x, sp.y, 3.5, 0, Math.PI * 2); ctx.fill();
    } else if(snapResult.marker==='track'){
      const tp = worldToScreen(snapResult.guides[0]);
      ctx.save(); ctx.setLineDash([5, 5]); ctx.strokeStyle='#4fa8ff'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(tp.x, tp.y); ctx.lineTo(sp.x, sp.y); ctx.stroke(); ctx.restore();
      ctx.beginPath(); ctx.arc(sp.x, sp.y, 5, 0, Math.PI * 2); ctx.fill();

      if(snapResult.trackDist > 0){
        ctx.font = 'bold 11px -apple-system, sans-serif';
        ctx.fillStyle = '#ffb454';
        ctx.fillText(fmtLen(snapResult.trackDist), sp.x + 10, sp.y - 10);
      }

    } else if(snapResult.marker==='mid'){ 
      ctx.beginPath(); ctx.moveTo(sp.x,sp.y-7); ctx.lineTo(sp.x+7,sp.y+6); ctx.lineTo(sp.x-7,sp.y+6); ctx.closePath(); ctx.stroke(); 
    } else if(snapResult.marker==='perp'){
      ctx.beginPath(); ctx.moveTo(sp.x-8,sp.y-8); ctx.lineTo(sp.x+8,sp.y-8); ctx.lineTo(sp.x+8,sp.y+8); ctx.stroke();
    } else { 
      ctx.beginPath(); ctx.moveTo(sp.x-6,sp.y-6); ctx.lineTo(sp.x+6,sp.y+6); ctx.moveTo(sp.x+6,sp.y-6); ctx.lineTo(sp.x-6,sp.y+6); ctx.stroke(); 
    }
    ctx.restore();
    if(SNAP_TAGS[snapResult.marker]) drawSnapTag(sp, SNAP_TAGS[snapResult.marker]);
  }
}

function render(){
  labelHitboxes=[];
  const r=wrap.getBoundingClientRect();
  // Tuvalin tamamını temizle (boyut değişse bile eski kareler kalmasın = ekran akması önlenir)
  ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height); ctx.restore();
  ctx.clearRect(0,0,r.width,r.height);
  drawGrid();
  drawBgPhoto();
  const skFade = (typeof skPage !== 'undefined' && skPage === 'sketch');
  ctx.save(); if(skFade) ctx.globalAlpha = 0.3;   // Elle Çiz sayfasında asıl çizim soluk arka plan
  for(const s of shapes) drawShape(s, selectedShapes.has(s.id));
  ctx.restore();
  try{ if(!skFade && typeof drawHinges === 'function') drawHinges(); }catch(e){}
  if(skFade){ try{ skDrawLayer(); }catch(e){ console.error(e); } }
  drawInProgress();
  drawSnapAndTrack();
  drawCalibMarkers();
  stZoom.textContent='Ölçek: '+Math.round(scale/3*100)+'%';
  stMode.textContent = 'Mod: ' + tool.toUpperCase();
}

let panOnly = false;
function getPointerType(e){ return e.pointerType||'mouse'; }
function shouldDraw(e){
  if(isMiddleMousePan) return false;
  if(panOnly) return false;
  const pt=getPointerType(e);
  if(inputMode==='pan') return false;
  if(inputMode==='pen') return pt==='pen'||pt==='mouse';
  return true;
}
function shouldPan(e){
  if(isMiddleMousePan) return true;
  if(panOnly) return true;
  const pt=getPointerType(e);
  if(inputMode==='pan') return true;
  if(inputMode==='pen') return pt==='touch';
  return false;
}
function localPos(e){ const r=wrap.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; }

wrap.addEventListener('pointerdown', onPointerDown, {passive:false});
wrap.addEventListener('pointermove', onPointerMove, {passive:false});
wrap.addEventListener('pointerup', onPointerUp, {passive:false});
wrap.addEventListener('pointercancel', onPointerUp, {passive:false});
wrap.addEventListener('wheel', onWheel, {passive:false});

wrap.addEventListener('contextmenu', (e)=>{
  e.preventDefault();
  const lp = localPos(e);
  const world = screenToWorld(lp);
  const hit = hitTestShape(world);

  if(hit){
    contextMenuTarget = hit;
    selectedShapes = new Set([hit.id]);
    render();
    contextMenu.style.left = e.clientX + 'px';
    contextMenu.style.top = e.clientY + 'px';
    contextMenu.classList.add('show');
    overlayClick.classList.add('show');
  }
});

function onPointerDown(e){
  if(e.button === 2) return;

  if(e.button === 1){
    e.preventDefault();
    isMiddleMousePan = true;
    panLast = localPos(e);
    wrap.setPointerCapture(e.pointerId);
    return;
  }

  e.preventDefault();
  wrap.setPointerCapture(e.pointerId);
  const lp=localPos(e);
  pointers.set(e.pointerId,{x:lp.x,y:lp.y,type:getPointerType(e)});

  // Çizgi çizerken (ilk nokta konmuşsa) ölçü kutuları dokunuşu yakalamasın: çizgi karşı kenarda bitebilsin
  const hitLabel = drawing ? null : hitTestLabel(lp);
  if(hitLabel){ openLabelEditor(hitLabel); return; }
  closeLabelEditor();

  if(pointers.size===2){ startPinch(); return; }

  if(shouldPan(e)){ panLast=lp; return; }

  if(shouldDraw(e)){
    const world = screenToWorld(lp);
    if(tool==='select'){ startSelectDrag(world, e); return; }
    if(tool==='eraser'){ eraseAt(world); return; }
    if(tool==='calib'){ handleCalibTap(world); return; }
    if(tool==='divide'){ handleDivideTap(world); return; }
    
    const excludeId = drawing?drawing.id:null;
    let pt = world;
    if(drawing && drawing.points.length > 0){
      const startPt = drawing.points[drawing.points.length-1];
      pt = applyOrtho(startPt, pt);
    }
    const snapped = computeSnap(pt, excludeId);
    if(drawing && drawing.points.length > 0) snapped.point = keepAxis(drawing.points[drawing.points.length-1], pt, snapped.point);
    handleDrawTap(snapped.point);
  }
}

function onPointerMove(e){
  const lp=localPos(e);
  if(pointers.has(e.pointerId)) pointers.set(e.pointerId,{x:lp.x,y:lp.y,type:getPointerType(e)});

  if(pointers.size===2){ updatePinch(); render(); return; }

  if(isMiddleMousePan || (panLast && shouldPan(e))){
    offX += lp.x-panLast.x; offY += lp.y-panLast.y; panLast=lp; render(); return;
  }

  const world = screenToWorld(lp);
  rawMouseWorld = world;
  stCoord.textContent = 'X:'+fmtLen(world.x)+' Y:'+fmtLen(world.y);

  if(dragSnapshot){
    const dx = world.x-dragSnapshot.startWorld.x;
    const dy = world.y-dragSnapshot.startWorld.y;
    if(Math.hypot(dx,dy)*scale > 3) dragMoved = true;
    if(dragMoved){
      for(const item of dragSnapshot.items){
        const sh = shapes.find(s=>s.id===item.id);
        if(sh) sh.points = item.points.map(p=>new Point(p.x+dx, p.y+dy));
      }
      render();
    }
    return;
  }

  if(drawing){
    let pt = world;
    const startForOrtho = drawing.points[drawing.points.length-1];
    if(drawing.type!=='dim') pt = applyOrtho(startForOrtho, pt);
    
    const excludeId = drawing.id;
    const snapped = computeSnap(pt, excludeId);
    if(drawing.type!=='dim') snapped.point = keepAxis(startForOrtho, pt, snapped.point);
    liveWorld = snapped.point; 
    snapResult = snapped;

    const liveDist = startForOrtho.distanceTo(liveWorld);
    if(directTypedLength.length === 0){
      directInputLabel.textContent = "Çizim Ölçüsü:";
      directInputVal.textContent = fmtLen(liveDist);
    }
    directInputBox.style.display = 'block';

    render();
  } else {
    const snapped = computeSnap(world, null);
    snapResult = snapped;

    if(snapResult && snapResult.marker === 'track' && snapResult.trackBase){
      if(directTypedLength.length === 0){
        directInputLabel.textContent = "Ofset Mesafe:";
        directInputVal.textContent = fmtLen(snapResult.trackDist);
      }
      directInputBox.style.display = 'block';
    } else if(directTypedLength.length === 0){
      directInputBox.style.display = 'none';
    }

    render();
  }
}

function onPointerUp(e){
  if(e.button === 1 || isMiddleMousePan){
    isMiddleMousePan = false;
    panLast = null;
  }
  wrap.releasePointerCapture && wrap.releasePointerCapture(e.pointerId);
  pointers.delete(e.pointerId);
  if(pointers.size<2) pinchStartDist=null;
  if(pointers.size===0 && !isMiddleMousePan) panLast=null;

  if(dragSnapshot){
    if(dragMoved){
      pushHistory();
      autosave();
    }
    dragSnapshot=null; dragMoved=false;
  }
}
function onWheel(e){ e.preventDefault(); zoomAt(localPos(e), e.deltaY<0?1.1:0.9); }

function startPinch(){
  const arr=[...pointers.values()];
  pinchStartDist=Math.hypot(arr[0].x-arr[1].x, arr[0].y-arr[1].y); pinchStartScale=scale;
  pinchStartMid={x:(arr[0].x+arr[1].x)/2,y:(arr[0].y+arr[1].y)/2};
  pinchStartOff={x:offX,y:offY};
}
function updatePinch(){
  const arr=[...pointers.values()];
  if(arr.length<2||!pinchStartDist) return;
  const d=Math.hypot(arr[0].x-arr[1].x, arr[0].y-arr[1].y);
  const newScale=Math.min(60,Math.max(0.2,pinchStartScale*(d/pinchStartDist)));
  const worldAtMid={x:(pinchStartMid.x-pinchStartOff.x)/pinchStartScale,y:(pinchStartMid.y-pinchStartOff.y)/pinchStartScale};
  scale=newScale;
  offX=pinchStartMid.x-worldAtMid.x*scale;
  offY=pinchStartMid.y-worldAtMid.y*scale;
}
function zoomAt(screenPt,factor){
  const world=screenToWorld(screenPt);
  scale=Math.min(60,Math.max(0.2,scale*factor));
  const ns=worldToScreen(world);
  offX += screenPt.x-ns.x; offY += screenPt.y-ns.y;
  render();
}

function handleDrawTap(worldPt){
  if(tool==='line' || tool==='mdf'){
    if(!drawing) {
      drawing={id:'draft',type:tool,points:[worldPt]};
      directInputBox.style.display = 'block';
      if(voiceMode === 'draw'){ voiceDrawBegin(); showToast('🎙 Dinliyor: ölçüyü söyle, çizgiyi bitir', 2500); }
      else showToast(voiceControlOn ? 'Çizim başladı. Yönü verin ve ölçüyü söyleyin.' : 'Çizim başladı. Ölçüyü yazın (örn: 190 veya 190,3)');
    } else {
      if(voiceMode === 'draw' && voiceDrawFinish(worldPt)) return;
      finalizeSimpleShape(worldPt);
    }
  } else if(tool==='rect'){
    if(!drawing) {
      drawing={id:'draft',type:'rect',points:[worldPt]};
    } else {
      pushHistory();
      const p0=drawing.points[0], p1=worldPt;
      const corners=[new Point(p0.x,p0.y), new Point(p1.x,p0.y), new Point(p1.x,p1.y), new Point(p0.x,p1.y)];
      addShape({type:'rect',points:corners});
      drawing=null; liveWorld=null; snapResult=null; feedTrackedPointsFromPoints(corners); autosave();
    }
  } else if(tool==='polyline'){
    if(!drawing) drawing={id:'draft',type:'polyline',points:[worldPt]};
    else{
      const last=drawing.points[drawing.points.length-1];
      if(last.distanceTo(worldPt)<0.01) return;
      drawing.points.push(worldPt);
    }
  } else if(tool==='dim'){
    if(!drawing){ drawing={id:'draft',type:'dim',points:[worldPt],stage:2}; }
    else if(drawing.stage===2){ drawing.points.push(worldPt); drawing.stage=3; }
    else if(drawing.stage===3){
      pushHistory();
      const p0=drawing.points[0], p1=drawing.points[1];
      const off = signedOffsetFromLine(p0,p1,worldPt);
      addShape({type:'dim', points:[p0,p1], offset: off===0?8:off});
      if(hideDims) showToast('Ölçü eklendi, ama ölçüler gizli. Görmek için Ölçü Göster', 3500);
      drawing=null; liveWorld=null; snapResult=null; clearTrackedPoints(); autosave();
    }
  }
  render();
}

function finalizeSimpleShape(secondPt){
  const p0=drawing.points[0];
  if(p0.distanceTo(secondPt)<0.5){ drawing=null; liveWorld=null; snapResult=null; resetDirectInput(); render(); return; }
  pushHistory();
  const isMdf = drawing.type==='mdf';
  const pts = (isMdf && mdfCenter) ? centerShiftPts(p0, secondPt, rawMouseWorld) : [p0, secondPt];
  addShape({type:drawing.type, points:pts, rawCursor: rawMouseWorld, label: '', note: ''});
  drawing=null; liveWorld=null; snapResult=null; resetDirectInput(); feedTrackedPointsFromPoints(pts); autosave();
  if(isMdf && lineOnly) showToast('MDF eklendi ama "Sadece Çizgi" açık olduğu için gizli', 3000);
  else showToast(tool.toUpperCase() + ' tamamlandı' + (isMdf && mdfCenter ? ' (ortadan)' : '') + '.');
}
function addShape(partial){ const s={id:uid(),...partial}; shapes.push(s); return s; }
function finishPolyline(){
  let pts = null;
  if(drawing && drawing.type==='polyline' && drawing.points.length>=2){
    pts = drawing.points.slice();
    pushHistory();
    addShape({type:'polyline',points:pts}); autosave();
  }
  drawing=null; liveWorld=null; snapResult=null; resetDirectInput();
  if(pts) feedTrackedPointsFromPoints(pts); else clearTrackedPoints();
  render();
}

window.addEventListener('keydown',(e)=>{
  if(e.target.tagName === 'INPUT') return;

  if(e.key==='Enter'){
    if(directTypedLength.length > 0){
      commitDirectTypedLength();
      return;
    }
    if(drawing && drawing.type==='polyline') finishPolyline();
  }

  if(e.key==='Escape'){ 
    drawing=null; liveWorld=null; snapResult=null; dragSnapshot=null; hoverTrackPoint=null; clearTrackedPoints(); resetDirectInput(); render(); 
  }

  if((e.ctrlKey || e.metaKey) && e.key==='z'){ undo(); }
  if(!e.ctrlKey && !e.metaKey && !e.altKey){
    if(e.key==='c' || e.key==='C'){ e.preventDefault(); closeToOpposite(); return; }
    if(e.key==='m' || e.key==='M'){ e.preventDefault(); setMdfCenter(!mdfCenter); return; }
  }

  if(drawing || (snapResult && snapResult.marker === 'track' && snapResult.trackBase)){
    if((e.key >= '0' && e.key <= '9') || e.key === '.' || e.key === ','){
      const char = e.key === '.' ? ',' : e.key;
      directTypedLength += char;
      updateDirectInputUI();
    } else if(e.key === 'Backspace'){
      directTypedLength = directTypedLength.slice(0, -1);
      updateDirectInputUI();
    }
  }
});

function updateDirectInputUI(){
  if(directTypedLength.length > 0){
    directInputVal.textContent = directTypedLength + " cm";
    directInputBox.style.display = 'block';
  } else if(drawing && liveWorld){
    const p0 = drawing.points[0];
    directInputLabel.textContent = "Çizim Ölçüsü:";
    directInputVal.textContent = fmtLen(p0.distanceTo(liveWorld));
  } else if(snapResult && snapResult.marker === 'track' && snapResult.trackBase){
    directInputLabel.textContent = "Ofset Mesafe:";
    directInputVal.textContent = fmtLen(snapResult.trackDist);
  }
}

function resetDirectInput(){
  directTypedLength = "";
  directInputBox.style.display = 'none';
}

function commitDirectTypedLength(){
  const mmVal = parseCmInputToMm(directTypedLength);
  
  if(!isNaN(mmVal) && mmVal > 0 && drawing && liveWorld){
    const p0 = drawing.points[0];
    const dx = liveWorld.x - p0.x, dy = liveWorld.y - p0.y;
    const angle = Math.atan2(dy, dx);
    const targetPt = new Point(
      p0.x + Math.cos(angle) * mmVal,
      p0.y + Math.sin(angle) * mmVal
    );
    finalizeSimpleShape(targetPt);
  } 
  else if(!isNaN(mmVal) && mmVal > 0 && !drawing && snapResult && snapResult.marker === 'track' && snapResult.trackBase && snapResult.trackDir){
    const base = snapResult.trackBase;
    const dir = snapResult.trackDir;
    
    const offsetPt = new Point(
      base.x + dir.x * mmVal,
      base.y + dir.y * mmVal
    );
    handleDrawTap(offsetPt);
  }

  resetDirectInput();
}

function hitTestShape(worldPt){
  const tol=12/scale; 
  for(let i=shapes.length-1;i>=0;i--){
    const s=shapes[i];
    if(s.type==='line'){
      if(worldPt.distanceToSegment(s.points[0], s.points[1]) < tol) return s;
    } else if(s.type==='mdf'){
      if(lineOnly) continue;
      const c = getMdfCorners(s.points[0], s.points[1], s.rawCursor);
      for(let j=0; j<4; j++){
        if(worldPt.distanceToSegment(c[j], c[(j+1)%4]) < tol) return s;
      }
    } else if(s.type==='polyline'){
      for(let j=0;j<s.points.length-1;j++) if(worldPt.distanceToSegment(s.points[j], s.points[j+1]) < tol) return s;
    } else if(s.type==='rect'){
      const p=s.points;
      for(let j=0;j<4;j++) if(worldPt.distanceToSegment(p[j], p[(j+1)%4]) < tol) return s;
    } else if(s.type==='dim'){
      if(hideDims) continue;
      const g=dimGeometry(s.points[0],s.points[1],s.offset);
      if(worldPt.distanceToSegment(g.dimP0, g.dimP1) < tol) return s;
    }
  }
  return null;
}

      return { id, points: sh.points.map(p=>new Point(p.x, p.y)) };
    });

  }
  render();

    shapes = shapes.filter(s=>s.id !== hit.id);

function applyLengthEdit(key,newMm){
  const [idStr,seg]=key.split(':');
  const id=parseInt(idStr,10);
  const s=shapes.find(sh=>sh.id===id);
  if(!s) return;
  if(s.type==='line'||s.type==='mdf'){
    const [p0,p1]=s.points; const d=p0.distanceTo(p1)||1;
    const ux=(p1.x-p0.x)/d, uy=(p1.y-p0.y)/d;
    s.points[1]=new Point(p0.x+ux*newMm, p0.y+uy*newMm);
  } else if(s.type==='polyline'){
    const i=parseInt(seg,10);
    const p0=s.points[i], p1=s.points[i+1]; const d=p0.distanceTo(p1)||1;
    const ux=(p1.x-p0.x)/d, uy=(p1.y-p0.y)/d;
    s.points[i+1]=new Point(p0.x+ux*newMm, p0.y+uy*newMm);
  } else if(s.type==='rect'){
    const p=s.points;
    if(seg==='w'){ const dirx=p[1].x>=p[0].x?1:-1; p[1].x=p[0].x+dirx*newMm; p[2].x=p[1].x; }
    else if(seg==='h'){ const diry=p[2].y>=p[1].y?1:-1; p[2].y=p[1].y+diry*newMm; p[3].y=p[2].y; }
  }
}

// ================= ORTADAN ÇİZ / KARŞIYA KAPAT / SADECE ÇİZGİ =================
// Ortadan çiz: çizdiğin çizgi 18 mm MDF'nin MERKEZ ekseni olur (9 mm sağa, 9 mm sola).
// Örn: 2 m tahtanın Midpoint'inden başla -> dikme tam ortaya oturur.
let mdfCenter = false;
try{ mdfCenter = localStorage.getItem('cizgi_mdf_center') === '1'; }catch(e){}
function mdfNormal(p0, p1, rawCursor){
  const dx = p1.x - p0.x, dy = p1.y - p0.y;
  const len = Math.hypot(dx, dy) || 1;
  let nx = -dy/len, ny = dx/len;
  if(rawCursor){
    const cross = dx*(rawCursor.y - p0.y) - dy*(rawCursor.x - p0.x);
    if(cross < 0){ nx = -nx; ny = -ny; }
  }
  return {x:nx, y:ny};
}
function centerShiftPts(p0, p1, rawCursor){
  const n = mdfNormal(p0, p1, rawCursor), h = MDF_THICKNESS/2;
  return [ new Point(p0.x - n.x*h, p0.y - n.y*h), new Point(p1.x - n.x*h, p1.y - n.y*h) ];
}
function updateCenterButton(){
  const b = document.getElementById('btnCenter'); if(b) b.classList.toggle('on', mdfCenter);
}
function setMdfCenter(v){
  mdfCenter = !!v;
  try{ localStorage.setItem('cizgi_mdf_center', mdfCenter ? '1' : '0'); }catch(e){}
  updateCenterButton(); render();
  showToast(mdfCenter ? 'MDF ortadan çizilecek (çizgi = tahtanın merkezi, 9+9 mm)' : 'MDF kenardan çizilecek (normal)', 3000);
}
function updateLineOnlyButton(){
  const b = document.getElementById('btnLineOnly'); if(b) b.classList.toggle('on', lineOnly);
}
function setLineOnly(v){
  lineOnly = !!v;

  updateLineOnlyButton();

  showToast(lineOnly ? 'Sadece çizgiler gösteriliyor (MDF parçaları gizli)' : 'MDF parçaları tekrar gösteriliyor', 2500);
}

// Karşıya kapat (C): çizim yönünde ilerleyip karşıdaki ilk parçanın kenarında biter (AutoCAD'deki gibi hızlı kapatma)
function raySegHit(o, d, a, b){
  const ex = b.x - a.x, ey = b.y - a.y;
  const den = d.x*ey - d.y*ex;
  if(Math.abs(den) < 1e-9) return null;            // paralel
  const t = ((a.x - o.x)*ey - (a.y - o.y)*ex) / den;
  const u = ((a.x - o.x)*d.y - (a.y - o.y)*d.x) / den;
  if(u < -0.001 || u > 1.001) return null;
  return t;
}
function obstacleSegments(){
  const segs = [];
  for(const s of shapes){
    if(!s.points || s.points.length < 2 || s.type === 'dim') continue;
    if(s.type === 'mdf'){
      if(lineOnly) continue;
      const c = getMdfCorners(s.points[0], s.points[1], s.rawCursor);
      for(let i=0;i<4;i++) segs.push([c[i], c[(i+1)%4]]);
    } else if(s.type === 'rect'){
      for(let i=0;i<4;i++) segs.push([s.points[i], s.points[(i+1)%4]]);
    } else {
      for(let i=0;i<s.points.length-1;i++) segs.push([s.points[i], s.points[i+1]]);
    }
  }
  return segs;
}
function closeToOpposite(){
  if(!drawing){ showToast('Önce çizime başla, sonra C (Karşıya) bas', 2500); return; }
  if(drawing.type === 'polyline'){
    if(drawing.points.length >= 3){ drawing.points.push(new Point(drawing.points[0].x, drawing.points[0].y)); finishPolyline(); showToast('Polyline kapatıldı'); }
    else showToast('Kapatmak için en az 3 nokta gerekir');
    return;
  }
  if(drawing.type !== 'line' && drawing.type !== 'mdf') return;
  const p0 = drawing.points[0];
  if(!liveWorld || p0.distanceTo(liveWorld) < 0.5){ showToast('Önce kalemle yön göster (sağa/sola/yukarı/aşağı), sonra C', 3000); return; }
  const L = p0.distanceTo(liveWorld);
  const d = { x:(liveWorld.x - p0.x)/L, y:(liveWorld.y - p0.y)/L };
  // MDF için tahtanın iki yüzünden de ışın at (kalınlık bandı bir yere çarpıyorsa orada dursun)
  const origins = [p0];
  if(drawing.type === 'mdf'){
    const n = mdfNormal(p0, liveWorld, rawMouseWorld), t = MDF_THICKNESS;
    if(mdfCenter){ origins.length = 0; origins.push(new Point(p0.x - n.x*t/2, p0.y - n.y*t/2), new Point(p0.x + n.x*t/2, p0.y + n.y*t/2), p0); }
    else origins.push(new Point(p0.x + n.x*t, p0.y + n.y*t));
  }
  let best = Infinity;
  const segs = obstacleSegments();
  for(const o of origins){
    for(const sg of segs){
      const t = raySegHit(o, d, sg[0], sg[1]);
      if(t !== null && t > 1 && t < best) best = t;
    }
  }
  if(!isFinite(best)){ showToast('Bu yönde karşıda parça bulunamadı', 2500); return; }
  const target = new Point(p0.x + d.x*best, p0.y + d.y*best);
  liveWorld = target;
  finalizeSimpleShape(target);
  showToast('Karşıya kapatıldı: ' + fmtLen(best), 2500);
  render();
}

function fitToView(){
  if(shapes.length===0){ scale=3; offX=40; offY=40; render(); return; }
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  for(const s of shapes) for(const p of s.points){ minX=Math.min(minX,p.x); minY=Math.min(minY,p.y); maxX=Math.max(maxX,p.x); maxY=Math.max(maxY,p.y); }
  const r=wrap.getBoundingClientRect(); const pad=60;
  const w=Math.max(1,maxX-minX), h=Math.max(1,maxY-minY);
  scale=Math.min((r.width-pad*2)/w,(r.height-pad*2)/h,60); scale=Math.max(scale,0.2);
  offX=pad-minX*scale+(r.width-pad*2-w*scale)/2;
  offY=pad-minY*scale+(r.height-pad*2-h*scale)/2;
  render();
}

function isEdgeClosed(pA, pB, currentMdfId, activeShapes){
  const tol = 1.0; 
  for(const s of activeShapes){
    if(s.type !== 'mdf' || s.id === currentMdfId) continue;
    const corners = getMdfCorners(s.points[0], s.points[1], s.rawCursor);
    for(let i=0; i<4; i++){
      const c1 = corners[i], c2 = corners[(i+1)%4];
      if(pA.distanceToSegment(c1, c2) < tol && pB.distanceToSegment(c1, c2) < tol){
        return true; 
      }
    }
  }
  return false;
}

// Kısa (derinlik) kenar başka parçayla birleşiyor/hizalı devam ediyorsa bantsız sayılır
function isEndEdgeHidden(pA, pB, currentMdfId, activeShapes){
  const tol = 1.0;
  const mid = new Point((pA.x+pB.x)/2, (pA.y+pB.y)/2);
  const dx = pB.x-pA.x, dy = pB.y-pA.y, dl = Math.hypot(dx,dy) || 1;
  for(const s of activeShapes){
    if(s.type !== 'mdf' || s.id === currentMdfId) continue;
    const c = getMdfCorners(s.points[0], s.points[1], s.rawCursor);
    // (b) kenar ortası diğer parçanın içinde veya kenarında
    let inside = false;
    for(let i=0,j=3;i<4;j=i++){
      if(((c[i].y>mid.y)!==(c[j].y>mid.y)) && (mid.x < (c[j].x-c[i].x)*(mid.y-c[i].y)/(c[j].y-c[i].y)+c[i].x)) inside=!inside;
    }
    if(inside) return true;
    for(let i=0;i<4;i++){
      const c1=c[i], c2=c[(i+1)%4];
      if(mid.distanceToSegment(c1,c2) < tol) return true;
    }
  }
  return false;
}

// ---------- DOLAPLARA AYIR / BİRLEŞTİR ----------
function translateShape(sh, dx){
  sh.points = sh.points.map(q => new Point(q.x+dx, q.y));
  if(sh.rawCursor) sh.rawCursor = new Point(sh.rawCursor.x+dx, sh.rawCursor.y);
}
function toggleModules(){
  if(shapes.some(sh => sh.sepDx)){
    pushHistory();
    shapes.forEach(sh => { if(sh.sepDx){ translateShape(sh, -sh.sepDx); delete sh.sepDx; } });
    drawing=null; liveWorld=null; snapResult=null; clearTrackedPoints(); autosave(); fitToView();
    showToast('Dolaplar birleştirildi (yan yana, tam ölçü)', 3000);
    return;
  }
  const mdfs = shapes.filter(sh => sh.type==='mdf' && sh.points && sh.points.length>=2);
  const info = computeCabinets(mdfs);
  if(info.count < 2){ showToast('Yan yana en az 2 dolap (üst + alt tahtalı) bulunamadı', 3500); return; }
  const gap = loadCutSettings().gapMm;
  pushHistory();
  const centerX = sh => { const xs = sh.points.map(q=>q.x); return (Math.min(...xs)+Math.max(...xs))/2; };
  shapes.forEach(sh => {
    let k;
    if(sh.type==='mdf' && info.map.has(sh.id)) k = info.map.get(sh.id);
    else {
      const cx = centerX(sh); let bestD = Infinity; k = 1;
      (info.ranges||[]).forEach((rg,i)=>{ const d = cx<rg.a ? rg.a-cx : (cx>rg.b ? cx-rg.b : 0); if(d<bestD){ bestD=d; k=i+1; } });
    }
    const dx = (k-1)*gap;
    if(dx){ translateShape(sh, dx); sh.sepDx = dx; }
  });
  drawing=null; liveWorld=null; snapResult=null; clearTrackedPoints(); autosave(); fitToView();
  showToast(info.count + ' dolap ' + fmtLenPlain(gap) + ' cm aralıkla ayrıldı', 3500);
}

// ---------- MODÜL ÖLÇÜLERİ, KAPAK ve ARKALIK ----------
function moduleInfos(mdfShapes){
  const cab = computeCabinets(mdfShapes);
  const out = [];
  for(let k=1;k<=cab.count;k++){
    const parts = mdfShapes.filter(sh => cab.map.get(sh.id)===k);
    if(!parts.length) continue;
    const boxes = parts.map(sh => { const c=getMdfCorners(sh.points[0], sh.points[1], sh.rawCursor); const xs=c.map(q=>q.x), ys=c.map(q=>q.y); return {minX:Math.min(...xs),maxX:Math.max(...xs),minY:Math.min(...ys),maxY:Math.max(...ys)}; });
    const minX=Math.min(...boxes.map(b=>b.minX)), maxX=Math.max(...boxes.map(b=>b.maxX));
    const minY=Math.min(...boxes.map(b=>b.minY)), maxY=Math.max(...boxes.map(b=>b.maxY));
    const W = maxX-minX, H = maxY-minY;
    // Yüklük adayı: tam genişlikte, üst %12-%45 aralığında tek yatay raf
    const cands = [];
    boxes.forEach(b => {
      const horiz = (b.maxX-b.minX) > (b.maxY-b.minY)*2;
      const full = (b.maxX-b.minX) >= W-40;
      const mid = (b.minY+b.maxY)/2 - minY;
      if(horiz && full && mid > H*0.12 && mid < H*0.45) cands.push(mid);
    });
    out.push({ cab:k, W, H, minX, minY, yukMid: cands.length===1 ? cands[0] : null });
  }
  return out;
}
function moduleDoorPlan(info, st, cfgAll){
  const sig = Math.round(info.W)+'x'+Math.round(info.H);
  let cfg = cfgAll[info.cab];
  if(!cfg || cfg.sig !== sig) cfg = null;
  const autoCols = Math.max(1, Math.ceil(info.W/st.maxDoorMm - 1e-6));
  const plan = {
    sig,
    none: cfg ? !!cfg.none : false,
    cols: cfg && cfg.cols>0 ? cfg.cols : autoCols,
    split: cfg ? !!cfg.split : info.yukMid!==null,
    // Altlı üstlü kapak: varsayılan ayrım tam ortadan (2 m dolap = 1 m alt + 1 m üst); kullanıcı değiştirebilir
    upperMm: cfg && cfg.upperMm>0 ? cfg.upperMm : info.H/2
  };
  plan.rows = [];
  if(plan.split && plan.upperMm > 50 && plan.upperMm < info.H-50){ plan.rows = [plan.upperMm, info.H-plan.upperMm]; }
  else { plan.split = false; plan.rows = [info.H]; }
  return plan;
}
function buildExtraGroups(mdfShapes, separate){
  const st = loadCutSettings(), cfgAll = loadDoorCfg();
  const infos = moduleInfos(mdfShapes);
  const groups = new Map();
  const r1 = v => Math.round(v*10)/10;
  const add = (cab, kind, label, hMm, wMm, count, band) => {
    const key = `${separate?cab:0}|${kind}|${r1(hMm)}|${r1(wMm)}|${band}`;
    if(groups.has(key)){ groups.get(key).count += count; return; }
    groups.set(key, { ids:[], labels:[label], notes:[], count, lengthMm:r1(hMm), depthMm:r1(wMm),
      frontBoyBant:band, rearBoyBant:band, solDerBant:band, sagDerBant:band, cab: separate?cab:1, extra:kind, order: kind==='arkalik'?1:2 });
  };
  infos.forEach(info => {
    if(st.backing) add(info.cab, 'arkalik', 'Arkalık', info.H, info.W, 1, '');
    const plan = moduleDoorPlan(info, st, cfgAll);
    if(st.doors && !plan.none){
      const wDoor = info.W/plan.cols - st.deductMm;
      plan.rows.forEach(rh => add(info.cab, 'kapak', 'Kapak', rh - st.deductMm, wDoor, plan.cols, st.doorBand ? '1' : ''));
    }
  });
  return [...groups.values()];
}

// ================= MENTEŞE KONTROLÜ (raf - menteşe çakışması) =================
// Sadece gösterim/uyarıdır: çizime, kesim listesine, hiçbir ayara dokunmaz.
// Kapaklar kesim listesindeki kapak planından (yan yana / altlı üstlü) hesaplanır.
const HINGE_KEY = 'cizgi_hinge_v1';
let hingeShow = false;
try{ hingeShow = localStorage.getItem('cizgi_hinge_show') === '1'; }catch(e){}
function loadHingeCfg(){
  const def = { mode:'ust', edgeMm:100, secondMm:300, pairMinMm:1600, midMinMm:1200, clearMm:30, singleSide:'sol' };
  try{ const d = JSON.parse(localStorage.getItem(HINGE_KEY)); if(d && typeof d==='object') Object.assign(def, d); }catch(e){}
  return def;
}
function saveHingeCfg(v){ try{ localStorage.setItem(HINGE_KEY, JSON.stringify(v)); }catch(e){} }
// Kapak yüksekliğine göre menteşe merkezleri (kapağın ÜST kenarından mm)
function hingeOffsets(doorH, hc, extra){
  const e = hc.edgeMm;
  let list = [];
  if(hc.mode === 'ust'){
    // Üstte ikili: kapak ağırlığı üst menteşeyi söker, alttaki ise tahtaya bastırır.
    // 2 menteşe: uçlar | 3: uçlar + orta | 4+: üstten e ve ikinci, alttan e, kalanlar arada eşit
    let n = doorH < hc.midMinMm ? 2 : doorH < hc.pairMinMm ? 3 : 4;
    n += (extra || 0);
    if(n === 2) list.push(e, doorH - e);
    else if(n === 3) list.push(e, doorH/2, doorH - e);
    else {
      const a = Math.max(hc.secondMm, e + 70), bEnd = doorH - e;
      list.push(e, a, bEnd);
      const k = n - 3;
      for(let i=1;i<=k;i++) list.push(a + (bEnd - a) * i/(k+1));
    }
  } else if(hc.mode === 'esit'){
    const n = (doorH <= 900 ? 2 : doorH <= 1600 ? 3 : doorH <= 2000 ? 4 : 5) + (extra || 0);
    for(let i=0;i<n;i++) list.push(e + (doorH - 2*e) * i/(n-1));
  } else {
    list.push(e, doorH - e);
    if(doorH >= hc.pairMinMm && hc.secondMm > e) list.push(hc.secondMm, doorH - hc.secondMm);
    if(doorH >= hc.midMinMm) list.push(doorH/2);
    if(extra) list.push(doorH/2 + (hc.secondMm > e ? (doorH/2 - hc.secondMm)/2 : doorH/4));
  }
  list = list.filter(v => v > 20 && v < doorH - 20).sort((a,b)=>a-b);
  const out = [];
  list.forEach(v => { if(!out.length || v - out[out.length-1] > 60) out.push(v); });
  return out;
}
// Dolap başına "Aynalı kapak": o dolabın kapaklarına +1 menteşe
const MIRROR_KEY = 'cizgi_mirror_v1';
function loadMirror(){ try{ return JSON.parse(localStorage.getItem(MIRROR_KEY)) || {}; }catch(e){ return {}; } }
function saveMirror(v){ try{ localStorage.setItem(MIRROR_KEY, JSON.stringify(v)); }catch(e){} }
function mirrorFor(info){ const d = loadMirror()[info.cab]; return !!(d && d.sig === modSig(info) && d.on); }
// Bütün menteşeleri ve çakışmaları hesaplar
function computeHinges(){
  const mdfShapes = shapes.filter(sh => sh.type === 'mdf' && sh.points && sh.points.length >= 2);
  if(!mdfShapes.length) return [];
  const st = loadCutSettings();
  if(!st.doors) return [];
  const hc = loadHingeCfg(), cfgAll = loadDoorCfg();
  const cab = computeCabinets(mdfShapes).map;
  const infos = moduleInfos(mdfShapes);
  const res = [];
  infos.forEach(info => {
    const plan = moduleDoorPlan(info, st, cfgAll);
    if(plan.none) return;
    // Bu dolabın yatay parçaları (raflar, tavan, taban)
    const horiz = mdfShapes.filter(sh => cab.get(sh.id) === info.cab).map(sh => {
      const c = getMdfCorners(sh.points[0], sh.points[1], sh.rawCursor);
      const xs = c.map(q=>q.x), ys = c.map(q=>q.y);
      return { id:sh.id, minX:Math.min(...xs), maxX:Math.max(...xs), minY:Math.min(...ys), maxY:Math.max(...ys) };
    }).filter(b => (b.maxX-b.minX) > (b.maxY-b.minY)*2);
    const dW = info.W / plan.cols, half = st.deductMm/2;
    let top = info.minY;
    plan.rows.forEach((rh, ri) => {
      const doorTop = top + half, doorH = rh - st.deductMm;
      for(let c=0;c<plan.cols;c++){
        // Menteşe tarafı: tek kapakta ayardan; çiftlerde sol kapak solda, sağ kapak sağda
        let side;
        if(plan.cols === 1) side = hc.singleSide === 'sag' ? 'R' : 'L';
        else if(plan.cols % 2 === 1 && c === plan.cols-1) side = 'R';
        else side = (c % 2 === 0) ? 'L' : 'R';
        const edgeX = side === 'L' ? info.minX + c*dW : info.minX + (c+1)*dW;
        hingeOffsets(doorH, hc, mirrorFor(info) ? 1 : 0).forEach(off => {
          const y = doorTop + off;
          let worst = null;
          horiz.forEach(b => {
            // raf bu menteşe tarafındaki yan tahtaya kadar uzanıyor mu?
            const reach = side === 'L' ? (b.minX <= edgeX + MDF_THICKNESS + 40) : (b.maxX >= edgeX - MDF_THICKNESS - 40);
            if(!reach) return;
            const inside = y >= b.minY && y <= b.maxY;
            const dist = inside ? 0 : Math.min(Math.abs(y - b.minY), Math.abs(y - b.maxY));
            if(dist < hc.clearMm && (!worst || dist < worst.dist)) worst = { dist, b };
          });
          res.push({ cab:info.cab, row:ri, col:c, side, x:edgeX, y, offTop:off, offBottom:doorH-off, doorH, rows:plan.rows.length, conflict:worst });
        });
      }
      top += rh;
    });
  });
  return res;
}
function drawHinges(){
  if(!hingeShow) return;
  let hs;
  try{ hs = computeHinges(); }catch(e){ return; }
  const R = 17.5; // 35 mm kase
  ctx.save();
  hs.forEach(h => {
    const cx = h.x + (h.side === 'L' ? 1 : -1) * 22.5;
    const p = worldToScreen(new Point(cx, h.y));
    const r = Math.max(4, R*scale);
    const bad = !!h.conflict;
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI*2);
    ctx.fillStyle = bad ? 'rgba(255,70,70,0.35)' : 'rgba(80,200,120,0.25)';
    ctx.strokeStyle = bad ? '#ff4646' : '#50c878'; ctx.lineWidth = 2;
    ctx.fill(); ctx.stroke();
    // merkez çizgisi
    const e1 = worldToScreen(new Point(h.x, h.y)), e2 = worldToScreen(new Point(h.x + (h.side==='L'?1:-1)*60, h.y));
    ctx.beginPath(); ctx.moveTo(e1.x, e1.y); ctx.lineTo(e2.x, e2.y); ctx.lineWidth = 1; ctx.stroke();
    if(bad){
      const txt = '⚠ Raf ' + (h.conflict.dist < 0.5 ? 'üstünde' : fmtLenPlain(h.conflict.dist) + ' cm');
      ctx.font = '600 11px -apple-system, sans-serif';
      const w = ctx.measureText(txt).width + 10;
      const x = h.side === 'L' ? p.x + r + 4 : p.x - r - 4 - w;
      ctx.fillStyle = 'rgba(16,18,20,0.92)'; roundRect(x, p.y - 9, w, 18, 5); ctx.fill();
      ctx.strokeStyle = '#ff4646'; ctx.stroke();
      ctx.fillStyle = '#ff6b6b'; ctx.textAlign='left'; ctx.textBaseline='middle';
      ctx.fillText(txt, x + 5, p.y + 0.5);
    }
  });
  ctx.restore();
}
// Raf eklenince/taşınınca: YENİ bir menteşe çakışması oluştuysa uyar (gösterim kapalı olsa bile)
let hingeWarn = true;
try{ hingeWarn = localStorage.getItem('cizgi_hinge_warn') !== '0'; }catch(e){}
let hingePrevBad = null;
function hingeBadMap(){
  const mp = new Map();
  computeHinges().forEach(h => { if(h.conflict) mp.set(h.cab+'|'+h.row+'|'+h.col+'|'+Math.round(h.offTop), h); });
  return mp;
}
function hingeWatch(){
  let cur; try{ cur = hingeBadMap(); }catch(e){ return; }
  const prev = hingePrevBad; hingePrevBad = cur;
  if(!hingeWarn || prev === null) return;
  const fresh = [...cur.entries()].filter(([k]) => !prev.has(k)).map(([,h]) => h);
  if(!fresh.length) return;
  const one = h => 'Dolap ' + h.cab + (h.rows > 1 ? (h.row === 0 ? ' üst kapak' : ' alt kapak') : '') + ', alttan ' + fmtLenPlain(h.offBottom) + ' cm';
  const msg = fresh.length === 1
    ? '⚠ Raf menteşeye denk geliyor: ' + one(fresh[0]) + (fresh[0].conflict.dist < 0.5 ? ' (tam üstünde)' : ' (' + fmtLenPlain(fresh[0].conflict.dist) + ' cm yakın)')
    : '⚠ ' + fresh.length + ' menteşe rafa denk geliyor: ' + fresh.slice(0,3).map(one).join(' · ');
  // diğer bildirimlerden ("tamamlandı" vb.) sonra görünsün diye biraz gecikmeli
  setTimeout(()=>showToast(msg + (hingeShow ? '' : ' — 🔩 Menteşe > Göster ile bak'), 5000), 120);
  if(hingeShow) render();
}
function setHingeShow(v){
  hingeShow = !!v;
  try{ localStorage.setItem('cizgi_hinge_show', hingeShow ? '1' : '0'); }catch(e){}
  const b = document.getElementById('btnHinge'); if(b) b.classList.toggle('on', hingeShow);
  render();
  if(hingeShow){
    let hs = []; try{ hs = computeHinges(); }catch(e){}
    const bad = hs.filter(h => h.conflict).length;
    if(!hs.length) showToast('Menteşe yok: kapak bulunamadı (Kesim Ayarları > kapaklar açık olmalı)', 3500);
    else showToast(bad ? '⚠ ' + bad + ' menteşe rafa denk geliyor (kırmızı)' : '✓ ' + hs.length + ' menteşe, rafa denk gelen yok', 3500);
  }
}

const DRAWER_KEY = 'cizgi_drawers_v1';
function loadDrawers(){ try{ return JSON.parse(localStorage.getItem(DRAWER_KEY)) || {}; }catch(e){ return {}; } }
function saveDrawers(v){ try{ localStorage.setItem(DRAWER_KEY, JSON.stringify(v)); }catch(e){} }
function drawerCountFor(info){ const d = loadDrawers()[info.cab]; return (d && d.sig === modSig(info) && d.n > 0) ? d.n : 0; }
// Menteşe / kapak / çekmece / kulp sayımı (dolap dolap)
function computeHardware(mdfShapes){
  const st = loadCutSettings(), cfgAll = loadDoorCfg();
  const infos = moduleInfos(mdfShapes);
  let hs = []; try{ hs = computeHinges(); }catch(e){}
  const per = infos.map(info => {
    const plan = moduleDoorPlan(info, st, cfgAll);
    const doors = (st.doors && !plan.none) ? plan.cols * plan.rows.length : 0;
    const drawers = drawerCountFor(info);
    const hinges = hs.filter(h => h.cab === info.cab).length;
    return { cab:info.cab, doors, drawers, hinges, kulp: doors + drawers };
  });
  const tot = per.reduce((a,x)=>({ doors:a.doors+x.doors, drawers:a.drawers+x.drawers, hinges:a.hinges+x.hinges, kulp:a.kulp+x.kulp }), {doors:0,drawers:0,hinges:0,kulp:0});
  return { per, tot };
}
